<!-- @dsCard group="Shelfcall" height=300 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
  .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px;max-width:560px}
</style>
<div class="col">
  <div data-slot="reason-block">
    <button data-slot="reason-block-trigger">I cannot do this one</button>
  </div>
  <div data-slot="reason-block" data-state="open">
    <p data-slot="reason-block-title">Something happened to the book</p>
    <p data-slot="reason-block-body">Say it now and the courier is stood down before the trip. The reader is told and their request reopens.</p>
    <div data-slot="reason-block-reasons">
      <button data-slot="button" data-variant="outline" data-size="sm">sold in the shop</button>
      <button data-slot="button" data-variant="outline" data-size="sm">cannot find it</button>
      <button data-slot="button" data-variant="outline" data-size="sm">damaged</button>
    </div>
  </div>
  <div data-slot="reason-block" data-state="open">
    <p data-slot="reason-block-title">Something happened to the book</p>
    <p data-slot="reason-block-body">Reason: <strong style="color:var(--foreground)">damaged</strong></p>
    <div data-slot="reason-block-reasons">
      <button data-slot="button" data-variant="destructive" data-size="sm">Yes, do it</button>
      <button data-slot="button" data-variant="ghost" data-size="sm">Never mind</button>
    </div>
  </div>
</div>
