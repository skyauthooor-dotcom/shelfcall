<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
  .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px;max-width:520px}
</style>
<div class="col">
  <div data-slot="alert">
    <p data-slot="alert-title">A courier is coming for it</p>
    <p data-slot="alert-description">Keep it by the counter. They take 5 500 ֏ from the buyer and close the order — no code for deliveries.</p>
  </div>
  <div data-slot="alert" data-variant="destructive">
    <p data-slot="alert-title">Your statement is unpaid</p>
    <p data-slot="alert-description">New requests stop here until it is settled. Your open offers and running orders are not affected.</p>
  </div>
</div>
