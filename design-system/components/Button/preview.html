<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
  .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px;max-width:520px}
  .note{color:var(--muted-foreground);font-size:12px;line-height:16px;margin:2px 0 0}
</style>
<div class="col">
  <div class="wrap">
    <button data-slot="button" data-variant="default">Buy · 4 500 ֏</button>
    <button data-slot="button" data-variant="outline">Add to cart</button>
    <button data-slot="button" data-variant="ghost">Edit</button>
    <button data-slot="button" data-variant="link">Why is this here?</button>
  </div>
  <div class="wrap">
    <button data-slot="button" data-variant="secondary">Print</button>
    <button data-slot="button" data-variant="destructive">Yes, it is gone</button>
    <button data-slot="button" data-variant="default" disabled>Approve</button>
  </div>
  <button data-slot="button" data-variant="default" data-block>Ready for delivery</button>
  <p class="note">One height, 40px, everywhere. The committing action is a solid ink fill and usually full width; importance is carried by fill and width, never by height. There is no accent hue — <strong>border means button</strong>.</p>
</div>
