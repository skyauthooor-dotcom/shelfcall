<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--background);color:var(--foreground)}
  .col{display:flex;flex-direction:column;max-width:420px}
  .pick{display:block;width:100%;text-align:left;background:var(--background);
    border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;cursor:pointer}
  .pick:hover{border-color:var(--foreground)}
  .pick[aria-pressed="true"]{border-color:var(--foreground);box-shadow:inset 0 0 0 1px var(--foreground)}
  .t{margin:0;font-size:16px;line-height:24px;font-weight:600}
  .d{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--muted-foreground)}
  .eg{margin:8px 0 0;font-size:13px;line-height:19px;color:var(--muted-foreground);font-style:italic}
</style>
<div class="col">
  <button class="pick" aria-pressed="true">
    <p class="t">A book you can name</p>
    <p class="d">You know the title, or the author, or the edition. Shops check the shelf and answer with that book.</p>
    <p class="eg">“Master and Margarita, the 1988 edition.”</p>
  </button>
  <button class="pick" aria-pressed="false">
    <p class="t">A book you are describing</p>
    <p class="d">A subject, a mood, half a memory. Shops answer with what they think fits and say why.</p>
    <p class="eg">“Something with a crazy scientist, not too heavy.”</p>
  </button>
</div>
