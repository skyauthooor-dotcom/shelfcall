  /* ---- sales -----------------------------------------------------------------
     One series at a time, in ink, because the product has one colour. Which
     shop is a filter, not a second colour: comparing two shops on one chart
     would need a hue the system does not have, and the ranked list under the
     chart compares them better anyway. */
  function weekStart(ts){
    var d = new Date(ts); d.setHours(0, 0, 0, 0);
    return d.getTime() - ((d.getDay() + 6) % 7) * DAY;
  }
  function salesWeeks(shop, weeks){
    var subs = allSubs().filter(function(x){ return x.sb.status === 'completed' && (!shop || x.sb.seller === shop) });
    var last = weekStart(now);
    var first = weeks ? last - (weeks - 1) * 7 * DAY
      : weekStart(oldestOf(subs, function(x){ return doneAt(x.sb) }) || now);
    var rows = [];
    for (var t = first; t <= last; t += 7 * DAY) rows.push({ from: t, books: 0, sales: 0, orders: 0, cut: 0 });
    subs.forEach(function(x){
      var t = doneAt(x.sb); if (t < first) return;
      var i = Math.min(rows.length - 1, Math.floor((t - first) / (7 * DAY)));
      rows[i].books += x.sb.items.length; rows[i].sales += x.sb.books; rows[i].orders++;
      if (commissionable(x.sb)) rows[i].cut += Math.round(x.sb.books * 0.12);
    });
    return rows;
  }
  function niceTop(max){
    var p = Math.pow(10, Math.floor(Math.log(max) / Math.LN10) - 1), c = [1, 2, 2.5, 5, 10, 20, 25, 50, 100];
    for (var i = 0; i < c.length; i++){ var s = c[i] * p; if (max / s <= 4) return { step: s, top: Math.ceil(max / s) * s } }
    return { step: max, top: max };
  }
  function compact(v){ return v >= 10000 ? Math.round(v / 1000)+'k' : v >= 1000 ? (Math.round(v / 100) / 10)+'k' : String(v) }
  function weekTip(r){
    return 'Week of '+dstr(r.from)+' · '+r.books+' book'+(r.books === 1 ? '' : 's')+' · '+money(r.sales)+
      ' · '+r.orders+' order'+(r.orders === 1 ? '' : 's');
  }
  function weekChart(rows, ms, id){
    /* drawn at the width it will be shown at, so the type stays 10px on a
       laptop instead of being blown up with the picture */
    var app = document.getElementById('app');
    var W = Math.round(Math.max(300, Math.min(900, (app && app.clientWidth ? app.clientWidth : 380) - 40)));
    var H = 168, L = 34, Rt = 6, B = 22, T = 22;
    var vals = rows.map(function(r){ return ms === 'money' ? r.sales : r.books });
    var mx = Math.max.apply(null, vals.concat([0]));
    var nt = niceTop(Math.max(mx, ms === 'money' ? 1000 : 4));
    var ph = H - B - T, n = rows.length, slot = (W - L - Rt) / n;
    var bw = Math.min(24, Math.max(3, slot * 0.62));
    var fmt = function(v){ return ms === 'money' ? compact(v) : String(v) };
    var g = '<g class="grid">';
    for (var t = 0; t <= nt.top + 1e-9; t += nt.step){
      var y = T + ph - t / nt.top * ph;
      g += '<line x1="'+L+'" x2="'+(W - Rt)+'" y1="'+y+'" y2="'+y+'"/>'+
           '<text x="'+(L - 6)+'" y="'+(y + 3.5)+'" text-anchor="end">'+fmt(t)+'</text>';
    }
    g += '</g>';
    var k = Math.max(1, Math.ceil(n / 5)), bars = '';
    rows.forEach(function(r, i){
      var v = vals[i], x = L + i * slot + (slot - bw) / 2, h = v / nt.top * ph, y = T + ph - h, rr = Math.min(4, h, bw / 2);
      var d = h <= 0 ? '' : 'M'+x+','+(T + ph)+' L'+x+','+(y + rr)+' Q'+x+','+y+' '+(x + rr)+','+y+
        ' L'+(x + bw - rr)+','+y+' Q'+(x + bw)+','+y+' '+(x + bw)+','+(y + rr)+' L'+(x + bw)+','+(T + ph)+' Z';
      bars += '<g class="bar'+(i === n - 1 ? ' on' : '')+'" data-tip="'+esc(weekTip(r))+'">'+
        '<rect class="hit" x="'+(L + i * slot)+'" y="'+T+'" width="'+slot+'" height="'+ph+'"/>'+
        (d ? '<path class="b" d="'+d+'"/>' : '')+
        (i === n - 1 && v ? '<text class="val" x="'+(x + bw / 2)+'" y="'+(y - 5)+'" text-anchor="middle">'+fmt(v)+'</text>' : '')+
        ((n - 1 - i) % k === 0 ? '<text x="'+(x + bw / 2)+'" y="'+(H - 6)+'" text-anchor="middle">'+dstr(r.from)+'</text>' : '')+
        '</g>';
    });
    var label = (ms === 'money' ? 'Sales' : 'Books sold')+' per week, '+n+' weeks';
    return '<div class="chart" data-readout="rd_'+id+'">'+
      '<p class="readout" id="rd_'+id+'">'+esc(weekTip(rows[n - 1]))+'</p>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+g+bars+'</svg></div>';
  }
  function tile(label, value){
    return '<div class="tile"><p class="tl">'+esc(label)+'</p><p class="tv">'+value+'</p></div>';
  }
  function salesBlock(shop, picker){
    var wk = +P('wk', 12), ms = P('ms', 'books');
    var rows = salesWeeks(shop, wk);
    var tot = { books: sum(rows, function(r){ return r.books }), sales: sum(rows, function(r){ return r.sales }),
                orders: sum(rows, function(r){ return r.orders }), cut: sum(rows, function(r){ return r.cut }) };
    var h = '<div class="frow">'+(picker ? shopPicker(shop) : '')+
        achips('wk', [['4', '4 weeks'], ['12', '12 weeks'], ['0', 'All time']], String(wk))+'</div>'+
      '<div class="tiles">'+
        tile('Books sold', String(tot.books))+
        tile('Sales', money(tot.sales))+
        tile('Our 12%', money(tot.cut))+
        tile('Orders', String(tot.orders))+
      '</div>'+
      achips('ms', [['books', 'Books'], ['money', 'Money']], ms)+
      weekChart(rows, ms, shop || 'all')+
      '<p class="hint" style="margin:4px 0 0">By the week the book was handed over. Our 12% leaves out free months.</p>';
    if (shop) return h;
    /* who sold it — the comparison a second colour would have tried to make */
    var from = rows[0].from, per = {};
    allSubs().forEach(function(x){
      if (x.sb.status !== 'completed' || doneAt(x.sb) < from) return;
      var p = per[x.sb.seller] || (per[x.sb.seller] = { books: 0, sales: 0 });
      p.books += x.sb.items.length; p.sales += x.sb.books;
    });
    var ids = Object.keys(db.sellers).sort(function(a, b){
      var A = per[a] || { books: 0, sales: 0 }, B2 = per[b] || { books: 0, sales: 0 };
      return ms === 'money' ? B2.sales - A.sales : B2.books - A.books;
    });
    var top = ids.length ? (per[ids[0]] ? (ms === 'money' ? per[ids[0]].sales : per[ids[0]].books) : 0) : 0;
    var showAll = P('allsh', '') === '1', list = showAll ? ids : ids.slice(0, 8);
    h += '<h2>By shop</h2><div class="rowlist">'+list.map(function(k){
      var p = per[k] || { books: 0, sales: 0 }, v = ms === 'money' ? p.sales : p.books;
      return '<button class="row" data-act="aset:shop:'+k+'" style="align-items:center;gap:12px">'+
        '<span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(seller(k).name)+'</span>'+
        '<span class="hbar" aria-hidden="true"><i style="width:'+(top ? Math.max(v ? 2 : 0, v / top * 100) : 0)+'%"></i></span>'+
        '<span class="price" style="min-width:64px;text-align:right">'+(ms === 'money' ? money(v) : v+' book'+(v === 1 ? '' : 's'))+'</span></button>';
    }).join('')+'</div>'+
      (ids.length > 8 && !showAll ? '<button class="btn ghost wide" style="margin-top:12px" data-act="aset:allsh:1">All '+ids.length+' shops</button>' : '')+
      '<p class="hint" style="margin-top:10px">Tap a shop to see its weeks.</p>';
    return h;
  }

  /* ---- the board -------------------------------------------------------
     This is what stands where the clocks stood.

     Nothing on this screen decides anything, and nothing on it is late. It
     is a census: every state a thing in this marketplace can be in, how many
     things are in it, and how long the oldest one has been there. That last
     column is the whole point. "14 requests out with no offer, oldest 9
     days" is a sentence somebody can act on; "7 overdue" was a sentence our
     own arithmetic made up.

     Read it for a few weeks and the rules write themselves — a bucket that
     fills and drains is working, a bucket whose oldest age keeps climbing is
     where the product is broken, and an age that is always the same number is
     where a deadline actually belongs. Until then there are no deadlines.

     Every bucket is printed even when it is empty, because a state nobody is
     ever in is as much of a finding as a state everybody is stuck in. A row
     that has a list behind it opens that list. */
  function census(items, tsOf, buckets){
    return buckets.map(function(b){
      var oldest = null, n = 0;
      items.forEach(function(x){
        if (!b.is(x)) return;
        n++;
        var t = tsOf(x);
        if (t && (oldest === null || t < oldest)) oldest = t;
      });
      return { label: b.label, n: n, oldest: oldest, go: b.go };
    });
  }
  function boardGroups(){
    var subs = allSubs().map(function(x){ return x.sb });
    var cash = subs.filter(function(sb){ return sb.status === 'completed' && sb.delivery === 'courier' });
    return [
      { ttl:'Requests', sub:'what readers have asked for',
        rows: census(db.requests, function(r){ return r.posted }, [
          { label:'waiting for your check', is:function(r){ return r.review === 'waiting' }, go: navAct('a.reqs', 'mod') },
          { label:'sent back to the reader', is:function(r){ return r.review === 'sent back' }, go: navAct('a.reqs', 'mod') },
          { label:'out, nobody has offered', is:function(r){ return r.status === 'open' && reqLive(r) && !liveOffers(r.id).length }, go: navAct('a.reqs', 'ok', 'none') },
          { label:'out, offers waiting on the reader', is:function(r){ return r.status === 'open' && reqLive(r) && liveOffers(r.id).length > 0 }, go: navAct('a.reqs', 'ok', 'offers') },
          { label:'fulfilled', is:function(r){ return r.status === 'fulfilled' }, go: navAct('a.reqs', 'ok', 'fulfilled') },
          { label:'closed', is:function(r){ return r.status === 'closed' }, go: navAct('a.reqs', 'ok', 'closed') }
        ]) },
      { ttl:'Offers', sub:'what shops have answered with',
        rows: census(db.offers, function(o){ return o.sent }, [
          { label:'waiting for your check', is:function(o){ return o.review === 'waiting' }, go: navAct('a.reqs', 'mod') },
          { label:'sent back to the shop', is:function(o){ return o.review === 'sent back' }, go: navAct('a.reqs', 'mod') },
          { label:'with the reader, unopened', is:function(o){ return o.status === 'sent' && offerLive(o) } },
          { label:'read, not acted on', is:function(o){ return o.status === 'seen' && offerLive(o) } },
          { label:'in a cart, not ordered', is:function(o){ return o.status === 'in_cart' && offerLive(o) } },
          { label:'sold', is:function(o){ return o.status === 'done_sold' } },
          { label:'not chosen', is:function(o){ return o.status === 'done_not_chosen' } },
          { label:'withdrawn or taken down', is:function(o){ return o.status === 'removed' || o.status === 'declined' } }
        ]) },
      { ttl:'Orders', sub:'one row per shop in an order',
        rows: census(subs, stateAt, [
          { label:'placed, shop has not confirmed', is:function(sb){ return sb.status === 'placed' }, go: navAct('a.orders', 'open', 'placed') },
          { label:'ready, waiting for a courier', is:function(sb){ return sb.status === 'ready' }, go: navAct('a.orders', 'open', 'ready') },
          { label:'out with a courier', is:function(sb){ return sb.status === 'shipped' && sb.delivery === 'courier' }, go: navAct('a.orders', 'open', 'shipped') },
          { label:'put aside for collection', is:function(sb){ return sb.status === 'shipped' && sb.delivery === 'pickup' }, go: navAct('a.orders', 'open', 'shipped') },
          { label:'delivered or collected', is:function(sb){ return sb.status === 'completed' }, go: navAct('a.orders', 'done') },
          { label:'cancelled', is:function(sb){ return sb.status === 'cancelled' }, go: navAct('a.orders', 'cancelled') },
          { label:'flagged by the buyer, unanswered', is:function(sb){ return sb.disputed && !sb.resolved }, go: navAct('a.orders', 'flagged') }
        ]) },
      { ttl:'Cash to the shops', sub:'delivered courier orders only — a pickup is paid at the counter',
        rows: census(cash, function(sb){ return doneAt(sb) }, [
          { label:'nobody has started counting', is:function(sb){ return shopCash(sb) === 'waiting' }, go: navAct('a.shops', 'open', 'money') },
          { label:'counting, not signed', is:function(sb){ return shopCash(sb) === 'counting' }, go: navAct('a.shops', 'open', 'money') },
          { label:'the two numbers disagree', is:function(sb){ return shopCash(sb) === 'disputed' }, go: navAct('a.shops', 'open', 'money') },
          { label:'signed by both, in their till', is:function(sb){ return shopCash(sb) === 'paid' } }
        ]) },
      { ttl:'Statements', sub:'our 12%, issued on the 15th',
        rows: census(db.invoices, function(x){ return x.issuedAt }, [
          { label:'unpaid', is:function(x){ return x.state === 'due' }, go: navAct('a.shops', 'open', 'unpaid') },
          { label:'paid', is:function(x){ return x.state === 'paid' } },
          { label:'nothing to bill', is:function(x){ return x.state === 'nothing to bill' } }
        ]) }
    ];
  }

  /* ---- applications ------------------------------------------------------- */
  var APP_PARTS = [['name', 'Name and photo', 1], ['about', 'About the shop', 2], ['branch', 'Branch', 3], ['pay', 'Payment', 4]];
  function appPart(k){ return APP_PARTS.filter(function(p){ return p[0] === k })[0] || APP_PARTS[2] }
  function appById(id){ return db.shopApps.filter(function(a){ return a.id === id })[0] }
  /* The note an applicant reads. Drawn by this one function on their own

  function appNotice(state, why, part, previewId){

  function scrOpsApps(){

      aseg('seg', [['waiting', 'To check', by('waiting').length], ['sent back', 'Sent back', by('sent back').length],
                   ['rejected', 'Rejected', by('rejected').length], ['open', 'Opened', by('open').length]], seg)+

        '<p class="small muted" style="margin:0">'+esc(line)+'</p></div>'+
        '<span class="chip dim">'+ago(a.state === 'waiting' ? a.at : (a.decidedAt || a.at))+'</span></button>';

  }
  function shopProfile(it){

          '<p class="small muted" style="margin:0">'+esc(it.bio || 'no description')+'</p></div></div>'+
        it.locations.map(function(l){
          return '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">'+
            '<p style="margin:0">'+esc(l.label)+'</p>'+
            '<p class="small muted" style="margin:2px 0 0">'+esc(l.addr)+' · '+esc(l.hours)+
            ' · '+(l.pickup ? 'does pickup' : 'no pickup')+'</p></div>';
        }).join('')+'</div>'+
      '<div class="card" style="margin-bottom:16px"><p class="eyebrow">What a reader never sees</p>'+
        '<div class="between" style="padding:3px 0"><span class="small muted grow">Paid</span><span class="small">'+

        '<div class="between" style="padding:3px 0"><span class="small muted grow">Email</span>'+
          '<span class="small">'+esc(it.email || 'not given')+'</span></div>'+
        (it.joined ? '<div class="between" style="padding:3px 0"><span class="small muted grow">Registered</span>'+
          '<span class="small">'+dstrY(it.joined)+'</span></div>' : '')+'</div>';
  }
  function scrOpsApp(){
    var ap = appById(view.p.id); if (!ap) return scrOpsApps();
    var STATE = { waiting: 'Waiting for you', 'sent back': 'Sent back — waiting on them', rejected: 'Rejected', open: 'Opened' };
    var h = '<button class="back" data-act="'+navAct('a.apps', ap.state)+'">← Applications</button>'+
      '<h1>'+esc(ap.name)+'</h1>'+
      '<p class="sub">'+STATE[ap.state]+' · asked '+ago(ap.at)+' ago'+(ap.rounds ? ' · sent again after '+ap.rounds+' fix'+(ap.rounds > 1 ? 'es' : '') : '')+'</p>'+

      if (dec === 'back'){
        h += '<p class="small" style="margin:0 0 6px;font-weight:500">Which part needs fixing?</p>'+
          aseg('part', APP_PARTS.map(function(p){ return [p[0], p[1]] }), part)+
          presetChips(presetList())+
          whyField('What should they change, in one sentence?', 'pv_why')+
          '<button class="btn wide" data-act="shopback:'+ap.id+'">Send it back</button>'+
          '<div style="height:12px"></div>'+previewBox(ap.name, appNotice('sent back', view.draft.op_why, part, 'pv_why'));
      }

      h += '<div class="note" style="margin-bottom:12px">Opened '+ago(ap.decidedAt || ap.at)+' ago. '+

  /* ---- requests ----------------------------------------------------------- */
  function reqLine(r){
    var s = shopSplit(r);
    return s.offered.length+' offered · '+s.missed.length+' missed · '+s.unseen.length+' not opened';
  }
  function reqRowAdmin(r, mode){
    var waitingOn = offersFor(r.id).filter(function(o){ return o.review === 'waiting' }).length;
    var chip = mode === 'mod' ? '<span class="chip dim">'+ago(r.posted)+'</span>'
      : waitingOn ? '<span class="chip solid">'+waitingOn+' to check</span>'
      : '<span class="chip dim">'+esc(r.status)+'</span>';
    return '<button class="row" data-go="a.req" data-p="'+r.id+'" style="text-align:left">'+
      '<div class="grow stack"><p class="clamp2" style="margin:0;font-weight:600">'+esc(r.title || r.text)+'</p>'+
      '<p class="small muted" style="margin:0">'+esc(rname(r.reader))+' · '+
        (mode === 'mod' ? 'sent '+ago(r.posted)+' ago'+(r.budget ? ' · up to '+money(r.budget) : '')
                        : (r.status === 'open' ? 'open '+ago(r.passedAt || r.posted) : dstrY(r.posted)))+'</p>'+
      (mode === 'mod' ? '' : '<p class="small muted" style="margin:0">'+reqLine(r)+'</p>')+
      '</div>'+chip+'</button>';
  }
  function offerRowAdmin(o, from){
    var r = req(o.req);
    return '<button class="row" data-go="a.offer" data-p="'+o.id+'"'+(from ? ' data-from="'+from+'"' : '')+' style="text-align:left">'+cover(o, 's')+
      '<div class="grow stack"><p style="margin:0;font-weight:600">'+esc(o.title)+'</p>'+
      '<p class="small muted" style="margin:0">'+esc(seller(o.seller).name)+' · '+money(o.price)+'</p>'+
      (r ? '<p class="small muted clamp2" style="margin:0">for “'+esc(r.title || r.text)+'” · '+esc(rname(r.reader))+'</p>' : '')+
      '</div><span class="chip dim">'+(o.review === 'waiting' ? ago(o.sent) : esc(offerWord(o)))+'</span></button>';
  }
  function scrOpsReqs(){
    var seg = P('seg', 'mod');
    var wr = waitingReqs().sort(function(a, b){ return a.posted - b.posted });
    var wo = waitingOffers().sort(function(a, b){ return a.sent - b.sent });
    var approved = db.requests.filter(reqLive);
    var h = '<h1>Requests</h1>'+
      aseg('seg', [['mod', 'To moderate', wr.length + wo.length], ['ok', 'Approved', approved.length]], seg);
    if (seg === 'mod'){
      var bR = db.requests.filter(function(r){ return r.review === 'sent back' });
      var bO = db.offers.filter(function(o){ return o.review === 'sent back' });

      /* Forty-seven items are not forty-seven trips out and back: one button
         opens the oldest, and every decision opens the next one. */
      if (wr.length + wo.length) h += '<button class="btn wide" style="margin:0 0 6px" data-act="startgate">Start checking · '+(wr.length + wo.length)+'</button>'+
        '<div style="height:12px"></div>';
      if (!wr.length && !wo.length) h += emptyBox('Nothing to moderate', 'New requests and offers land here before anybody else sees them.');
      if (wr.length){ var p1 = paged(wr, 'nr');
        h += '<h2>Requests <span class="segn">· '+wr.length+'</span></h2><div class="rowlist">'+p1.rows.map(function(r){ return reqRowAdmin(r, 'mod') }).join('')+'</div>'+moreBtn(p1) }
      if (wo.length){ var p2 = paged(wo, 'no');
        h += '<h2>Offers <span class="segn">· '+wo.length+'</span></h2><div class="rowlist">'+p2.rows.map(function(o){ return offerRowAdmin(o, 'mod') }).join('')+'</div>'+moreBtn(p2) }
      if (bR.length || bO.length){
        var open = P('showback', '') === '1';
        h += '<button class="opens" style="margin-top:22px" data-act="aset:showback:'+(open ? '' : '1')+'">'+
          '<span class="disc">'+(open ? '▾' : '▸')+' Sent back, waiting on them · '+(bR.length + bO.length)+'</span></button>';
        if (open) h += '<div class="rowlist">'+bR.map(function(r){ return reqRowAdmin(r, 'mod') }).join('')+
          bO.map(function(o){ return offerRowAdmin(o, 'mod') }).join('')+'</div>';
      }
      return h;
    }
    var f = P('f', 'open');
    var fit = {
      all: function(){ return true },
      open: function(r){ return r.status === 'open' },
      offers: function(r){ return r.status === 'open' && liveOffers(r.id).length > 0 },
      none: function(r){ return r.status === 'open' && !liveOffers(r.id).length },
      fulfilled: function(r){ return r.status === 'fulfilled' },
      closed: function(r){ return r.status === 'closed' }
    };
    var cnt = function(k){ return approved.filter(fit[k]).length };
    var list = approved.filter(fit[f] || fit.all).filter(function(r){ return matchQ(r.title, r.text, r.author, rname(r.reader)) })
      .sort(function(a, b){ return b.posted - a.posted });
    var pg = paged(list);
    h += achips('f', [['open', 'Open', cnt('open')], ['offers', 'Has offers', cnt('offers')], ['none', 'No offer yet', cnt('none')],
                      ['fulfilled', 'Fulfilled', cnt('fulfilled')], ['closed', 'Closed', cnt('closed')], ['all', 'All', approved.length]], f)+
      asearch(approved.length, 'Title, author, words or reader');
    if (!list.length) return h + emptyBox('Nothing here', 'Try another filter.');
    return h + '<div class="rowlist">'+pg.rows.map(function(r){ return reqRowAdmin(r, 'ok') }).join('')+'</div>'+moreBtn(pg);
  }

  function readerContext(r){
    var mine = db.requests.filter(function(x){ return x.reader === r.reader && x.id !== r.id });
    var back = mine.filter(function(x){ return x.review === 'sent back' || logFor('request', x.id).some(function(e){ return e.to === 'sent back' }) });
    var bought = allSubs().filter(function(x){ return x.o.reader === r.reader && x.sb.status === 'completed' }).length;
    return '<p class="small muted" style="margin:0 0 16px">'+esc(rname(r.reader))+': '+
      (mine.length ? mine.length+' other request'+(mine.length > 1 ? 's' : '') : 'first request')+
      (back.length ? ' · '+back.length+' sent back before' : '')+
      ' · '+(bought ? bought+' bought' : 'nothing bought yet')+'</p>';
  }
  function scrOpsReq(){
    var r = req(view.p.id); if (!r) return scrOpsReqs();
    var live = reqLive(r);
    var h = '<button class="back" data-act="'+navAct('a.reqs', live ? 'ok' : 'mod')+'">← '+(live ? 'Approved' : 'To moderate')+'</button>'+
      '<h1>'+esc(r.title || 'Request')+'</h1>'+
      '<p class="sub">'+esc(rname(r.reader))+' · sent '+dstrY(r.posted)+' · '+
        (r.review === 'waiting' ? 'waiting for your check' : r.review === 'sent back' ? 'sent back' : esc(r.status))+'</p>'+
      '<div class="card" style="margin-bottom:12px"><p style="margin:0;font-size:16px;line-height:24px">“'+esc(r.text)+'”</p></div>'+
      reqChips(r, true)+readerContext(r);

    if (r.review === 'waiting'){
      return h + '<h2>Your decision</h2>'+
        '<p class="small" style="margin:0 0 12px">No shop has seen this yet.</p>'+
        '<button class="btn wide" data-act="reqpass:'+r.id+'">Send it to the shops</button>'+
        '<p class="small" style="margin:18px 0 6px;font-weight:500">Or send it back with a reason</p>'+
        presetChips(PRESETS.request)+
        whyField('What should they change?', 'pv_why')+
        '<button class="btn ghost wide" data-act="reqback:'+r.id+'">Send it back</button>'+
        '<div style="height:12px"></div>'+previewBox(rname(r.reader), readerBackNote(r.id, view.draft.op_why, 'pv_why'))+
        logBlock('request', r.id);
    }
    if (r.review === 'sent back')
      return h + '<h2>What '+esc(rname(r.reader))+' sees</h2>'+previewBox(rname(r.reader), readerBackNote(r.id, r.reviewWhy))+
        '<p class="hint">It comes back to To moderate when they send it again.</p>'+logBlock('request', r.id);

    /* approved: every shop it reached, in four groups that do not overlap */
    var s = shopSplit(r), sh = P('sh', 'all');
    var first = offersFor(r.id).sort(function(a, b){ return a.sent - b.sent })[0];
    var outAt = r.passedAt || r.posted;
    h += '<p class="small" style="margin:0 0 6px">Out '+ago(outAt)+' · reached '+s.reached.length+' shop'+(s.reached.length === 1 ? '' : 's')+
      (first ? ' · first answer '+ago(now - Math.max(0, first.sent - outAt))+' after it went out' : ' · no answer yet')+'</p>'+
      '<p class="small muted" style="margin:0 0 14px">'+
        (!s.reached.length ? 'It has not reached any shop.'
          : !s.offered.length && !s.missed.length && !s.opened.length ? 'No shop has opened it yet. That points at the shops, not the request.'
          : !s.offered.length && s.missed.length ? s.missed.length+' looked and passed. That points at the request — worth a word with the reader.'
          : '')+'</p>';
    h += '<h2>Shops</h2>'+achips('sh', [['all', 'All', s.reached.length + s.offered.filter(function(k){ return s.reached.indexOf(k) < 0 }).length],
        ['offered', 'Offered', s.offered.length], ['missed', 'Missed', s.missed.length],
        ['opened', 'Opened, no answer', s.opened.length], ['unseen', 'Not opened', s.unseen.length]], sh);
    var rows = [];
    function want(k){ return sh === 'all' || sh === k }
    if (want('offered')) offersFor(r.id).sort(function(a, b){ return a.sent - b.sent }).forEach(function(o){
      rows.push('<button class="row" data-go="a.offer" data-p="'+o.id+'" style="text-align:left">'+cover(o, 's')+
        '<div class="grow stack"><p style="margin:0;font-weight:600">'+esc(seller(o.seller).name)+'</p>'+
        '<p class="small" style="margin:0">'+esc(o.title)+' · '+money(o.price)+'</p>'+
        '<p class="small muted" style="margin:0">'+esc(o.cond)+' · sent '+ago(o.sent)+' ago</p></div>'+
        '<span class="chip'+(o.review === 'waiting' ? ' solid' : ' dim')+'">'+esc(offerWord(o))+'</span></button>');
    });
    function shopRow(k, word){
      return '<button class="row" data-go="a.shop" data-p="'+k+'" style="text-align:left;align-items:center">'+avatar(seller(k), 'sm')+
        '<span class="grow" style="font-weight:600">'+esc(seller(k).name)+'</span><span class="chip dim">'+word+'</span></button>';
    }
    if (want('missed')) s.missed.forEach(function(k){ rows.push(shopRow(k, 'missed')) });
    if (want('opened')) s.opened.forEach(function(k){ rows.push(shopRow(k, 'opened '+ago(r.seenBy[k])+' ago')) });
    if (want('unseen')) s.unseen.forEach(function(k){ rows.push(shopRow(k, 'not opened')) });
    var pg = paged(rows);
    h += rows.length ? '<div class="rowlist">'+pg.rows.join('')+'</div>'+moreBtn(pg) : '<p class="small muted">None.</p>';
    if (r.status === 'open')
      h += '<div class="closer"><label class="f"><span>Take it down — why?</span>'+
          '<input class="in" id="op_why" placeholder="Not a book"></label>'+
          '<button class="btn ghost" data-act="opskillreq:'+r.id+'">Take this request down</button>'+
          '<p class="hint" style="margin-top:8px">The reader is told in these words, and any offers on it are set aside.</p></div>';
    return h + logBlock('request', r.id);
  }

  function scrOpsOffer(){
    var o = offer(view.p.id); if (!o) return scrOpsReqs();

    var flags = [];
    if (r && r.budget && o.price > r.budget) flags.push('Over their budget by '+money(o.price - r.budget));
    if (r && r.cond && r.cond !== 'any' && o.cond !== r.cond) flags.push('They asked for '+r.cond+'; this is '+o.cond);
    var twin = offersFor(o.req).filter(function(x){ return x.id !== o.id && x.seller === o.seller && x.status !== 'removed' }).length;
    if (twin) flags.push(seller(o.seller).name+' sent '+twin+' other offer'+(twin > 1 ? 's' : '')+' on this request');
    var h = (fromMod ? '<button class="back" data-act="'+navAct('a.reqs', 'mod')+'">← To moderate</button>'
                     : '<button class="back" data-go="a.req" data-p="'+o.req+'">← Request</button>')+
      '<h1>'+esc(o.title)+'</h1>'+
      '<p class="sub">'+esc(seller(o.seller).name)+' · '+money(o.price)+' · '+esc(offerWord(o))+
        ' · sent '+ago(o.sent)+' ago'+((o.priceEdits || 0) ? ' · price changed '+o.priceEdits+'×' : '')+'</p>'+
      (r ? '<p class="eyebrow">What '+esc(rname(r.reader))+' asked</p>'+
        '<button class="card asked-card" data-go="a.req" data-p="'+r.id+'" style="display:block;width:100%;text-align:left">'+
          '<p style="margin:0">“'+esc(r.text)+'”</p>'+
          '<p class="small muted" style="margin:6px 0 0">'+(r.budget ? 'up to '+money(r.budget) : 'no budget')+' · '+
            esc(r.cond === 'any' ? 'any condition' : r.cond)+'</p></button>' : '')+
      '<p class="eyebrow" style="margin-top:4px">What the shop sends</p>'+
      '<div class="card" style="margin-bottom:12px">'+
        '<div class="row" style="padding:0;border:none;gap:12px">'+cover(o, 'm')+
        '<div class="grow stack"><p style="margin:0;font-weight:600">'+esc(o.title)+'</p>'+
        '<p class="small" style="margin:0">'+esc(o.author || 'no author given')+(o.year ? ' · '+o.year : '')+'</p>'+
        '<p class="small muted" style="margin:0">'+esc(o.cond)+' · '+esc(loc(o.seller, o.loc).label)+' · '+money(o.price)+'</p></div></div>'+
        (o.note ? '<p class="said" style="margin-top:10px;-webkit-line-clamp:none">“'+esc(o.note)+'”</p>' : '')+
      '</div>'+
      (flags.length ? '<div class="note" style="margin-bottom:12px">'+flags.map(function(x){ return '<p class="small" style="margin:2px 0;color:var(--foreground)">• '+esc(x)+'</p>' }).join('')+'</div>' : '');
    if (o.review === 'waiting'){
      return h + '<h2>Your decision</h2>'+
        '<p class="small" style="margin:0 0 12px">'+esc(r ? rname(r.reader) : 'The reader')+' has not seen this yet.</p>'+
        '<button class="btn wide" data-act="offpass:'+o.id+'">Send it to the reader</button>'+
        '<p class="small" style="margin:18px 0 6px;font-weight:500">Or send it back with a reason</p>'+
        presetChips(PRESETS.offer)+
        whyField('What should the shop fix?', 'pv_why')+

        '<div style="height:12px"></div>'+previewBox(seller(o.seller).name, shopBackNote(o, view.draft.op_why, 'pv_why'))+
        logBlock('offer', o.id);
    }
    if (o.review === 'sent back')
      h += '<h2>What '+esc(seller(o.seller).name)+' sees</h2>'+previewBox(seller(o.seller).name, shopBackNote(o, o.reviewWhy));
    if (['sent', 'seen', 'in_cart'].indexOf(o.status) >= 0 && offerLive(o))
      h += '<div class="closer"><label class="f"><span>Take it down — why?</span>'+

    return h + logBlock('offer', o.id);

  /* ---- orders --------------------------------------------------------------
     "Stuck" used to mean late: past its hour, a day without a courier, past
     the window. Four thresholds, none of them measured. What is left is the
     only kind of stuck this office can actually be sure of — somebody has
     said something is wrong and nobody has answered them. An order sitting in
     one state for a long time is visible as exactly that: its state, and its
     age, on the row. */
  function opsStuck(o, sb){
    if (sb.disputed && !sb.resolved) return 'flagged by the buyer';
    if (sb.status === 'completed' && shopCash(sb) === 'disputed') return 'the cash does not add up';
    return null;
  }
  function orderRowAdmin(x){
    var st = opsStuck(x.o, x.sb);
    return '<button class="row" data-go="a.order" data-p="'+x.sb.no+'" style="text-align:left">'+
      '<div class="grow stack"><p style="margin:0;font-weight:600">#'+esc(x.sb.no)+' <span class="small muted" style="font-weight:400">· '+money(x.sb.total)+'</span></p>'+
      '<p class="small muted" style="margin:0">'+esc(seller(x.sb.seller).name)+' → '+esc(x.o.name || rname(x.o.reader))+'</p>'+
      '<p class="small muted" style="margin:0">'+esc(subWord(x.sb))+' '+dstrY(stateAt(x.sb))+'</p></div>'+
      '<span class="chip'+(st ? ' bad' : ' dim')+'">'+esc(st || stateAge(x.sb))+'</span></button>';
  }
  function scrOpsOrders(){
    var seg = P('seg', 'open'), shop = P('shop', ''), st = P('f', 'all');
    var base = allSubs().filter(function(x){
      return (!shop || x.sb.seller === shop) && matchQ('#'+x.sb.no, x.sb.no, x.o.name, rname(x.o.reader), seller(x.sb.seller).name);
    });
    var G = {
      open: base.filter(function(x){ return ['placed', 'ready', 'shipped'].indexOf(x.sb.status) >= 0 }),
      done: base.filter(function(x){ return x.sb.status === 'completed' }),
      cancelled: base.filter(function(x){ return x.sb.status === 'cancelled' }),
      flagged: base.filter(function(x){ return opsStuck(x.o, x.sb) })
    };
    var opts = [['open', 'Open', G.open.length], ['done', 'Done', G.done.length], ['cancelled', 'Cancelled', G.cancelled.length]];
    if (G.flagged.length || seg === 'flagged') opts.push(['flagged', 'Flagged', G.flagged.length]);
    var h = '<h1>Orders</h1>'+aseg('seg', opts, seg)+
      '<div class="frow">'+shopPicker(shop)+'</div>'+asearch(allSubs().length, 'Order number, reader or shop');
    var list = G[seg] || G.open;
    if (seg === 'open'){
      var c = function(s){ return G.open.filter(function(x){ return x.sb.status === s }).length };
      h += achips('f', [['all', 'All', G.open.length], ['placed', 'Placed', c('placed')], ['ready', 'Ready', c('ready')],
                        ['shipped', 'Out or put aside', c('shipped')]], st);
      if (st !== 'all') list = list.filter(function(x){ return x.sb.status === st });
      /* what has waited longest in its state is what needs eyes */
      list = list.slice().sort(function(a, b){ return stateAt(a.sb) - stateAt(b.sb) });

    } else list = list.slice().sort(function(a, b){ return stateAt(b.sb) - stateAt(a.sb) });
    if (!list.length) return h + emptyBox(seg === 'open' && !shop && !P('q', '') ? 'Nothing open right now' : 'Nothing here',
      shop || P('q', '') ? 'Nothing matches the filters.' : seg === 'open' ? 'Every order is finished or cancelled.' : 'Orders land here as they move.');
    var pg = paged(list);
    return h + '<div class="rowlist">'+pg.rows.map(orderRowAdmin).join('')+'</div>'+moreBtn(pg);
  }

  /* The correction door. Every state the row can legally be in is offered,
     backwards included — the cases that reach a human are the ones nobody
     wrote a rule for, and a short menu of approved fixes is just a list of
     the problems we thought of first.
     What is NOT open is skipping the consequences. The screen works out what
     a change drags with it and says so before anything happens, and the move
     itself runs the same unwind the product runs, so ops cannot leave orders
     the system can no longer explain. */
  var OPS_STATES = ['placed', 'ready', 'shipped', 'completed', 'cancelled'];
  function opsDrag(o, sb, to){
    var bits = [];
    if (to === 'cancelled'){
      bits.push('the shop and the reader are told');
      bits.push('their request reopens and the other offers on it come back');
      if (sb.delivery === 'courier' && shopPaidFor(sb.no))
        bits.push('the office will owe '+esc(db.couriers[sb.courier || 'vahe'].name)+' '+money(sb.books)+', because the shop was already paid');
    }
    if (to === 'completed'){
      bits.push('this records that the book reached '+esc(o.name || rname(o.reader)));
      bits.push('it counts towards the shop’s statement');
      bits.push('no cash is recorded as moved — the handover is still its own two signatures');
    }
    if (to === 'ready' || to === 'shipped') bits.push('the reader’s timeline moves with it');
    if (!bits.length) bits.push('the row moves and everyone watching it is told');
    return bits.join('; ')+'.';
  }
  function scrOpsOrder(){
    var f = null;
    allSubs().forEach(function(x){ if (x.sb.no === view.p.id) f = x });
    if (!f) return scrOpsOrders();
    var o = f.o, sb = f.sb, st = opsStuck(o, sb), to = P('to', '');
    var steps = [['Placed', sb.placedAt], ['Ready', sb.readyAt], [sb.delivery === 'pickup' ? 'Collected' : 'Delivered', sb.status === 'completed' ? doneAt(sb) : null],
                 ['Cancelled', sb.status === 'cancelled' ? (sb.doneAt || null) : null]];
    var row = function(k, v){ return '<div class="between" style="padding:3px 0"><span class="small muted grow">'+k+'</span><span class="small" style="text-align:right">'+v+'</span></div>' };
    return '<button class="back" data-act="'+navAct('a.orders', sb.status === 'completed' ? 'done' : sb.status === 'cancelled' ? 'cancelled' : 'open')+'">← Orders</button>'+
      '<h1>#'+esc(sb.no)+'</h1>'+
      '<p class="sub">'+esc(subWord(sb))+' for '+stateAge(sb)+' · '+(sb.delivery === 'courier' ? 'courier' : 'pickup')+' · '+money(sb.total)+' in cash</p>'+
      (st ? '<div class="note bad" style="margin-bottom:14px"><b>Needs an answer:</b> '+esc(st)+'.</div>' : '')+
      '<div class="card" style="margin-bottom:12px">'+
        row('Shop', '<button class="btn link" style="min-height:0" data-go="a.shop" data-p="'+sb.seller+'">'+esc(seller(sb.seller).name)+'</button>')+
        row('Reader', esc(o.name || rname(o.reader)))+
        row('Books', sb.items.map(function(id){ return esc(offer(id).title) }).join(', '))+
        (o.when && o.when.kind === 'slot' ? row('Reader asked for', esc(dayLabel(o.when.at))+', '+slotLabel(o.when.at)) : '')+
        row('Shop’s money', cashChip(sb))+
      '</div>'+
      '<div class="tl" style="margin:0 0 16px">'+steps.filter(function(s){ return s[1] }).map(function(s){
        return '<div class="done"><i></i>'+s[0]+' · '+dstr(s[1])+', '+hhmm(s[1])+'</div>';
      }).join('')+'</div>'+
      (sb.disputed && !sb.resolved
        ? '<div class="note bad" style="margin-bottom:14px"><b>The buyer flagged this.</b> '+esc(sb.disputeWhy || '')+
          ' The shop’s commission is held until it is settled.'+
          '<label class="f" style="margin-top:10px"><span>Reason</span><input class="in" id="op_why" placeholder="Spoke to both — the book was as described"></label>'+
          '<div class="btns"><button class="btn sm" data-act="opsdisp:'+sb.no+':keep">Dismiss · it counts</button>'+
          '<button class="btn ghost sm" data-act="opsdisp:'+sb.no+':drop">Uphold · waive the commission</button></div></div>'
        : '')+
      '<h2>Correct it</h2>'+
      '<p class="small muted" style="margin:0 0 8px">It is <b>'+esc(sb.status)+'</b>. Move it to:</p>'+
      '<div class="seg" style="margin-bottom:12px">'+OPS_STATES.filter(function(x){ return x !== sb.status }).map(function(x){
        return '<button data-act="opsto:'+x+'" aria-pressed="'+(x === to)+'">'+x+'</button>';
      }).join('')+'</div>'+
      (to
        ? '<div class="note" style="margin-bottom:12px"><b>'+esc(sb.status)+' → '+esc(to)+'.</b> '+opsDrag(o, sb, to)+'</div>'+
          '<label class="f"><span>Why</span><input class="in" id="op_why" placeholder="The courier’s phone died at the door"></label>'+
          '<button class="btn wide" data-act="opsmove:'+sb.no+':'+to+'">Move it to '+esc(to)+'</button>'+
          '<p class="hint" style="margin-top:10px">Everyone affected is told in your words, not a generic notice.</p>'
        : '<p class="hint" style="margin-top:0">Pick a state. What it changes is shown before anything moves.</p>')+
      logBlock('order', sb.no);
  }

  /* ---- shops ---------------------------------------------------------------- */
  function shopFacts(id){
    var sl = seller(id), E = shopEarnings(id), T = shopTerms(id), inv = invoicesFor(id);
    var unpaid = inv.filter(function(x){ return x.state === 'due' });
    var claim = id === db.me.sellerId ? db.account.claim : null;
    var cash = db.settles.filter(function(s){ return s.seller === id && (s.state === 'mismatch' || s.state === 'open') });
    var flag = claim ? ['claim to check', 'bad'] : cash.some(function(s){ return s.state === 'mismatch' }) ? ['counts differ', 'bad']
      : unpaid.length ? ['statement unpaid', 'bad'] : sl.suspended ? ['suspended', 'bad']
      : T.trial ? ['free month · '+T.daysLeft+' d', 'dim'] : ['open', 'dim'];
    return { sl: sl, E: E, T: T, inv: inv, unpaid: unpaid, claim: claim, cash: cash, flag: flag,
             money: !!(claim || cash.length || unpaid.length || E.owed) };
  }
  function scrOpsShops(){
    var seg = P('seg', 'open'), f = P('f', 'all'), sort = P('sort', 'sold');
    var ids = Object.keys(db.sellers);
    var facts = {}; ids.forEach(function(k){ facts[k] = shopFacts(k) });
    var bySeg = ids.filter(function(k){ return seg === 'suspended' ? db.sellers[k].suspended : !db.sellers[k].suspended });
    var fit = {
      all: function(){ return true },
      money: function(k){ return facts[k].money },
      unpaid: function(k){ return facts[k].unpaid.length > 0 },
      trial: function(k){ return facts[k].T.trial }
    };
    var cnt = function(x){ return bySeg.filter(fit[x]).length };
    var list = bySeg.filter(fit[f] || fit.all).filter(function(k){
      var s = db.sellers[k]; return matchQ(s.name, s.email, s.locations.map(function(l){ return l.addr }).join(' '));
    });
    var SORT = {
      sold: function(a, b){ return facts[b].T.soldBooks - facts[a].T.soldBooks },
      owed: function(a, b){ return facts[b].E.owed - facts[a].E.owed },
      name: function(a, b){ return db.sellers[a].name.localeCompare(db.sellers[b].name) },
      newest: function(a, b){ return (db.sellers[b].joined || 0) - (db.sellers[a].joined || 0) }
    };
    list.sort(SORT[sort] || SORT.sold);
    var pg = paged(list);
    var h = '<h1>Shops</h1>'+
      aseg('seg', [['open', 'Open', ids.filter(function(k){ return !db.sellers[k].suspended }).length],
                   ['suspended', 'Suspended', ids.filter(function(k){ return db.sellers[k].suspended }).length]], seg)+
      achips('f', [['all', 'All', bySeg.length], ['money', 'Money to settle', cnt('money')],
                   ['unpaid', 'Statement unpaid', cnt('unpaid')], ['trial', 'Free month', cnt('trial')]], f)+
      '<div class="frow"><select class="in asel" data-filter="sort" aria-label="Sort">'+
        [['sold', 'Most sold this period'], ['owed', 'Most owed to them'], ['name', 'Name'], ['newest', 'Newest']].map(function(o){
          return '<option value="'+o[0]+'"'+(sort === o[0] ? ' selected' : '')+'>'+o[1]+'</option>';
        }).join('')+'</select></div>'+
      asearch(ids.length, 'Name, email or street');
    if (!list.length) return h + emptyBox('Nothing here', 'Try another filter.');
    return h + '<div class="rowlist">'+pg.rows.map(function(k){
      var F = facts[k], sl = F.sl;
      return '<button class="row" data-go="a.shop" data-p="'+k+'" style="text-align:left">'+avatar(sl, 'sm')+
        '<div class="grow stack"><p style="margin:0;font-weight:600">'+esc(sl.name)+'</p>'+
        '<p class="small muted" style="margin:0">'+(F.T.trial ? 'Free month' : 'This period')+' '+money(F.T.soldBooks)+
          (F.E.owed ? ' · owed '+money(F.E.owed) : '')+' · '+soldSubs(k).length+' sold</p></div>'+
        /* "open" on every row of the Open list says nothing; only a state that is news gets a label */
        (F.flag[0] === 'open' ? '' : '<span class="chip '+F.flag[1]+'">'+esc(F.flag[0])+'</span>')+'</button>';
    }).join('')+'</div>'+moreBtn(pg);
  }

  function scrOpsShop(){
    var sl = seller(view.p.id);
    if (!sl){ var ap = appById(view.p.id); if (ap){ view.screen = 'a.app'; return scrOpsApp() } return scrOpsShops() }
    var F = shopFacts(sl.id), E = F.E, T = F.T;
    var line = function(k, v, cls){ return '<div class="between" style="padding:5px 0"><span class="small muted grow">'+k+'</span><span class="price'+(cls ? ' '+cls : '')+'">'+v+'</span></div>' };
    var owedRows = E.rows.filter(function(x){ return shopCash(x.sb) !== 'paid' });
    var h = '<button class="back" data-act="'+navAct('a.shops', sl.suspended ? 'suspended' : 'open')+'">← Shops</button>'+
      '<h1>'+esc(sl.name)+'</h1>'+
      '<p class="sub">'+(sl.suspended ? 'Suspended' : 'Open')+(sl.joined ? ' · registered '+dstrY(sl.joined) : '')+'</p>'+
      (F.flag[1] === 'bad' ? '<span class="chip bad" style="margin:-10px 0 16px">'+esc(F.flag[0])+'</span>' : '');

    /* money first: it is what anybody opening a shop's file is usually here for */
    h += '<h2>Money now</h2><div class="card">'+
      line('Owed to them by couriers', money(E.owed), E.owed ? 'bad-t' : '')+
      (owedRows.length ? '<div style="margin:2px 0 6px">'+owedRows.slice(0, 5).map(function(x){
        return '<div class="between" style="padding:3px 0"><span class="small grow">#'+esc(x.sb.no)+' · '+dstr(doneAt(x.sb))+'</span>'+
          '<span class="small" style="margin-right:8px">'+money(x.sb.books)+'</span>'+cashChip(x.sb)+'</div>';
      }).join('')+(owedRows.length > 5 ? '<p class="small muted" style="margin:2px 0">and '+(owedRows.length - 5)+' more</p>' : '')+'</div>' : '')+
      '<div style="border-top:1px solid var(--border);margin:6px 0"></div>'+
      line(T.trial ? 'Free month' : 'This period', dstr(T.from)+' – '+dstr(T.to))+
      line('Ends', 'in '+T.daysLeft+' day'+(T.daysLeft === 1 ? '' : 's'))+
      line('Sold so far', money(T.soldBooks)+' · '+T.soldCount+' order'+(T.soldCount === 1 ? '' : 's'))+
      line('Our 12% so far', T.trial ? 'none — free month' : money(T.cutSoFar))+
      line('Next statement', dstr(T.statementOn))+
      '<div style="border-top:1px solid var(--border);margin:6px 0"></div>'+
      line('They owe us', F.unpaid.length ? money(sum(F.unpaid, function(x){ return x.amount })) : 'nothing', F.unpaid.length ? 'bad-t' : '')+
      (F.unpaid.length ? '<p class="small muted" style="margin:0">'+F.unpaid.map(function(x){ return 'statement of '+dstr(x.issuedAt)+' unpaid' }).join(' · ')+'</p>' : '')+
    '</div>'+
    (F.claim ? '<button class="row" style="margin-top:10px;border:1px solid var(--border);border-radius:var(--radius-lg)" data-go="a.claim" data-p="claim">'+
      '<span class="grow" style="font-weight:600">They say they paid '+money(F.claim.amount)+'</span><span class="chip bad">to check</span></button>' : '')+
    F.cash.map(function(s){
      return '<button class="row" style="margin-top:10px;border:1px solid var(--border);border-radius:var(--radius-lg)" data-go="a.cash" data-p="'+s.id+'">'+
        '<span class="grow" style="font-weight:600">'+(s.state === 'mismatch' ? 'A handover where the counts differ' : 'A handover counting, not signed')+'</span>'+
        '<span class="chip '+(s.state === 'mismatch' ? 'bad' : 'dim')+'">'+money(s.amount)+'</span></button>';
    }).join('');

    h += '<h2>Sales</h2>'+salesBlock(sl.id, false);

    var subs = allSubs().filter(function(x){ return x.sb.seller === sl.id }).sort(function(a, b){ return stateAt(b.sb) - stateAt(a.sb) });
    h += '<h2>Orders <span class="segn">· '+subs.length+'</span></h2>'+
      (subs.length ? '<div class="rowlist">'+subs.slice(0, 5).map(orderRowAdmin).join('')+'</div>'+
        (subs.length > 5 ? '<button class="btn ghost wide" style="margin-top:12px" data-act="anav:a.orders:done::'+sl.id+'">All '+subs.length+' orders</button>' : '')
        : '<p class="small muted">None yet.</p>');

    h += '<h2>Statements</h2>'+
      (F.inv.length
        ? '<div class="rowlist">'+F.inv.map(function(x){
            return '<div class="row"><div class="grow stack">'+
              '<p style="margin:0;font-weight:600">'+money(x.amount)+'</p>'+
              '<p class="small muted" style="margin:0">'+esc(x.period)+' · 12% of '+money(x.books)+'</p>'+
              '<p class="small muted" style="margin:0">issued '+dstrY(x.issuedAt)+
                (x.paidAt ? ' · paid '+dstrY(x.paidAt)+(x.ref ? ' · '+esc(x.ref) : '') : '')+'</p></div>'+
              '<span class="chip'+(x.state === 'due' ? ' bad' : ' dim')+'">'+esc(x.state)+'</span></div>';
          }).join('')+'</div>'
        : '<div class="empty" style="padding:22px"><p style="margin:0">No statement yet. The first one is issued on '+dstr(T.statementOn)+'.</p></div>');

    h += '<h2>Profile</h2>'+shopProfile(sl);
    h += '<h2>Standing</h2>'+
      '<label class="f"><span>Reason</span>'+
        '<input class="in" id="op_why" placeholder="'+(sl.suspended ? 'What changed' : 'What they did')+'"></label>'+
      '<div class="btns">'+
        (sl.suspended
          ? '<button class="btn" data-act="opsunsuspend:'+sl.id+'">Let them back in</button>'
          : '<button class="btn ghost" data-act="opssuspend:'+sl.id+'">Suspend</button>')+
      '</div>'+
      '<p class="hint" style="margin-top:10px">Suspending stops new requests reaching them. Their live offers stay live and their running orders finish — a shop that cannot deliver what it already promised is a reader’s problem, not a punishment.</p>';
    var app = db.shopApps.filter(function(a){ return (a.owner || a.id) === sl.id })[0];
    return h + logBlock('shop', sl.id) + (app && app.id !== sl.id ? logBlock('shop', app.id) : '');
  }

  /* ---- a busy market, for looking at the screens at the size they are for ----
     Everything above is written for two hundred rows. This fills the market to
     that size — shops, readers, requests at every stage, offers, orders —
     with the same generator as the history, so the lists, filters, search and
     paging can be judged where they matter. Nothing new is invented for it:
     every row is the same kind of row the product makes. */
  var SHOPNAMES = ['Abovyan Books','Kaskad Paper','Saryan Corner','Northern Avenue Books','Vernissage Stall 14','Byuzand Books',
    'Old Atlas','Komitas Readers','Arami Street Books','Pushkin 3','Firdusi Paperbacks','Teryan Shelf','Moskovyan Books',
    'Baghramyan Antiquarian','Zoravar Books','Isahakyan Stall','Leo Street Books','Agatangeghos 7','Nalbandyan Books',
    'Koghbatsi Corner','Tigran Mets Books','Charents 22'];
  function seedBusy(){
    if (db.busy) return;
    var R = seeded(41), plan = {};
    SHOPNAMES.forEach(function(nm, i){
      var id = 'b' + i, joined = now - (12 + Math.floor(R() * 108)) * DAY;

  }

      ["^Every shop is checked by a person before it opens \\u2014 usually the same day\\. We tell you here and by email at (.+)\\.$","Каждый магазин перед открытием проверяет человек — обычно в тот же день. Ответ появится здесь и придёт на $1."],
      ["^Every shop is checked by a person before it opens \\u2014 usually the same day\\. We tell you here and by email\\.$","Каждый магазин перед открытием проверяет человек — обычно в тот же день. Ответ появится здесь и придёт на почту."],
      ["^It is about: name and photo\\.$","Касается: названия и фото."],
      ["^It is about: about the shop\\.$","Касается: описания магазина."],
      ["^It is about: branch\\.$","Касается: точки."],
      ["^It is about: payment\\.$","Касается: оплаты."],
      ["^Fix name and photo$","Исправить название и фото"],
      ["^Fix about the shop$","Исправить описание"],
      ["^Fix branch$","Исправить точку"],
      ["^Fix payment$","Исправить оплату"]
  ].map(function(r){ return [new RegExp(r[0]), r[1]] });

  var RU_SUB = [
      [/\bYerevan\b/g, '\u0415\u0440\u0435\u0432\u0430\u043d'],
      [/\bapt\b/g, '\u043a\u0432.'],
      [/\bMon\u2013Sat\b/g, '\u043f\u043d\u2013\u0441\u0431'],
      [/\bMon\u2013Fri\b/g, '\u043f\u043d\u2013\u043f\u0442'],
      [/\bSat\b/g, '\u0441\u0431'], [/\bSun\b/g, '\u0432\u0441']
  ];

  var DICT = { ru: { x: RU_X, p: RU_P, plural: ruPlural, sub: RU_SUB },
               hy: { x: HY_X, p: [], plural: null, sub: null } };

  /* 1 \u0434\u0435\u043d\u044c \u00b7 2 \u0434\u043d\u044f \u00b7 5 \u0434\u043d\u0435\u0439 \u2014 the rule every Russian screen needs and most
     prototypes skip, which is why they all read "1 \u043f\u0440\u0435\u0434\u043b\u043e\u0436\u0435\u043d\u0438\u0439". */
  function ruPlural(n){
    n = Math.abs(parseInt(n, 10)) || 0;
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 0;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 1;
    return 2;
  }

  /* $1 drops a capture in as it stands; $*1 sends it back through the
     dictionary first, which is what "posted 2 days ago" needs — the phrase
     translates, and the thing inside it translates too. */
  function fill(tpl, mm, D, depth){
    return tpl
      .replace(/\{(\d):([^}]*)\}/g, function(_, idx, forms){
        var f = forms.split('|');
        var k = D.plural ? D.plural(mm[+idx]) : 0;
        return f[Math.min(k, f.length - 1)];
      })
      .replace(/\$\*(\d)/g, function(_, n){
        var raw = mm[+n];
        var deep = (depth|0) > 3 ? null : xlate(raw, D, (depth|0) + 1);
        return deep === null ? raw : deep;
      })
      .replace(/\$(\d)/g, function(_, n){ return mm[+n] });
  }

  function lookup(k, D, depth){
    if (Object.prototype.hasOwnProperty.call(D.x, k)) return D.x[k];
    for (var i = 0; i < D.p.length; i++){
      var mm = k.match(D.p[i][0]);
      if (mm) return fill(D.p[i][1], mm, D, depth);
    }
    return null;
  }

  /* Half the strings on screen are built by joining facts with a middle dot:
     "Dina · Yerevan · posted 2 days ago · 3 offers so far". Translating those
     whole would mean one dictionary entry per combination — per reader, per
     age, per count. So when the whole string is unknown, it is split on the
     separator and each piece is looked up on its own: the name comes through
     untouched, the city and the phrases translate, and a piece nobody has a
     word for stays in English without taking the rest of the line with it.
     Only applied when at least one piece IS known, so a sentence that happens
     to contain a dot is never quietly rebuilt. */
  var SEP = ' · ';
  function xlate(raw, D, depth){
    var k = raw.trim();
    if (!k) return null;
    /* a line ending in a dangling separator is one fact plus punctuation —
       "Aram Books — Mashtots branch ·" is the branch, and a bullet */
    var mTail = k.match(/^(.*\S)\s*\u00b7$/);
    if (mTail){
      var head = xlate(mTail[1], D, depth);
      if (head !== null) return raw.replace(mTail[1], head.trim());
    }
    /* a quoted line is the quotes plus a string we may well know */
    var mQ = k.match(/^([“«→]\s?)([\s\S]*?)([”»]?)$/);
    if (mQ && (mQ[1] || mQ[3])){
      var innerQ = xlate(mQ[2], D, depth);
      if (innerQ !== null) return raw.replace(k, mQ[1] + innerQ.trim() + mQ[3]);
    }
    var hit = lookup(k, D, depth);
    if (hit !== null) return raw.replace(k, hit);
    /* a line the app cut short: "<the first 58 characters of something>…".
       Find the string it was cut from, translate that, and cut the Russian to
       the same length — otherwise every truncated title on the screen stays
       in English while its untruncated twin two rows down is translated. */
    if (k.slice(-1) === '…' && k.length > 12){
      var stem = k.slice(0, -1).replace(/\s+$/, '');
      if (!D.keys) D.keys = Object.keys(D.x);
      for (var q = 0; q < D.keys.length; q++){
        if (D.keys[q].indexOf(stem) === 0){
          var full = D.x[D.keys[q]];
          return raw.replace(k, full.slice(0, stem.length).replace(/\s+$/, '') + '…');
        }
      }
    }
    if (k.indexOf(SEP) > 0){
      var parts = k.split(SEP), any = false;
      var done = parts.map(function(part){
        var t = part.trim();
        var sub = t ? lookup(t, D, depth) : null;
        if (sub !== null){ any = true; return part.replace(t, sub); }
        return part;
      });
      if (any) return raw.replace(k, done.join(SEP));
    }
    /* last resort: a handful of words that appear INSIDE otherwise untouchable
       strings — seed addresses, mostly. Deliberately tiny: a substring list is
       the part of any translation layer that goes wrong quietly. */
    if (D.sub){
      var out = k, hitAny = false;
      D.sub.forEach(function(r){
        if (r[0].test(out)){ out = out.replace(r[0], r[1]); hitAny = true; }
      });
      if (hitAny) return raw.replace(k, out);
    }
    return null;
  }

  /* one pass over what is on screen, after it is on screen */
  function i18n(){
    var D = DICT[db.lang];
    if (!D) return;
    ['app', 'bar', 'tabbar', 'sheet'].forEach(function(id){
      var root = document.getElementById(id);
      if (!root) return;
      var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n, todo = [];
      while ((n = w.nextNode())) todo.push(n);
      todo.forEach(function(node){
        var out = xlate(node.textContent, D);
        if (out !== null) node.textContent = out;
      });
      ['[placeholder]', '[aria-label]'].forEach(function(sel){
        var attr = sel.slice(1, -1);
        root.querySelectorAll(sel).forEach(function(el){
          var out = xlate(el.getAttribute(attr), D);
          if (out !== null) el.setAttribute(attr, out);
        });
      });
      root.querySelectorAll('option').forEach(function(el){
        var out = xlate(el.textContent, D);
        if (out !== null) el.textContent = out;
      });
    });
  }

     that has to do the explaining. Two kinds, deliberately different:

       first run — they have never had one of these. The screen teaches the
                   model in one breath and offers the single action.
       for now   — they have had them before and have none today. No lesson,
                   just what lands here and the way back.

     reads as a screen that failed to load. */
  /* ONE LINE AND ONE BUTTON. The first draft of these explained the whole
     product in three sentences with a footnote under the button, which is a
     paragraph nobody reads standing in a shop — and a wall of text on an empty

     two places that genuinely need a second line, and used almost nowhere. */
  function emptyBox(title, body, action, foot){

  /* ---- the bookseller's four screens ---- */

  /* ---- the application, from the shop's side ----------------------------------
     A shop that has registered is not open until a person has looked at it.
     Until then this is the only screen it has: what it sent, and where it
     stands. When the answer is "fix one thing", the sentence the admin wrote
     is here, the part it is about is named, and one button takes the shop to

     the reason is here too, in the same words — a rejection with no
     sentence is how a marketplace loses the side it cannot replace.

     The same appNotice() draws this note in the admin's preview, so what the
     admin sees before sending is exactly what lands here. */
  function myApp(){

  function readerBackNote(rid, why, previewId){

  function appSent(ap){

  function scrApply(){

    return h + appNotice('rejected', ap.why);
  }
  /* the form, opened at the part that needs work, with everything else kept */
  function appDraft(ap, step){
    var l = ap.locations[0] || {};

        '<p class="pick-t">Pay me when they collect</p>'+
        '<p class="pick-d">The courier hands you the books total as they take the book. Safer if you have not worked with us yet.</p></button>'+
      '<button class="btn wide" style="margin-top:8px" data-act="finishreg">Send for checking</button>'+
      '<p class="hint" style="margin-top:10px">A person checks every shop before it opens \u2014 usually the same day. Your free month starts with your first offer, not today.</p>';
  }

  /* ============================== actions ==============================
 */
  var SCREENS = {
    'r.requests':scrReqList, 'r.new':scrNew, 'r.request':scrRequest, 'r.offer':scrOffer, 'r.seller':scrSeller,
    'r.cart':scrCart, 'r.checkout':scrCheckout, 'r.placed':scrPlaced, 'r.orders':scrOrders, 'r.when':scrOrderWhen, 'r.review':scrReview,
    's.feed':scrFeed, 's.missed':scrMissed, 's.request':scrSellerRequest, 's.newoffer':scrNewOffer, 's.offers':scrMyOffers,
    's.pay':scrPay, 's.orders':scrSellerOrders, 's.order':scrSellerOrder, 's.reviews':scrSellerReviews, 's.stats':scrSellerStats, 's.billing':scrBilling, 's.earn':scrEarn,
    'c.jobs':scrCourierJobs, 'c.job':scrCourierJob, 'c.done':scrCourierDone,
    'a.work':scrOpsWork, 'a.shops':scrOpsShops, 'a.shop':scrOpsShop, 'a.apps':scrOpsApps, 'a.app':scrOpsApp, 's.apply':scrApply,
    'a.reqs':scrOpsReqs, 'a.req':scrOpsReq, 'a.offer':scrOpsOffer,
    'a.orders':scrOpsOrders, 'a.order':scrOpsOrder, 'a.claim':scrOpsClaim, 'a.cash':scrOpsCash,
    'x.notifs':scrNotifs, 'x.settings':scrSettings, 's.location':scrLocation, 'x.auth':scrAuth, 's.reg':scrReg
  };

  function readDraft(){
    ['f_title','f_author','f_text','f_budget','o_title','o_author','o_year','o_price','o_note','o_pub','o_edition','o_lang','o_pages'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) view.draft[id.slice(2)] = el.value;
    });
    var c = document.getElementById('f_cond'); if (c) view.draft.cond = c.value;
    var oc = document.getElementById('o_cond'); if (oc) view.draft.cond = oc.value;
    var ob = document.getElementById('o_binding'); if (ob) view.draft.binding = ob.value;
    var rv = document.getElementById('rv_text'); if (rv) view.draft.rvtext = rv.value;
    ['p_name','p_phone','p_addr','p_shop','p_bio','p_cphone','l_label','l_addr','l_hours',
     'g_shop','g_bio','g_label','g_addr','g_hours','a_email','a_pass','p_ref',
     'cash_code','cash_got','op_why','op_amt'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) view.draft[id] = el.value;
    });
    ['c_name','c_phone','c_addr','c_note'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) view.draft[id.slice(2)] = el.value;
    });
  }

  /* the oldest thing still waiting at the same gate, or the list if none is */
  function nextAtGate(kind, msg){
    var nr = waitingReqs().sort(function(x, y){ return x.posted - y.posted })[0];
    var no = waitingOffers().sort(function(x, y){ return x.sent - y.sent })[0];
    /* when one queue runs dry the other one carries on */
    if (kind === 'request' && !nr && no) kind = 'offer';
    if (kind === 'offer' && !no && nr) kind = 'request';
    var nx = kind === 'request' ? nr : no;
    if (nx){ go(kind === 'request' ? 'a.req' : 'a.offer', kind === 'offer' ? { id: nx.id, from: 'mod' } : { id: nx.id }); toast(msg + ' \u00b7 next one'); }
    else { go('a.reqs', {}); view.p.seg = 'mod'; toast(msg + ' \u00b7 nothing else waiting'); }
  }
  function act(name, a, b, c, e4){
    var d = view.draft;
    if (name !== 'unconfirm') view.confirm = null;
    if (name === 'unconfirm'){ view.confirm = null; render(); return; }
    switch(name){
      case 'sheetclose': { view.sheet = null; render(); break; }
      case 'startgate': {
        var g1 = waitingReqs().sort(function(x, y){ return x.posted - y.posted })[0];
        var g2 = waitingOffers().sort(function(x, y){ return x.sent - y.sent })[0];
        if (g1) go('a.req', { id: g1.id }); else if (g2) go('a.offer', { id: g2.id, from: 'mod' });
        break;
      }
      case 'sheetreason': { if (view.sheet) view.sheet.picked = decodeURIComponent(a); render(); break; }
      case 'sheetgo': {
        var sh0 = view.sheet; if (!sh0) break;
        if (sh0.reasons && sh0.picked){ view.why = sh0.picked; view.whyFor = sh0.act; }
        var parts0 = String(sh0.act).split(':');
        view.sheet = null;
        var dlg0 = document.getElementById('sheet'); if (dlg0 && dlg0.open) dlg0.close();
        act(parts0[0], parts0[1], parts0[2]);
        break;
      }
      case 'kind': readDraft(); d.kind = a;
        if (view.screen === 'r.new' && d.rstep === 1){ d.rstep = 2; window.scrollTo(0,0); }
        render(); break;
      case 'loc': readDraft(); d.loc = a; render(); break;
      case 'another': { view.draft = { step:0, loc:d.loc }; view.p = { id:a }; render(); break; }
      case 'step': {
        readDraft();
        var to = parseInt(a,10);
        /* leaving the book screen at all needs a title */
        if (d.step === 1 && to !== 4 && to !== 0 && !(d.title||'').trim()){
          d.err = 'Which book is it? A title, at least.'; render(); return; }
        d.err = null; d.step = to; window.scrollTo(0,0); render(); break;
      }
      case 'rstep': {
        readDraft();
        var rto = parseInt(a,10);
        if (rto === 3){
          var text = (d.text||'').trim(), ttl = (d.title||'').trim();
          if (d.kind==='open' && text.length<10){ d.err='Tell them a little more \u2014 ten characters at least.'; render(); return; }
          if (d.kind==='concrete' && !ttl){ d.err='A title, at least. Everything else is optional.'; render(); return; }
        }
        d.err = null; d.rstep = rto; window.scrollTo(0,0); render(); break;
      }
      case 'feed': view.p.filter = a; render(); break;
      /* ---- ops -----------------------------------------------------------
         Every one of these reads a reason first and refuses without it. The
         reason is the only part of a correction a rule could never have
         supplied, so it is the only part that cannot be skipped. */
      case 'opsto': view.p.to = a; render(); break;
      /* ---- admin lists: segment, chip, page, and links into a filtered list */
      case 'aset': {
        readDraft();
        view.p[a] = b;
        ['n', 'nr', 'no'].forEach(function(k){ if (k !== a) delete view.p[k] });
        if (a === 'seg'){ delete view.p.f; delete view.p.q; }
        if (a === 'dec' || a === 'part'){ /* the words typed so far are kept */ }
        render(); break;
      }
      case 'amore': { view.p[a] = (view.p[a] || PAGE) + PAGE; render(); break; }
      case 'anav': {
        go(a, {}); if (b) view.p.seg = b; if (c) view.p.f = c; if (e4) view.p.shop = e4;
        render(true); break;
      }
      case 'apreset': {
        readDraft();
        var pl = presetList()[+a]; if (!pl) break;
        view.draft.op_why = pl.text; render(); break;
      }
      case 'busy': { if (db.busy) return; seedBusy(); go(HOME[db.me.role] || 'r.requests'); toast('Busy: many requests, offers and orders'); break; }
      case 'light': {
        if (!db.busy) return;
        try { sessionStorage.setItem('sc_role', db.me.role) } catch(err){}
        location.reload(); break;
      }
      /* the shop's own side of its application */
      case 'appfix': case 'appedit': {
        var apF = myApp(); if (!apF) break;
        view.screen = 's.reg'; view.p = {};
        view.draft = appDraft(apF, name === 'appfix' ? appPart(apF.part)[2] : 1);
        window.scrollTo(0, 0); render(); break;
      }
      /* ---- the two gates -------------------------------------------------
         Passing something through needs no words: letting a request reach the
         shops is agreeing with it, and there is nothing to explain. Sending
         it back is the opposite \u2014 it is work we are asking somebody else to
         do, and "rejected" with no sentence is how a marketplace loses the
         side it cannot replace. So one of the two needs a reason, and it is
         always the same one. */
      case 'reqpass': {
        var rP = req(a); if (!rP) break;
        rP.review = 'passed'; rP.reviewWhy = null; rP.passedAt = Date.now();
        logOps('request', rP.id, 'waiting', 'sent to the shops', '');
        nextAtGate('request', 'Out \u2014 every shop has it now'); break;
      }
      case 'reqback': {
        readDraft();
        var rB = req(a); if (!rB) break;
        var whyRB = (view.draft.op_why || '').trim();
        if (!whyRB){ toast('Say what to fix \u2014 the reader reads these words'); break; }
        rB.review = 'sent back'; rB.reviewWhy = whyRB;
        logOps('request', rB.id, 'waiting', 'sent back', whyRB);
        nextAtGate('request', 'Back to the reader, with your sentence'); break;
      }
      case 'offpass': {
        var oP = offer(a); if (!oP) break;
        oP.review = 'passed'; oP.reviewWhy = null; oP.passedAt = Date.now();
        logOps('offer', oP.id, 'waiting', 'sent to the reader', '');
        nextAtGate('offer', 'Out \u2014 the reader can see it'); break;
      }
      case 'offback': {
        readDraft();
        var oB = offer(a); if (!oB) break;
        var whyOB = (view.draft.op_why || '').trim();
        if (!whyOB){ toast('Say what to fix \u2014 the shop reads these words'); break; }
        oB.review = 'sent back'; oB.reviewWhy = whyOB;
        logOps('offer', oB.id, 'waiting', 'sent back', whyOB);
        nextAtGate('offer', 'Back to the shop, with your sentence'); break;
      }
      /* the reader's way back in after a request was sent back */
      case 'resend': {
        var rR = req(a); if (!rR) break;
        rR.review = 'waiting'; rR.reviewWhy = null; rR.posted = Date.now();
        toast('With us again'); render(); break;
      }
      case 'shopopen': case 'shopback': case 'shopno': {
        readDraft();
        var ap = db.shopApps.filter(function(x){ return x.id === a })[0];
        if (!ap) break;
        var why = (view.draft.op_why || '').trim();
        if (name !== 'shopopen' && !why){ toast(name === 'shopno' ? 'Say why \u2014 they read these words' : 'Say what they should fix'); break; }
        ap.decidedAt = Date.now();
        if (name === 'shopopen'){
          if (ap.owner && db.sellers[ap.owner]){
            /* an existing account that registered: its details become the shop's */
            var so = db.sellers[ap.owner];
            so.name = ap.name; so.bio = ap.bio || ''; so.payMode = ap.payMode || 'after';
            if (ap.avatar) so.avatar = ap.avatar;
            so.locations = ap.locations.slice(); so.reviews = []; so.joined = Date.now();
            so.since = String(new Date().getFullYear()); so.suspended = false;
            if (ap.owner === db.me.sellerId){ db.account.state = 'trial'; db.account.trialStart = Date.now(); }
          } else {
            db.sellers[ap.id] = { id:ap.id, name:ap.name, since:String(new Date().getFullYear()),
              orders:0, avatar:ap.avatar||null, bio:ap.bio||'', locations:ap.locations.slice(), joined: Date.now(),
              trialStart: Date.now(), payMode:ap.payMode||'after', reviews:[], email:ap.email, missed: [] };
          }
          ap.state = 'open'; logOps('shop', ap.id, 'waiting', 'open', why || 'Everything checked out');
          toast('Open \u2014 requests start reaching them now');
          go('a.shop', { id: ap.owner || ap.id }); break;
        } else if (name === 'shopback'){
          ap.state = 'sent back'; ap.why = why; ap.part = P('part', 'branch');
          logOps('shop', ap.id, 'waiting', 'sent back \u2014 '+appPart(ap.part)[1].toLowerCase(), why);
          toast('Sent back \u2014 they land on that part of the form');
        } else {
          ap.state = 'rejected'; ap.why = why;
          logOps('shop', ap.id, 'waiting', 'rejected', why);
          toast('Rejected \u2014 they have been told why');
        }
        var nxA = db.shopApps.filter(function(x){ return x.state === 'waiting' }).sort(function(x, y){ return x.at - y.at })[0];
        if (nxA) go('a.app', { id: nxA.id }); else { go('a.apps', {}); view.p.seg = 'waiting'; render(); }
        break;
      }
      case 'opssuspend': case 'opsunsuspend': {
        readDraft();
        var sS2 = seller(a); if (!sS2) break;
        var whyS = (view.draft.op_why || '').trim();
        if (!whyS){ toast('A suspension needs a reason they can read'); break; }
        var wasS = sS2.suspended ? 'suspended' : 'open';

    }
    card.addEventListener('pointerdown', function(e){
      if (e.target.closest && e.target.closest('button,a,input,textarea,select')) return;
      down = true; moved = false; dx = 0; sx = e.clientX; sy = e.clientY; pid = e.pointerId;
      try { card.setPointerCapture(pid) } catch(err){}
    });
    card.addEventListener('pointermove', function(e){
      if (!down) return;
      dx = e.clientX - sx;
      var dy = e.clientY - sy;
      if (!moved){
        if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
        if (Math.abs(dy) > Math.abs(dx)){ down = false; return; }   /* the page, not the card */
        moved = true;
      }
      if (e.cancelable) e.preventDefault();
      card.style.transform = 'translateX('+dx+'px) rotate('+(dx/28)+'deg)';
      var p = Math.min(Math.abs(dx) / SWIPE_AT, 1);
      yes.style.opacity = dx > 0 ? p : 0;
      no.style.opacity  = dx < 0 ? p : 0;
    });
    function up(){
      if (!down) return;
      down = false;
      try { card.releasePointerCapture(pid) } catch(err){}
      if (moved && Math.abs(dx) > SWIPE_AT) return flyOut(card, dx > 0);
      if (moved) reset();
    }
    card.addEventListener('pointerup', up);
    card.addEventListener('pointercancel', up);
    card.addEventListener('lostpointercapture', up);
  }

  function render(moved){
    if (db.me.role === 'seller' && myApp() && ['s.reg','x.auth','x.settings','x.notifs'].indexOf(view.screen) < 0)
      view.screen = 's.apply';
    renderBar();
    renderSide();
    renderTabbar();
    setTimeout(renderSheet, 0);
    var fn = SCREENS[view.screen] || scrReqList;
    var html = fn();
    if (view.toast) html += '<div class="toast" role="status">'+esc(view.toast)+'</div>';
    var app = document.getElementById('app');
    app.innerHTML = html;
    app.classList.toggle('bottom-act', !!app.querySelector('.page-tail'));
    i18n();
    wireDeck();
    if (moved){
      var h = app.querySelector('h1');
      if (h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
    }
  }

  document.addEventListener('click', function(e){
    if (!e.target || !e.target.closest) return;
    var g = e.target.closest('[data-go]');
    var a = e.target.closest('[data-act]');
    if (a){
      var parts = a.getAttribute('data-act').split(':');
      act(parts[0], parts[1], parts[2], parts[3], parts[4]);
      return;
    }
    if (g){
      var p = g.getAttribute('data-p');
      var op = g.getAttribute('data-open');
      var fr = g.getAttribute('data-from');
      go(g.getAttribute('data-go'), p ? (fr ? {id:p, from:fr} : {id:p}) : {});
      if (op){ view.open = op; render(); }
      return;
    }
    var k = e.target.closest('[data-ask]');
    if (k){
      var act0 = k.getAttribute('data-ask');
      var rs = k.getAttribute('data-ask-reasons');
      var cp = sheetCopy(act0, k.getAttribute('data-ask-label'));
      view.sheet = {
        act: act0,
        title: k.getAttribute('data-ask-title') || cp.title,
        body: k.getAttribute('data-ask-body') || cp.body,
        confirm: k.getAttribute('data-ask-label') || (rs ? 'Yes, do it' : cp.confirm),
        reasons: rs ? rs.split('|') : null,
        picked: null
      };
      render();
    }
  });
  /* Esc and the backdrop are the same "no" as the Keep it button, so they go
     through one place: close the dialog, and let the close event clear the
     state. Nothing destructive can happen on a dismissal path. */
  (function(){
    var dlg = document.getElementById('sheet');
    if (!dlg) return;
    dlg.addEventListener('close', function(){ if (view.sheet){ view.sheet = null; render(); } });
    dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });
  })();

  document.addEventListener('input', function(e){
    if (['c_name','c_phone','c_addr'].indexOf(e.target.id) < 0) return;
    var btn = document.getElementById('toReview'); if (!btn) return;
    readDraft();
    var needAddr = cartGroups().some(function(g){ return g.delivery==='courier' });
    var ok = readyToReview(view.draft.name, view.draft.phone, view.draft.addr, needAddr);
    btn.disabled = !ok;
    var hint = document.getElementById('toReviewHint');
    if (hint) hint.textContent = ok ? '' : 'Fill the fields above and this opens.';
  });

  document.addEventListener('change', function(e){
    if (e.target.id === 'photoIn'){
      var files = Array.prototype.slice.call(e.target.files || []);
      if (!view.draft.photos) view.draft.photos = [];
      files.slice(0, 5 - view.draft.photos.length).forEach(function(f){
        try { view.draft.photos.push(URL.createObjectURL(f)) } catch(err){}
      });
      render();
      return;
    }
    if (e.target.id === 'avIn'){
      var af = (e.target.files || [])[0];
      if (af){ try {
        var u = URL.createObjectURL(af);
        if (view.screen === 's.reg') view.draft.avatar = u;
        else { seller(db.me.sellerId).avatar = u; toast('Photo saved'); }
      } catch(err){} }
      render();
      return;
    }
    /* a list's own filters: the shop picker, the sort, the search box */
    var flt = e.target.getAttribute && e.target.getAttribute('data-filter');
    if (flt){
      view.p[flt] = e.target.value;
      ['n', 'nr', 'no', 'allsh'].forEach(function(k){ delete view.p[k] });
      render(); return;
    }
  });

  /* the history, the statements it bills, and the one that has not been paid */
  (function(){
    var R = seeded(7);
    seedHistory({ aram:   { from: db.account.trialStart, rate: .5 },
                  nairi:  { from: db.sellers.nairi.trialStart, rate: .4 },
                  grigor: { from: db.sellers.grigor.trialStart, rate: .28 } }, R);
    buildStatements(R);
    var last = invoicesFor('nairi').filter(function(x){ return x.amount })[0];
    if (last){ last.state = 'due'; last.paidAt = null; last.ref = null; }
    seedExposure(seeded(13));
  })();

  /* the words of a "send it back" fill the preview of the other side's screen
     as they are typed, and stay in the draft through a re-render */
  document.addEventListener('input', function(e){
    var id = e.target && e.target.getAttribute && e.target.getAttribute('data-preview');
    if (!id) return;
    view.draft.op_why = e.target.value;
    var el = document.getElementById(id); if (el) el.textContent = e.target.value || '\u2026';
  });
  /* a chart answers a finger or a pointer with the numbers for that week */
  function chartHit(e){
    var g = e.target && e.target.closest && e.target.closest('.chart .bar');
    if (!g) return;
    var c = g.closest('.chart'); c.classList.add('active');
    Array.prototype.forEach.call(c.querySelectorAll('.bar.on'), function(x){ x.classList.remove('on') });
    g.classList.add('on');
    var rd = document.getElementById(c.getAttribute('data-readout'));
    if (rd) rd.textContent = g.getAttribute('data-tip');
  }
  document.addEventListener('pointerover', chartHit);
  document.addEventListener('click', chartHit);

  applyTheme();
  try { var keepRole = sessionStorage.getItem('sc_role');
    if (keepRole && HOME[keepRole]){ sessionStorage.removeItem('sc_role'); db.me.role = keepRole; view.screen = HOME[keepRole]; } } catch(err){}
  render();
})();
</script>
