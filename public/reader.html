<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
</head>
<body>
<title>Shelfcall for Readers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* ==========================================================================
     Shelfcall on shadcn/ui.
     --------------------------------------------------------------------------
     The colour scale is shadcn's default Neutral theme, values copied exactly
     from ui.shadcn.com/docs/theming, with ONE deliberate departure: nothing in
     this product is darker than #1C1C1C. shadcn's dark page is #0A0A0A, which
     on an OLED phone is the panel switched off - text on it haloes, the
     borders at 10% white vanish, and a card one step up reads as a smear
     rather than a surface. Lifting the floor to #1C1C1C and the ladder above
     it (#242424 card, #303030 filled) keeps every step visible. The same
     value is the black in the light theme, so the ink and the night page are
     one colour rather than two near-blacks.
     Radius is their 0.625rem base with the four derived steps.

     shadcn gives you two text tones - foreground and muted-foreground - and
     that is the whole vocabulary. Anything secondary is muted-foreground; if a
     third tone seems necessary, the hierarchy is wrong, not the palette.

     Dark mode is driven by three selectors: the OS setting, .dark (shadcn's
     own convention, so their components drop straight in), and [data-theme],
     which the in-app Light / Dark / Match-my-phone switch writes.
     ========================================================================== */

  :root{
    --radius: 0.625rem;
    --radius-sm: calc(var(--radius) - 4px);
    --radius-md: calc(var(--radius) - 2px);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) + 4px);
    --radius-full: 9999px;

    /* Softened from pure white, which glares on a phone at full brightness.
       #F4F4F4 is the page; cards and popovers sit one step lighter so they
       still lift off it. Every value below was re-measured against it. */
    --background:             #f4f4f4;
    --foreground:             oklch(0.226 0 0);
    --card:                   #fafafa;
    --card-foreground:        oklch(0.226 0 0);
    --popover:                #fafafa;
    --popover-foreground:     oklch(0.226 0 0);
    --primary:                oklch(0.226 0 0);
    --primary-foreground:     oklch(0.985 0 0);
    --secondary:              #eaeaea;
    --secondary-foreground:   oklch(0.226 0 0);
    --muted:                  #eaeaea;
    /* 5.2:1 or better on every light ground it sits on, the darkest being a
       label (tint) on the page; shadcn's #737373 drops to 3.7:1 there */
    --muted-foreground:       #5e5e5e;
    --accent:                 #eaeaea;
    --accent-foreground:      oklch(0.226 0 0);
    --destructive:            #b00007;   /* 5.1:1 on its own tint, 6.7:1 on the page */
    --destructive-foreground: #ffffff;
    --border:                 #dddddd;
    --input:                  #dddddd;
    /* the edge of anything you press or type into: 3:1 on every light ground,
       the minimum for a control's boundary. --border stays for dividers. */
    --edge:                   #7a7a7a;   /* 3.6:1 or better on page, card and muted */
    --ring:                   #5e5e5e;   /* 5.9:1 on the page */
    --chart-1:                oklch(0.646 0.222 41.116);
    --chart-2:                oklch(0.6 0.118 184.704);
    --chart-3:                oklch(0.398 0.07 227.392);
    --chart-4:                oklch(0.828 0.189 84.429);
    --chart-5:                oklch(0.769 0.188 70.08);

    /* ---- there is no third colour ---------------------------------------
       The logo is black type on white paper - a reference to printing - and
       it works reversed. Adding a brand hue to that is adding a thing the
       mark does not have. So the product has two colours and one of them is
       the paper.
       That leaves the problem this token was invented to solve: black was
       doing three jobs at once - "press this", "this is selected" and "this
       is running out of time". They are separated by SHAPE instead:

         press this        solid ink fill, WITH a border. The only solid ink
                           fill on a screen, and never more than one.
         this is selected  a tinted ground (14% ink) and no border at all.
                           A chip is a label; a label never wears a border.
         running out       a tinted ground and a dot, and once the window is
                           gone it takes the destructive tint - which is the
                           truth, because something was lost.

       So: BORDER MEANS BUTTON. Fill without a border is a label. That one
       sentence is the whole system, and it survives a black-and-white screen,
       a photocopy and a colour-blind reader, which a hue does not.
       --brand stays as a token so a future accent has one place to land, but
       today it IS the ink. */
    --brand:            oklch(0.226 0 0);
    --brand-foreground: oklch(0.985 0 0);
    /* the two label grounds, derived so they follow whichever theme is on */
    --tint:        color-mix(in oklab, var(--foreground) 6%, var(--background));
    --tint-strong: color-mix(in oklab, var(--foreground) 14%, var(--background));
    --tint-bad:    color-mix(in oklab, var(--destructive) 14%, var(--background));
    --font-sans: Geist, ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ color-scheme: dark;
      /* the same override as the explicit dark theme */
      --brand:            oklch(0.985 0 0);
      --brand-foreground: oklch(0.226 0 0);
      --background:             oklch(0.226 0 0);
      --foreground:             oklch(0.985 0 0);
      --card:                   oklch(0.26 0 0);
      --card-foreground:        oklch(0.985 0 0);
      --popover:                oklch(0.26 0 0);
      --popover-foreground:     oklch(0.985 0 0);
      --primary:                oklch(0.922 0 0);
      --primary-foreground:     oklch(0.226 0 0);
      --secondary:              oklch(0.31 0 0);
      --secondary-foreground:   oklch(0.985 0 0);
      --muted:                  oklch(0.31 0 0);
      --muted-foreground:       oklch(0.708 0 0);
      --accent:                 oklch(0.31 0 0);
      --accent-foreground:      oklch(0.985 0 0);
      --destructive:            oklch(0.704 0.191 22.216);
      /* white on destructive is 2.9:1 in dark, so the ink flips */
      --destructive-foreground: oklch(0.226 0 0);
      --border:                 oklch(1 0 0 / 10%);
      --input:                  oklch(1 0 0 / 15%);
      --edge:                   rgb(255 255 255 / 0.38);
      --ring:                   oklch(0.708 0 0);
      --chart-1:                oklch(0.488 0.243 264.376);
      --chart-2:                oklch(0.696 0.17 162.48);
      --chart-3:                oklch(0.769 0.188 70.08);
      --chart-4:                oklch(0.627 0.265 303.9);
      --chart-5:                oklch(0.645 0.246 16.439);
    }
  }
  :root[data-theme="dark"], .dark{ color-scheme: dark;
    /* lighter and a shade less saturated, so it sits on a dark ground
       without glowing, and takes near-black ink instead of white */
    --brand:            oklch(0.985 0 0);
    --brand-foreground: oklch(0.226 0 0);
    --background:             oklch(0.226 0 0);
    --foreground:             oklch(0.985 0 0);
    --card:                   oklch(0.26 0 0);
    --card-foreground:        oklch(0.985 0 0);
    --popover:                oklch(0.26 0 0);
    --popover-foreground:     oklch(0.985 0 0);
    --primary:                oklch(0.922 0 0);
    --primary-foreground:     oklch(0.226 0 0);
    --secondary:              oklch(0.31 0 0);
    --secondary-foreground:   oklch(0.985 0 0);
    --muted:                  oklch(0.31 0 0);
    --muted-foreground:       oklch(0.708 0 0);
    --accent:                 oklch(0.31 0 0);
    --accent-foreground:      oklch(0.985 0 0);
    --destructive:            oklch(0.704 0.191 22.216);
    --destructive-foreground: oklch(0.226 0 0);
    --border:                 oklch(1 0 0 / 10%);
    --input:                  oklch(1 0 0 / 15%);
    --edge:                   rgb(255 255 255 / 0.38);
    --ring:                   oklch(0.708 0 0);
    --chart-1:                oklch(0.488 0.243 264.376);
    --chart-2:                oklch(0.696 0.17 162.48);
    --chart-3:                oklch(0.769 0.188 70.08);
    --chart-4:                oklch(0.627 0.265 303.9);
    --chart-5:                oklch(0.645 0.246 16.439);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  /* ring is 2.6:1 on background in light - under the 3:1 floor. shadcn ships it
     this way; we answer with thickness rather than retinting their token. */
  :focus-visible{outline:3px solid var(--ring);outline-offset:1px}

  /* ---------- chrome ---------- */
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--background);border-bottom:1px solid var(--border)}
  .bar-in{max-width:960px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:16px;overflow-x:auto;scrollbar-width:none}
  .bar-in::-webkit-scrollbar{display:none}
  .bar-in > *{flex:none}
  /* black type, like the mark itself */
  .logo{font-size:18px;letter-spacing:-.02em;font-weight:600;color:var(--foreground)}
  .nav{display:flex;gap:2px;margin-left:auto;align-items:center}
  .nav button{padding:7px 11px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--muted-foreground)}
  .nav button:hover{color:var(--foreground)}
  .nav button[aria-current="true"]{color:var(--foreground);background:var(--accent);font-weight:500}
  /* a count is a label too - a tinted pill, not an ink one */
  .count{display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;border-radius:9px;background:var(--tint-strong);color:var(--foreground);font-size:10.5px;line-height:17px;text-align:center;font-weight:700}
  .icon-btn{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;color:var(--muted-foreground);flex:none}
  .icon-btn:hover{border-color:var(--muted-foreground);color:var(--foreground)}
  .icon-btn[aria-current="true"]{background:var(--accent);color:var(--foreground)}
  .icon-btn .count{position:absolute;top:-4px;right:-4px;margin:0}
  .switch{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);min-height:56px}
  .switch:last-child{border-bottom:none}
  .switch p{margin:0}
  .switch .sub2{font-size:12.5px;color:var(--muted-foreground);margin:2px 0 0}
  /* The button IS the 40x40 touch target and paints nothing; the track is a
     32x18 pill drawn inside it. The earlier version padded the button out to
     40px and tried to claw the background back with background-clip, which
     lost the fight with the 9999px radius and rendered the whole thing as a
     black disc. A hit area and a control are two different boxes; drawing
     them as one is what crushed it. */
  .tog{width:40px;height:40px;padding:0;border:0;background:none;position:relative;flex:none;display:inline-block;cursor:pointer}
  .tog::before{content:"";position:absolute;left:4px;top:11px;width:32px;height:18px;border-radius:var(--radius-full);
       background:var(--edge);transition:background-color .15s}
  .tog span{position:absolute;top:13px;left:6px;width:14px;height:14px;border-radius:50%;background:var(--background);transition:left .15s;z-index:1}
  .tog:focus-visible{outline:none}
  .tog:focus-visible::before{box-shadow:0 0 0 3px var(--ring)}
  .tog[aria-pressed="true"]::before{background:var(--primary)}
  .tog[aria-pressed="true"] span{left:20px;background:var(--primary-foreground)}
  .notif{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
  .notif:last-child{border-bottom:none}
  .notif i{width:7px;height:7px;border-radius:50%;background:var(--primary);flex:none;margin-top:6px}
  .notif i.read{background:var(--input)}
  .role{margin-left:10px;padding-left:14px;border-left:1px solid var(--border);display:flex;align-items:center;gap:6px}
  .role select{background:var(--muted);border:1px solid var(--edge);border-radius:var(--radius-md);padding:5px 7px;font-size:12.5px;color:var(--muted-foreground)}
  .role .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}

  main{max-width:960px;margin:0 auto;padding:26px 20px 80px}

  /* ---------- type ---------- */
  /* text-2xl, dropping to text-xl on a phone. A screen title is a label for
     what you are doing, not a headline — it should not outweigh the fields. */
  h1{font-weight:600;font-size:24px;line-height:32px;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
  h2{font-size:14px;font-weight:600;margin:32px 0 12px;letter-spacing:-.005em}
  h2:first-child{margin-top:0}
  .sub{color:var(--muted-foreground);font-size:14px;line-height:20px;margin:0 0 22px}
  /* the reader's own words, quoted at the top of a screen that answers them.
     text-base in full ink - it is the thing being answered, not a caption. */
  .asked{font-size:16px;line-height:24px;color:var(--foreground);margin:0 0 20px;max-width:60ch}
  /* a fork in a flow: two or three options, each explained */
  .pick{display:block;width:100%;text-align:left;border:1px solid var(--border);
        border-radius:var(--radius-lg);background:var(--card);padding:16px;margin-bottom:12px}
  .pick:hover{border-color:var(--foreground)}
  /* A 1px border was the whole signal that an option had been chosen, and on
     a card that already has a 1px border it is not a signal at all — people
     tapped "As soon as possible" and could not tell it had taken. Chosen now
     costs two pixels of ring, a tinted ground and a tick. Shape and mark, not
     colour, so it survives the monochrome system. */
  .pick.on{border-color:var(--foreground);box-shadow:inset 0 0 0 2px var(--foreground);background:var(--tint)}
  .pick.on .pick-t::after{content:" \2713";font-weight:700}
  .chip[aria-pressed="true"]::after{content:" \2713";font-weight:700}
  /* THE ONE BADGE A READER OPENS THIS SCREEN FOR.
     A new answer was the same size and weight as "Specific" and "up to
     6 000 ֏" \u2014 a fact among facts. It is not a fact among facts: it is the
     reason the app was opened. So it is larger, it is the only label that
     inverts, and it breathes until it has been read.
     Inverted rather than coloured, because the system has no accent hue; the
     pulse is on the ground rather than the text, so the words never move. */
  .chip.fresh{background:var(--primary);color:var(--primary-foreground);
              font-size:13px;line-height:18px;padding:5px 11px;font-weight:600;
              animation:notice 2.4s ease-in-out infinite}
  .chip.fresh .dot{width:6px;height:6px;background:currentColor}
  @keyframes notice{0%,100%{box-shadow:0 0 0 0 var(--tint-strong)}
                    50%{box-shadow:0 0 0 5px var(--tint-strong)}}
  .pick-t{margin:0;font-size:16px;line-height:24px;font-weight:600}
  .pick-d{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--muted-foreground)}
  .pick-eg{margin:10px 0 0;font-size:14px;line-height:20px;color:var(--foreground);
           border-left:2px solid var(--input);padding-left:10px}
  .book-t{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.01em;margin:0}
  .muted{color:var(--muted-foreground)}
  .small{font-size:12px;line-height:16px}
  .price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .eyebrow{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);margin:0 0 8px}

  /* ---------- pieces ---------- */
  .card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--background);padding:16px}
  .card + .card{margin-top:10px}
  .rowlist{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
  .rowlist > *{border-bottom:1px solid var(--border)}
  .rowlist > *:last-child{border-bottom:none}
  .row{display:flex;gap:14px;padding:16px;background:var(--background);width:100%;text-align:left;align-items:flex-start}
  button.row:hover{background:var(--muted)}
  .grow{flex:1;min-width:0}
  .between{display:flex;align-items:center;gap:12px}
  .between .grow{flex:1}
  .stack{display:flex;flex-direction:column;gap:5px;min-width:0}
  .wrap-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  hr{border:none;border-top:1px solid var(--border);margin:22px 0}

  /* A LABEL HAS NO BORDER. It sits on a tinted ground instead, so that a
     border anywhere on a screen means one thing only: this is a button.
     Before this, a chip and an outline button were both "text in a box" and
     people tried to press the chips. */
  .chip{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--tint);border-radius:var(--radius-sm);padding:3px 9px;font-size:12px;line-height:16px;font-weight:500;color:var(--foreground);white-space:nowrap;width:fit-content}
  /* selected, or a count that has changed: a heavier ground and heavier type.
     Not an ink fill - an ink fill is a button now. */
  .chip.solid{background:var(--tint-strong);color:var(--foreground);font-weight:600}
  .chip.dim{background:var(--tint);color:var(--muted-foreground);font-weight:400}
  /* a badge on a title's line never shrinks: the title truncates instead */
  .between > .chip{flex:none;margin-top:2px}
  /* and the title it shares the line with is held to two lines. Cutting the
     string at a character count instead put the ellipsis mid-word and still
     ran to four lines once the badge took its width; the browser knows where
     the line actually ends and we do not. */
  .clamp2{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
  .chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  /* A window that is running is the one thing on a screen that changes while
     you look at it, so it is the one thing allowed to move. Two seconds,
     opacity and scale only - no colour change, because the dot has to survive
     a monochrome system, and no sliding, because a moving object next to text
     is read as an error. It stops dead under prefers-reduced-motion (the
     global rule at the end of this sheet), and the words beside it carry the
     meaning on their own, so nothing is lost when it does. */
  .chip .dot.live{animation:breathe 2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  /* a removable chip carries a 36px target, so the chip itself grows */
  .chip.rm{padding:0 0 0 10px;min-height:36px}
  .chip.rm button{min-width:36px;min-height:36px;display:inline-flex;align-items:center;
                  justify-content:center;color:var(--muted-foreground);font-size:16px;border-radius:var(--radius-sm)}
  .chip.rm button:hover{color:var(--destructive);background:var(--muted)}

  /* ONE BUTTON SIZE, EVERYWHERE. 40px tall, the same padding and the same
     type, whether it is the one action of the screen or an Edit in a row.
     This used to be three sizes, and the primary got extra height so it would
     stand out. It does not need height any more: it is the only solid ink
     fill on the screen, and fill against outline is a louder signal than
     eight pixels ever was. What buttons of mixed heights buy you is a ragged
     row and a reader wondering whether the small one really is a button. `sm` and `wide` still exist as classes so call sites keep working,
     but `sm` changes nothing and `wide` only stretches the width. */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-md);padding:9px 16px;min-height:40px;font-size:14px;line-height:20px;font-weight:500;border:1px solid var(--brand);background:var(--brand);color:var(--brand-foreground);white-space:nowrap;text-decoration:none;transition:background-color .15s,color .15s,border-color .15s}
  .btn:hover{opacity:.86}
  .btn.ghost{background:transparent;color:var(--foreground);border-color:var(--edge)}
  .btn.ghost:hover{background:var(--muted);opacity:1}
  /* ---- the four tiers, and there are only four ----------------------------
     primary    one per screen. The thing the screen exists for.
     secondary  a filled but quiet alternative. Same weight of decision as the
                primary, different choice: "Add to cart" beside "Buy".
     outline    a step down: a way out, a side road, "Cancel".
     link       text, inline, for something that is really a navigation.
     A screen with two primaries has no primary. If a third solid button is
     wanted, the screen is doing two jobs and should be two screens. */
  /* even the filled-but-quiet one keeps a border, because the border is what
     says "button" now that labels have grounds of their own */
  .btn.secondary{background:var(--secondary);color:var(--secondary-foreground);border-color:var(--edge)}
  .btn.secondary:hover{opacity:1;background:var(--accent);border-color:var(--accent)}
  .btn.link{background:none;border-color:transparent;color:var(--foreground);padding:0 2px;min-height:36px;
       text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
  .btn.link:hover{opacity:1;text-decoration-color:var(--foreground)}
  /* THERE IS NO BORDERLESS BUTTON ANY MORE.
     `quiet` was transparent, unbordered, 14px/500 — which differs from body
     text by a single step of font weight. On a card full of labels it read as
     a label, and people do not tap labels. Everything that was quiet is now
     `ghost`: same restraint, but it has an edge, so it is visibly a control.
     If something genuinely is navigation rather than an action, it takes the
     `link` variant and gets an underline. Four variants, no fifth. */
  /* the one action of a screen: taller, a touch larger, and it owns its space.
     Not a gradient, not a shadow — size and air are what read as considered. */
  .btn.wide{width:100%;padding-inline:24px}
  .btn:active{transform:scale(.985)}
  .btn{transform:scale(1)}
  .btn.sm{padding:9px 16px;min-height:40px;font-size:14px;border-radius:var(--radius-md);gap:8px}
  .cover-btn{display:block;padding:0;border:none;background:none}
  /* off, not faded: a muted ground and muted text that still read at 5:1 */
  .btn[disabled]{opacity:1;cursor:not-allowed;background:var(--muted);color:var(--muted-foreground);border-color:transparent}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  /* the one action of a list screen, sitting under the list. Full width on a
     phone, because a full-width button is unmissable and the thumb is already
     down there; sized to its label above phone width, where a button stretched
     across a wide column just reads as a mistake. */
  .page-act{margin-top:18px}
  /* a screen's main action, pinned under the top bar while the list scrolls */
  .pin-states{padding:6px 0 8px}
  .pin-states .aseg{margin:0;display:flex;flex-wrap:nowrap;width:100%}
  .pin-states .aseg button{flex:1 1 0;min-width:0;padding:8px 4px;font-size:13px;overflow:hidden;text-overflow:ellipsis}
  .pin-states .aseg .segn{margin-left:2px}
  /* the main action of a list, docked under the list and above the tab bar */
  .pin-bottom{position:sticky;bottom:16px;z-index:25;margin-top:14px}
  .pin-bottom .btn{box-shadow:0 6px 18px -8px rgba(0,0,0,.35)}
  @media (max-width:560px){ body.has-tabbar .pin-bottom{bottom:calc(max(12px, env(safe-area-inset-bottom,0px)) + 74px)} }
  .pin-act{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:25;background:var(--background);
           padding:8px 0 12px;margin:0 0 4px;box-shadow:0 8px 8px -8px rgba(0,0,0,.08)}
  /* A screen whose last block is its action gets that action at the BOTTOM of
     the phone, not wherever the content happens to stop. `margin-top:auto`
     absorbs the free space, so on a short screen the button drops to the
     thumb and on a long one it sits directly after the content, which is the
     same place it would have been anyway. Only screens that actually contain
     a tail become flex containers, so nothing else's spacing moves. */
  main.bottom-act{display:flex;flex-direction:column;min-height:calc(100dvh - 56px)}
  main.bottom-act > .page-tail{margin-top:auto}
  /* this used to carry its spacing inline, where it quietly beat the auto
     margin above and pinned the way out halfway up the screen */
  .closer{margin-top:26px;padding-top:18px;border-top:1px solid var(--border)}
  @media (max-width:560px){ .page-act .btn{width:100%;padding-inline:24px} }

  /* a thumb needs 40px; the negative margin keeps the layout where it was */
  /* The back link is the one control allowed to be borderless: the arrow is
     its affordance, it sits alone at the top-left where nothing else lives,
     and an underlined back link reads like a 1999 web page. */
  .back{font-size:14px;color:var(--muted-foreground);display:inline-flex;gap:6px;align-items:center;
        min-height:40px;padding:0 10px;margin:0 0 8px -10px;border-radius:var(--radius-sm)}
  .back:hover{background:var(--muted)}
  .back:hover{color:var(--foreground)}

  /* covers */
  .cover{flex:none;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 7px;overflow:hidden;position:relative}
  .cover::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg, var(--accent), transparent 62%)}
  .cover span{position:relative;font-family:var(--font-sans);line-height:1.12;color:var(--muted-foreground);overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
  .cover .ct{font-size:9px}
  .cover .ca{font-size:8px;color:var(--muted-foreground);margin-top:3px;-webkit-line-clamp:1}
  .cover.s{width:46px;height:64px;padding:6px 5px}
  .cover.m{width:64px;height:90px}
  .cover.l{width:132px;height:186px}
  .cover.l .ct{font-size:15px}
  .cover.l .ca{font-size:11px}

  /* forms */
  label.f{display:block;margin-bottom:14px}
  label.f > span{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--foreground);margin-bottom:8px}
  .in{width:100%;min-height:36px;background:var(--background);border:1px solid var(--edge);border-radius:var(--radius-md);padding:8px 12px;font-size:14px;line-height:20px}
  .in:focus{outline:3px solid var(--ring);outline-offset:1px;border-color:var(--edge)}
  textarea.in{min-height:92px;resize:vertical;line-height:1.5}
  /* the browser's own placeholder grey is 3.7:1 on a dark field */
  .in::placeholder{color:var(--muted-foreground);opacity:1}
  .seg{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--muted);border-radius:var(--radius-md);padding:3px;max-width:100%}
  .seg button{border:0;border-radius:var(--radius-sm);padding:8px 14px;min-height:36px;font-size:14px;line-height:20px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--background);color:var(--foreground)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  /* short fields that stay side by side even on a phone */
  .two.tight{grid-template-columns:1fr 1fr}
  .hint{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:-8px;margin-bottom:14px}
  .err{font-size:12.5px;color:var(--destructive);border-left:2px solid var(--destructive);padding-left:9px;margin:-6px 0 14px}
  .in.bad{border-color:var(--destructive)}
  .in.bad:focus{border-color:var(--destructive)}

  /* notices */
  .note{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);padding:16px;font-size:14px;line-height:20px;color:var(--muted-foreground)}
  .note.hard{border-color:var(--foreground)}
  .note b{color:var(--foreground)}
  .note.bad{border-color:var(--destructive);background:var(--card);color:var(--destructive)}
  .note.bad b{color:var(--destructive)}
  .bad-t{color:var(--destructive)}
  .chip.bad{background:var(--tint-bad);color:var(--destructive);font-weight:600}
  .btn.danger{background:transparent;color:var(--destructive);border-color:var(--destructive)}
  .btn.danger:hover{background:var(--destructive);color:var(--destructive-foreground);opacity:1}
  .btn.danger.solid{background:var(--destructive);border-color:var(--destructive);color:var(--destructive-foreground)}
  /* ---- the wait ----------------------------------------------------------
     Three small spheres on one horizontal ring, orbiting the vertical axis
     through its centre.

     The ring is seen from slightly above, so it projects as a flat ellipse:
     x swings the full width, y only a little. Depth is carried by size and
     opacity \u2014 the sphere on the near side is biggest and solid, the one
     going round the back is small and faint, and the eye reads that as one
     passing behind the others rather than as three dots sliding about.

     Written out as keyframes rather than CSS 3D. preserve-3d would turn each
     sphere into an ellipse along with the plane it sits on, and the
     counter-rotation that stops it costs more than the arithmetic does. The
     keyframes are generated, 24 to a revolution, from x = R\u00b7sin\u03b8 and
     y = \u2212k\u00b7cos\u03b8; the three are the same animation 1/3 of a cycle apart.

     Each sphere keeps a fixed highlight at the upper left: the light does not
     travel with the object, which is what makes them read as spheres lit from
     one side rather than as flat discs.

     Under prefers-reduced-motion the global rule at the end of this sheet
     stops them where they stand \u2014 three spheres in a triangle, still plainly
     a group, and the sentence underneath carries the meaning on its own. */
  .looking{border:1px dashed var(--border);border-radius:var(--radius-lg);
           padding:30px 20px 26px;text-align:center;margin-bottom:18px}
  .orbs{position:relative;width:46px;height:30px;margin:0 auto 18px}
  .orb{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
       border-radius:50%;
       background:radial-gradient(circle at 32% 28%,
                  color-mix(in oklab, var(--foreground) 34%, var(--background)) 0%,
                  var(--foreground) 78%);
       animation:orbit 1.7s linear infinite;
       animation-delay:calc(var(--i) * -0.5667s)}
  @keyframes orbit{
    0%{transform:translate(0.00px,-5.50px) scale(1.000);opacity:1.000}
    4.1667%{transform:translate(4.14px,-5.31px) scale(0.995);opacity:0.994}
    8.3333%{transform:translate(8.00px,-4.76px) scale(0.981);opacity:0.975}
    12.5%{transform:translate(11.31px,-3.89px) scale(0.959);opacity:0.944}
    16.6667%{transform:translate(13.86px,-2.75px) scale(0.930);opacity:0.905}
    20.8333%{transform:translate(15.45px,-1.42px) scale(0.896);opacity:0.859}
    25%{transform:translate(16.00px,-0.00px) scale(0.860);opacity:0.810}
    29.1667%{transform:translate(15.45px,1.42px) scale(0.824);opacity:0.761}
    33.3333%{transform:translate(13.86px,2.75px) scale(0.790);opacity:0.715}
    37.5%{transform:translate(11.31px,3.89px) scale(0.761);opacity:0.676}
    41.6667%{transform:translate(8.00px,4.76px) scale(0.739);opacity:0.645}
    45.8333%{transform:translate(4.14px,5.31px) scale(0.725);opacity:0.626}
    50%{transform:translate(0.00px,5.50px) scale(0.720);opacity:0.620}
    54.1667%{transform:translate(-4.14px,5.31px) scale(0.725);opacity:0.626}
    58.3333%{transform:translate(-8.00px,4.76px) scale(0.739);opacity:0.645}
    62.5%{transform:translate(-11.31px,3.89px) scale(0.761);opacity:0.676}
    66.6667%{transform:translate(-13.86px,2.75px) scale(0.790);opacity:0.715}
    70.8333%{transform:translate(-15.45px,1.42px) scale(0.824);opacity:0.761}
    75%{transform:translate(-16.00px,0.00px) scale(0.860);opacity:0.810}
    79.1667%{transform:translate(-15.45px,-1.42px) scale(0.896);opacity:0.859}
    83.3333%{transform:translate(-13.86px,-2.75px) scale(0.930);opacity:0.905}
    87.5%{transform:translate(-11.31px,-3.89px) scale(0.959);opacity:0.944}
    91.6667%{transform:translate(-8.00px,-4.76px) scale(0.981);opacity:0.975}
    95.8333%{transform:translate(-4.14px,-5.31px) scale(0.995);opacity:0.994}
    100%{transform:translate(-0.00px,-5.50px) scale(1.000);opacity:1.000}}
  .looking-t{margin:0;font-size:15px;line-height:22px;color:var(--foreground);max-width:30ch;
             margin-left:auto;margin-right:auto}
  .empty{border:1px dashed var(--border);border-radius:var(--radius-lg);padding:40px 24px;text-align:center;color:var(--muted-foreground);font-size:14px;line-height:20px}
  .empty p{margin:0 0 14px}

  /* stars */
  .stars{display:inline-flex;gap:1px;font-size:12px;color:var(--muted-foreground);letter-spacing:.5px}
  .stars.big{font-size:30px;gap:5px;color:var(--muted-foreground)}
  .stars.big button[data-on="1"]{color:var(--foreground)}

  /* timeline */
  .tl{display:flex;flex-direction:column;gap:9px;margin:12px 0}
  .tl div{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--muted-foreground)}
  .tl i{width:7px;height:7px;border-radius:50%;background:var(--input);flex:none}
  .tl div.done{color:var(--muted-foreground)}
  .tl div.done i{background:var(--muted-foreground)}
  .tl div.now{color:var(--foreground);font-weight:500}
  .tl div.now i{background:var(--foreground);box-shadow:0 0 0 3px var(--accent)}

  /* what the bookseller said about the copy */
  .said{font-size:14px;line-height:20px;color:var(--foreground);margin:2px 0 0;
        border-left:2px solid var(--input);padding-left:10px;overflow:hidden;
        display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
  .said.lead{font-size:16px;line-height:24px;color:var(--foreground);-webkit-line-clamp:4}
  .struck{text-decoration:line-through;color:var(--muted-foreground)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--primary);color:var(--primary-foreground);padding:12px 16px;border-radius:var(--radius-lg);font-size:14px;line-height:20px;z-index:50;box-shadow:0 6px 24px -12px rgba(0,0,0,.5);pointer-events:none}
  /* a toast reports; it never takes the tap meant for the button under it */
  .proto{max-width:960px;margin:0 auto;padding:18px 20px 30px;border-top:1px solid var(--border);color:var(--muted-foreground);font-size:11.5px}
  /* the load switch: the same two states in every role */
  .loadsw{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .loadsw .seg button{min-height:36px;padding:6px 16px}
  /* a title takes focus after navigation so a screen reader starts there;
     nobody tapping needs a box drawn round it */
  h1[tabindex="-1"]:focus{outline:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  /* spaced list of cards */
  .stack-list{display:flex;flex-direction:column;gap:12px}
  .card-row{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--background);padding:16px;display:flex;gap:14px;text-align:left;width:100%;align-items:flex-start}
  button.card-row:hover{background:var(--muted)}
  .card-row.on{border-color:var(--muted-foreground)}
  /* avatar - shadcn's, an image over an initials fallback */
  .av{flex:none;border-radius:var(--radius-full);background:var(--muted);color:var(--muted-foreground);
      display:inline-flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
      font-weight:500;line-height:1;text-transform:uppercase;user-select:none}
  .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .av.xs{width:20px;height:20px;font-size:9px}
  .av.sm{width:28px;height:28px;font-size:11px}
  .av.md{width:40px;height:40px;font-size:14px}
  .av.lg{width:64px;height:64px;font-size:22px}
  .av-edit{display:flex;align-items:center;gap:14px;margin-bottom:14px}

  /* photos */
  .thumb{width:54px;height:54px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--border);display:block}
  /* A square crop of a book cuts the top off it. Where a photo stands for ONE
     book in a list \u2014 the reader's own request \u2014 it takes the same portrait
     the spine placeholders take beside it, so a row with a photo and a row
     without are the same shape. In a picker the tiles stay square: there they
     are a grid of pictures, not a book. */
  .thumb.tall{width:58px;height:82px}
  /* in a picker the tiles are the subject of the screen, so they are larger */
  .thumbs .thumb{width:72px;height:72px}
  .thumb.lg{width:100%;height:auto;max-height:340px;object-fit:contain;background:var(--muted)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .addph{width:72px;height:72px;border:1px dashed var(--edge);border-radius:var(--radius-md);color:var(--muted-foreground);font-size:26px;display:flex;align-items:center;justify-content:center}
  .addph:hover{border-color:var(--muted-foreground);color:var(--foreground)}
  .addph.big{width:100%;height:190px;font-size:15px;flex-direction:column;gap:10px;font-weight:500;color:var(--foreground);border-width:1.5px}
  .addph.big svg{width:30px;height:30px;stroke:var(--muted-foreground)}
  .addph.big:hover{background:var(--tint)}

  /* ---- the request deck ---------------------------------------------------
     A list lets a shop scroll past twenty requests and answer none, and
     nobody learns anything from that — not the shop, not the reader waiting.
     A deck puts one request in front of the shop, whole, and asks for a
     verdict: offer a book, or miss it. Both are answers. What is missed is
     kept, never deleted, and can be brought back, because "not today" and
     "not ever" are different things and only the shop knows which it meant.

     The whole request is on the card on purpose. A row that shows 60
     characters of a title asks the shop to decide on nothing, and what the
     shop then does is scroll. */
  .deck{position:relative;margin:0 0 34px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .deck-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--background);
             padding:18px;position:relative;z-index:3;will-change:transform;cursor:grab;
             box-shadow:0 1px 3px color-mix(in oklab, var(--foreground) 7%, transparent)}
  .deck-card:active{cursor:grabbing}
  /* the pile behind is two edges and nothing else: it says "there are more"
     without asking to be read */
  /* Two narrower cards peeking out below, not scaled copies hidden behind:
     the shop has to be able to SEE that the pile goes on, or the last card
     and the fortieth look exactly alike. */
  .deck-under{position:absolute;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--background)}
  .deck-under.b{left:10px;right:10px;top:10px;bottom:-8px;z-index:2}
  .deck-under.c{left:21px;right:21px;top:21px;bottom:-16px;z-index:1;opacity:.6}
  .deck-card.go{transition:transform .24s ease-in,opacity .24s ease-in}
  /* the two verdicts, drawn on the card as it moves, in the same ink-versus-
     outline pair as the two buttons under it */
  .verdict{position:absolute;top:14px;font-size:12px;font-weight:600;letter-spacing:.07em;
           text-transform:uppercase;padding:5px 11px;border-radius:var(--radius-sm);
           border:1.5px solid var(--foreground);opacity:0;pointer-events:none}
  .verdict.yes{right:14px;background:var(--foreground);color:var(--background)}
  .verdict.no{left:14px;color:var(--foreground);background:var(--background)}
  .deck-t{margin:0 0 10px;font-size:20px;line-height:27px;overflow-wrap:anywhere}
  .deck-t.lead{font-size:19px;line-height:27px;font-weight:600;
               display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
  .deck-q{font-size:16px;line-height:24px;margin:0;color:var(--foreground);
          overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
  .deck-acts{display:flex;gap:10px;margin-bottom:6px}
  .deck-acts .btn{flex:1;padding-inline:12px}
  .deck-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .deck-hint{font-size:12px;line-height:16px;color:var(--muted-foreground);text-align:center;margin:0 0 12px}

  /* ---- the step rail ------------------------------------------------------
     Four or five parts, and the shop can see at a glance which one it is in
     and how much is left. Only the current part is named: five labels do not
     fit across a phone, and five labels nobody can read are worse than one. */
  .rail{display:flex;gap:5px;margin:0 0 10px}
  .rail i{display:block;height:3px;border-radius:2px;background:var(--tint-strong);flex:1}
  .rail span{flex:1;display:flex}
  .rail .done i,.rail .at i{background:var(--foreground)}

  /* the request, folded shut, carried through every screen of the offer flow */
  .asked-card{margin-bottom:18px;background:var(--tint);border-color:transparent}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* handover code */
  .code{font-family:var(--font-mono);font-weight:500;letter-spacing:.2em;font-size:28px;line-height:32px;color:var(--foreground)}
  .codebox{border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:12px 0}
  .codebox .grow{min-width:140px}
  /* A heading that is secretly a button is the worst of both: it looks like
     type, so nobody taps it, and it is the only way into the detail. The
     chevron is the cheapest honest affordance — no border, no fill, but the
     line now ends in something that means "there is more through here". */
  .opens{text-align:left;background:none;border:0;padding:6px 0;min-height:36px;width:100%}
  .opens .book-t::after, .opens .pick-t::after{content:" \203a";color:var(--muted-foreground);font-weight:400}
  /* a disclosure carries its own word and its own triangle, so it needs no
     chevron on the title - but it still underlines on hover like every other
     openable thing, and it still reads as a control rather than a caption */
  .opens .disc{color:var(--foreground)}
  .opens:hover .disc{text-decoration:underline;text-underline-offset:3px}
  .opens:hover .book-t, .opens:hover .pick-t{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
  .disc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted-foreground)}
  /* a folded explainer: read once, then out of the way */
  .howto summary{cursor:pointer;font-size:14px;color:var(--foreground);min-height:36px;display:flex;align-items:center;gap:6px}
  .howto summary::marker{color:var(--muted-foreground)}
  .demo{margin-top:28px;border-top:1px dashed var(--input);padding-top:14px}
  .demo p{font-size:11.5px;color:var(--muted-foreground);margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
  /* ---- the tab bar ---------------------------------------------------------
     On a phone the destinations belong at the BOTTOM, where the thumb is, and
     the top of the screen belongs to the screen's own heading. Above 560px the
     old top tabs come back, because on a laptop a bar pinned to the bottom of
     the window is nobody's idea of navigation. */
  .tabbar{display:none}
  @media (max-width:560px){
    .tabbar[hidden]{display:none}
    /* A floating bar: inset 12px from both sides and from the bottom (more
       on a phone with a home indicator), rounded, one step lighter than the
       page and lifted by a soft shadow, so it reads as one object that the
       content scrolls under rather than as the bottom of the page. */
    .tabbar{display:block;position:fixed;left:12px;right:12px;z-index:40;
      bottom:max(12px, env(safe-area-inset-bottom,0px));
      max-width:536px;margin:0 auto;
      background:var(--card);border:1px solid var(--border);border-radius:20px;
      box-shadow:0 8px 24px -12px rgba(0,0,0,.28), 0 2px 6px -2px rgba(0,0,0,.08)}
    .tabbar nav{display:flex;gap:0;padding:4px}
    .tabbar button{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      min-height:54px;padding:7px 0 6px;font-size:11px;line-height:14px;color:var(--muted-foreground);
      background:none;border:0;border-radius:15px;position:relative;transition:background-color .15s,color .15s}
    .tabbar button svg{width:22px;height:22px;stroke-width:1.5}
    /* The selected tab sits in a FILLED container that holds its icon and its
       label together, so it reads as a separate place from its neighbours at
       a glance. It is also heavier and darker — never one signal alone. A
       fill with no border is a label in this system, which is what a
       "you are here" marker is. */
    .tabbar button[aria-current="true"]{color:var(--foreground);font-weight:600;background:var(--tint-strong)}
    .tabbar button[aria-current="true"] svg{stroke-width:2}
    .tabbar .count{position:absolute;top:4px;left:50%;margin-left:6px}
    /* a count on the selected tab would vanish into its fill */
    .tabbar button[aria-current="true"] .count{background:var(--card)}
    .tabbar button span.lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px;letter-spacing:-.01em}
    /* room for it, so nothing hides behind the bar: its height, its inset,
       and a little air */
    body.has-tabbar main{padding-bottom:112px}
    body.has-tabbar .proto{padding-bottom:96px}
    body.has-tabbar .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
    /* on the narrowest phones the inset gives back 4px a side, so five

  function seedHistory(plan, R, start){
    var i = start || 0;
    Object.keys(plan).forEach(function(id){
      var p = plan[id], d0 = Math.ceil((now - p.from) / DAY);
      for (var d = d0; d >= 1; d--){
        var day = now - d * DAY, wd = new Date(day).getDay();
        var rate = p.rate * (wd === 6 ? 1.6 : wd === 0 ? 0.4 : 1);
        var k = Math.floor(rate) + (R() < rate % 1 ? 1 : 0);
        for (var j = 0; j < k; j++){
          var at = new Date(day); at.setHours(11 + Math.floor(R() * 8), Math.floor(R() * 60), 0, 0);
          addSale(id, at.getTime(), R, i++);
        }
      }
    });

    db.orders.sort(function(a, b){ return doneAt(a.subs[0]) - doneAt(b.subs[0]) });

     how often it answers with a copy that then was not chosen. Its own random

  function seedExposure(R){
    var shops = Object.keys(db.sellers), prof = {}, sold = {}, n = 0;
    shops.forEach(function(k){ prof[k] = { open: .25 + R() * .55, speed: (1 + R() * 26) * HOUR, offer: .04 + R() * .22 } });

  /* ---- the free month and the 15th ------------------------------------------
     The only two clocks left. A shop's free month starts with its first offer;

  function trialStartOf(id){

  function cartHas(id){ return db.cart.some(function(c){ return c.id===id }) }

  function cartGroups(){

      if (!found){ found = { key:key, seller:o.seller, loc:o.loc, items:[] }; g.push(found) }

  /* ---- two paces, one product ---------------------------------------------
     A request carries a PACE, and the pace only governs the CLOCK — never the
     choosing. Whichever pace it has, the reader still compares real copies and
     still picks one by hand. Nothing auto-buys.

                  can sit for months and still get an answer, and offers never
                  expire. This is the default, because most asking is not
                  urgent and urgency should be opted into.
       soon     — a window: 30 minutes, an hour, or the rest of today. The
                  shops are told loudly, the card carries a countdown, and the
                  feed puts it first.

     THE WINDOW LAPSING IS NOT A FAILURE, and this is the part that makes the
     two paces safe to have side by side. When it runs out the request does not
     die and does not shout — it simply becomes patient, and the reader is told
     in those words. Without that, an urgent request with no answers reads as a
     broken service; with it, it reads as "not in the next hour, but still
     looking", which is the truth.

     A window also cannot run while every shop is shut, so one posted at
     midnight starts its clock at opening and says so. */
  /* Everything else in this prototype measures from `now`, frozen at load, so
     that "3 days ago" stays put while you click around. A countdown cannot use
     it: a request stamped at 14:02 against a `now` of 14:00 reads as being in
     the future, and the screen said "starts at 14:00" while the clock was
     already running. The pace functions therefore read the live clock, which
     also makes a countdown tick correctly on every re-render. */
  function rightNow(){ return Date.now() }

  var WINDOWS = [

    ['60',    'Within the hour', 60*60e3],
    ['today', 'Some time today', null]   /* null = until closing */
  ];
  function shopHoursToday(){
    /* the prototype has no city calendar, so it reads the branches it has */
    var from = 24, to = 0;
    Object.keys(db.sellers).forEach(function(k){ (db.sellers[k].locations||[]).forEach(function(l){
      var w = openWindow(l); if (w.from < from) from = w.from; if (w.to > to) to = w.to;
    })});
    return (from === 24) ? { from:10, to:20 } : { from:from, to:to };
  }
  function shopsOpenNow(){
    var w = shopHoursToday(), h = new Date(rightNow()).getHours();
    return h >= w.from && h < w.to;
  }
  function nextOpening(){
    var w = shopHoursToday(), d = new Date(rightNow());
    if (d.getHours() < w.from){ d.setHours(w.from,0,0,0); return d.getTime(); }
