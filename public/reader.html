        '<button class="btn ghost wide" style="margin-top:8px" data-act="skiprate:'+ord.id+':'+sb.no+'">Skip for now</button>'+
        '<p class="hint" style="margin-top:10px">You can edit a review for 24 hours. Skipping is fine \u2014 we will not ask again.</p></div>';
  }

  /* ============================== seller screens ============================== */
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dstr(ts){ var d = new Date(ts); return d.getDate()+' '+MONTHS[d.getMonth()]; }
  /* the same date with its year, for anything that is not within this one:
     "registered 31 Dec" reads as last week when it was two years ago */
  function dstrY(ts){
    var d = new Date(ts);
    return dstr(ts) + (d.getFullYear() === new Date(now).getFullYear() ? '' : ' ' + d.getFullYear());
  }
  function addDays(ts, n){ return ts + n*DAY; }

  function standing(){
    var a = db.account;
    var trialEnds = addDays(a.trialStart, 30);
    var daysLeft = Math.max(0, Math.ceil((trialEnds - now)/DAY));
    /* the billing day repeats monthly on the day the trial began */
    var next = new Date(now); next.setDate(a.billingDay);
    if (next.getTime() < now) next.setMonth(next.getMonth()+1);
    /* A shop that has said it paid is in `checking` until an operator agrees.
       WHAT IT KEEPS WHILE WE LOOK is the whole decision here, so it is written
       out rather than implied:
         first claim  — nothing stops. The claim is not anonymous: it carries a
           method and a reference we match against the bank, usually the same
           day. Freezing an honest shop because our operator has not opened the
           statement yet punishes them for our speed, not their payment.
         after a claim we could not find — the shop stays restricted until an
           operator confirms. A false claim buys one day and loses the benefit
           of the doubt permanently, which is the only deterrent this needs at
           ten shops.
       The flag is per account and clears the moment a claim is approved. */
    var underCheck = !!a.claim && !(a.claimStrikes > 0);
    return { state: underCheck ? 'checking' : (a.claim ? a.state : a.state),
             checking: !!a.claim, raw:a.state, claim:a.claim || null,
             strikes: a.claimStrikes || 0, reject: a.reject || null,
             rate:0.12, daysLeft:daysLeft, trialEnds:trialEnds,
             billingDay:a.billingDay, nextAt:next.getTime(), period:a.lastPeriod };
  }

  /* one open hour: the confirm clock only runs while that branch is open */
  function openWindow(l){
    var m = String(l && l.hours || '').match(/(\d{1,2})\D+(\d{1,2})\s*$/);
    return m ? { from:+m[1], to:+m[2] } : { from:11, to:19 };
  }
  /* Two functions stood here: confirmDueAt (one open hour to confirm) and
     abandonAt (and then it cancels itself at the end of the next open day).
     They were careful \u2014 the hour only ran while the branch was open, so a
     shop that shut early lost nothing \u2014 and they were still a number
     somebody made up before a single order had been placed.
     What a shop is told now is how long a reader has been waiting. What the
     office is told is the same thing. Nothing cancels on its own; a person
     who cannot find the book says so, which is one tap and always was. */
  function dayName(ts){
    return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(ts).getDay()];
  }
  function hhmm(ts){ var d = new Date(ts); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  /* collectBy(sb) — three days, then the shop was told to put it back —
     lived here. A book put aside is held until the reader comes or the shop
     decides they are not coming. */
  /* when this row entered the state it is in — the only honest clock left on
     an order, and the one the screens print instead of a deadline */
  function stateAt(sb){
    return sb.status === 'completed' || sb.status === 'cancelled' ? doneAt(sb)
      : sb.status === 'shipped' ? (sb.shippedAt || sb.readyAt || sb.placedAt || now)
      : sb.status === 'ready' ? (sb.readyAt || sb.placedAt || now)
      : (sb.placedAt || now);
  }
  function stateAge(sb){ return ago(stateAt(sb)) }

  /* ---- when the reader wants it ------------------------------------------
     A delivery slot is two hours wide, and the first one on offer starts at
     least TWO HOURS from now. That floor is not politeness, it is the truth:
     the shop has to find the book on its shelf and mark it ready, and only
     then can a courier set off to collect it. Offering 15:00 at 14:00 would
     be promising something nobody in the chain can keep.
     Order at 14:00 and the first slot offered is 16:00-18:00. */
  var SLOT_START = [10,12,14,16,18,20];   /* couriers ride 10:00-22:00 */
  var SLOT_LEAD  = 2*HOUR;
  function slotEnd(ts){ return ts + 2*HOUR }
  /* A concrete time, not a window. "16:00–18:00" reads as two hours of
     waiting in; "16:00" is something a reader can plan around, and it is what
     the courier is actually given. The two-hour slack still exists \u2014 it is
     the gap between the slots \u2014 it is just no longer the reader's problem to
     hold in their head. */
  function slotLabel(ts){ return hhmm(ts) }
  function dayLabel(ts){
    var t = new Date(ts), n = new Date(now);
    var same = function(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate() };
    var tm = new Date(now); tm.setDate(tm.getDate()+1);
    if (same(t,n)) return 'Today';
    if (same(t,tm)) return 'Tomorrow';
    return dayName(ts);
  }
  /* every slot that can still honestly be offered, three days out */
  function slotDays(){
    /* Always three usable days, not "today plus two". Order at 21:00 and today
       has nothing left to offer, so the strip starts at tomorrow and still
       reaches three days out rather than quietly shrinking to two.

       The floor is rounded DOWN to the minute before it is compared. Without
       that, ordering at 14:00:00.140 puts the floor at 16:00:00.140, the
       16:00 slot misses it by a seventh of a second, and the reader is told
       the earliest we can manage is 18:00 — two hours lost to milliseconds.
       Nobody would ever have found that by looking at the screen. */
    var floor = Math.floor((now + SLOT_LEAD) / 60000) * 60000, out = [];
    for (var dd = 0; dd < 4 && out.length < 3; dd++){
      var base = new Date(now); base.setDate(base.getDate()+dd);
      var slots = [];
      SLOT_START.forEach(function(hStart){
        var t = new Date(base); t.setHours(hStart,0,0,0);
        if (t.getTime() >= floor) slots.push(t.getTime());
      });
      if (slots.length) out.push({ key:dd, label:dayLabel(slots[0]), slots:slots });
    }
    return out;
  }
  function firstSlot(){ var ds = slotDays(); return ds.length ? ds[0].slots[0] : now + SLOT_LEAD }
  /* one line of plain words for whatever the reader chose */
  function whenText(w){
    var at = (w && w.kind === 'slot') ? w.at : firstSlot();
    return dayLabel(at)+', '+slotLabel(at);
  }
  /* the reader's own words back to them: they picked this window, and at
     every waiting moment the screen should say it rather than make them
     remember what they chose at checkout */
  function whenLine(ord){
    if (!ord || ord.delivery !== 'courier' || !ord.when) return '';
    return ord.when.kind==='slot'
      ? '<p class="small" style="margin:6px 0 0;color:var(--foreground)">You asked for <b>'+esc(dayLabel(ord.when.at).toLowerCase())+', '+slotLabel(ord.when.at)+'</b>. The courier will not come before it.</p>'
      : '<p class="small" style="margin:6px 0 0;color:var(--foreground)">You asked for it <b>as soon as possible</b>, so it comes as soon as every shop has been collected from.</p>';
  }
  function whenShort(w){
    var at = (w && w.kind === 'slot') ? w.at : firstSlot();
    return dayLabel(at).toLowerCase()+' '+slotLabel(at);
  }
  function pendingSubs(){
    var out = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.seller===db.me.sellerId && ['placed','confirmed','ready','shipped'].indexOf(sb.status)>=0) out.push({o:o, sb:sb});
    })});
    return out;
  }
  /* ---- who actually saw it -----------------------------------------------
     The deck shows one request at a time, so "this shop looked at this
     request" is a real event with a real moment. A scrolling feed could never
     say that: a card that went past at speed and a card nobody scrolled to
     are the same row in the log, which is why the old feed could not tell a
     request shops rejected from one they never reached.
     Recorded at render, when a card reaches the top of a shop's deck. */
  function sawIt(rid, sellerId){
    var r = req(rid); if (!r) return;
    if (!r.seenBy) r.seenBy = {};
    if (!r.seenBy[sellerId]) r.seenBy[sellerId] = Date.now();
  }
  /* Every shop the request was delivered to. Not all of them, always: a shop
     with an unpaid statement only gets what nobody answered in 72 hours, so
     "reached" has to be computed against each shop's standing, not assumed. */
  function reachedBy(r){
    /* a request still with us, or sent back, has reached nobody */
    if (!reqLive(r)) return [];
    return Object.keys(db.sellers).filter(function(k){
      if (db.sellers[k].suspended) return false;
      if (db.sellers[k].state === 'restricted') return false;
      return true;
    });
  }
  function answeredBy(r){
    var out = {};
    db.offers.forEach(function(o){
      if (o.req === r.id && ['sent','seen','in_cart','done_sold'].indexOf(o.status) >= 0) out[o.seller] = 1;
    });
    return Object.keys(out);
  }
  function missedBy(r){
    return Object.keys(db.sellers).filter(function(k){
      return (db.sellers[k].missed || []).indexOf(r.id) >= 0;
    });
  }

  function answered(rid){ return db.offers.some(function(o){ return o.req===rid && o.seller===db.me.sellerId && ['sent','seen','in_cart'].indexOf(o.status)>=0 }) }

  /* Requests this shop has not given a verdict on yet, newest first. A
     request leaves the deck three ways and only three: the shop answers it
     (it is in My offers), the shop misses it (it is in the archive), or the
     reader closes it. */
  function deckPile(f){
    var sl = seller(db.me.sellerId), skip = missedIds();
    var rs = db.requests.filter(function(r){
      return r.status === 'open' && reqLive(r) &&
             !answered(r.id) && skip.indexOf(r.id) < 0;
    });
    if (f === 'open') rs = rs.filter(function(r){ return r.kind === 'open' });
    if (f === 'conc') rs = rs.filter(function(r){ return r.kind !== 'open' });
    /* An unpaid statement stops new requests. It used to let the 72-hour
       leftovers through, which was a rule about a market nobody had watched;
       the honest version is that it stops them, and a person decides when it
       starts again. */
    if (standing().state === 'restricted') rs = [];
    return rs.sort(function(a, b){ return b.posted - a.posted });
  }
  /* cut at a word, never mid-syllable: "Bring back Something like Bor…" is
     a label that looks broken rather than shortened */
  function shortly(t, n){
    t = String(t || '').trim();
    if (t.length <= n) return t;
    var cut = t.slice(0, n);
    var sp = cut.lastIndexOf(' ');
    return (sp > n * 0.55 ? cut.slice(0, sp) : cut) + '\u2026';
  }
  function missedIds(){
    var sl = seller(db.me.sellerId);
    if (!sl.missed) sl.missed = [];
    return sl.missed;
  }
  /* what was missed and is still worth something: still open, still unanswered */
  function missedLive(){
    return missedIds().map(req).filter(function(r){
      return r && r.status === 'open' && !answered(r.id);
    });
  }

  /* The facts of a request, said the same way wherever it appears — on the
     card, in the archive, and folded into the offer flow. */
  function reqChips(r, dim){
    var c = dim ? ' dim' : '';
    return '<div class="wrap-row">'+
      '<span class="chip'+c+'">'+(r.kind === 'open' ? 'Something like\u2026' : 'Specific')+'</span>'+
      (r.budget ? '<span class="chip'+c+'">up to '+money(r.budget)+'</span>' : '')+
      (r.cond && r.cond !== 'any' ? '<span class="chip'+c+'">'+esc(r.cond)+'</span>' : '<span class="chip'+c+'">any condition</span>')+
      '<span class="chip'+c+'">'+esc(r.city)+'</span></div>';
  }
  function reqFoot(r){
    var n = liveOffers(r.id).length;
    return esc(db.readers[r.reader].name)+' \u00b7 '+ago(r.posted)+' ago \u00b7 '+
      (n ? n+' shop'+(n === 1 ? '' : 's')+' answered' : 'nobody has answered');
  }

  /* one card, face up. The pile behind it is decoration with a job: it is how
     the shop knows another one is coming. */
  function deckShell(pile){
    var r = pile[0];
    return '<div class="deck">'+
      (pile.length > 2 ? '<div class="deck-under c" aria-hidden="true"></div>' : '')+
      (pile.length > 1 ? '<div class="deck-under b" aria-hidden="true"></div>' : '')+
      '<article class="deck-card" id="deckcard" data-req="'+r.id+'">'+
        '<span class="verdict no" id="vno" aria-hidden="true">Miss</span>'+
        '<span class="verdict yes" id="vyes" aria-hidden="true">Offer</span>'+
        '<p class="eyebrow" style="margin-bottom:10px">'+(pile.length)+' waiting on you</p>'+
        /* A reader who names a book gets the title in the big type and their
           words under it. A reader who could not name it gets their words in
           the big type, because "No title" is not a headline \u2014 it is an
           apology for one, and what the shop needs to read is the sentence. */
        (r.title
          ? '<h2 class="deck-t">'+esc(r.title)+'</h2><p class="deck-q">\u201c'+esc(r.text)+'\u201d</p>'
          : '<h2 class="deck-t lead">\u201c'+esc(r.text)+'\u201d</h2>')+
        '<div style="height:14px"></div>'+
        reqChips(r)+
        '<p class="small muted" style="margin:12px 0 0">'+reqFoot(r)+'</p>'+
      '</article></div>';
  }

  /* Nothing to say once it has been read — until the last three days,
     which is a different sentence and gets its own hearing. */
  function trialSay(st){
    var ack = db.account.trialAck;
    if (st.daysLeft <= 3)
      return (ack !== null && ack <= 3) ? null
        : '<b>Your free month ends in '+st.daysLeft+' day'+(st.daysLeft === 1 ? '' : 's')+'</b>, then 12% of what you sell.';
    return ack !== null ? null
      : '<b>Free month \u00b7 '+st.daysLeft+' days left</b>, then 12% of what you sell.';
  }

  function scrFeed(){
    var st = standing();
    /* the card about to be shown has been seen by this shop, from now on */
    (function(){ var p = deckPile(view.p.filter || 'all'); if (p.length) sawIt(p[0].id, db.me.sellerId); })();
    var f = view.p.filter || 'all';
    var pile = deckPile(f);
    var back = missedLive();
    var restricted = st.state === 'restricted';
    var h = '<div class="between" style="margin-bottom:4px"><div class="grow"><h1>Requests</h1></div></div>'+
      /* No paragraph of explanation above the card. The card IS the screen,
         and every line here pushes it and its two buttons further from the
         thumb; what the shop needs to know is one line under the card, where
         it is read once and then ignored, as instructions should be.

         The free month is a FACT, not news, so once the shop has said it has
         read it the line goes and does not come back \u2014 a notice that
         cannot be dismissed is not a notice, it is furniture, and people stop
         seeing furniture. It does come back for the last three days, because
         "your month runs out on Thursday" is an event and a different
         sentence, and it can be put away again once that has been read too.
         Billing always states it in full; that is what billing is for. */
      '<p class="sub" style="margin-bottom:14px">'+(restricted
        ? 'New requests are not reaching you while the statement is unpaid.'
        : '')+'</p>'+
      (!restricted && st.state === 'trial' && trialSay(st)
        ? '<div class="note" style="margin-bottom:14px;padding:9px 12px"><div class="between" style="gap:10px">'+
            '<span class="grow" style="font-size:12.5px;line-height:17px">'+trialSay(st)+'</span>'+
            '<button class="btn ghost sm" data-act="ackfree">I understand</button></div></div>'
        : '')+
      (restricted
        ? '<div class="note bad" style="margin-bottom:18px"><b>Your statement is unpaid.</b> New requests stop reaching you until it is settled. Your open offers and running orders are not affected.'+
          '<div class="btns" style="margin-top:10px"><button class="btn sm" data-go="s.billing">Open billing</button></div></div>'
        : '')+
      '<div class="seg" style="margin-bottom:14px">'+
        '<button data-act="feed:all" aria-pressed="'+(f === 'all')+'">All</button>'+
        '<button data-act="feed:conc" aria-pressed="'+(f === 'conc')+'">Specific</button>'+
        '<button data-act="feed:open" aria-pressed="'+(f === 'open')+'">Open-ended</button></div>';

    var last = missedIds().length ? req(missedIds()[missedIds().length-1]) : null;
    var footRow = '<div class="deck-foot">'+
      (last
        ? '<button class="btn link" data-act="unmisslast">\u21ba Bring back '+esc(shortly(last.title || last.text, 24))+'</button>'
        : '<span class="small muted">Nothing missed yet.</span>')+
      (missedIds().length
        ? '<button class="btn link" data-go="s.missed">Missed \u00b7 '+missedIds().length+'</button>'
        : '')+
      '</div>';

    if (!pile.length){
      var foot = back.length
        ? '<button class="btn ghost" data-go="s.missed">Look through the '+back.length+' you missed</button>'
        : null;
      if (f !== 'all')
        return h + emptyBox('Nothing of this kind right now',
          'Try the other filters \u2014 what is open may just be the other sort of asking.', foot) + footRow;
      var anyOpen = db.requests.some(function(r){ return r.status === 'open' });
      if (!anyOpen)
        return h + emptyBox('Nobody is asking right now',
          'You are told when a request arrives \u2014 no need to sit here.',
          foot) + footRow;
      return h + emptyBox('You have been through the whole deck',
        back.length
          ? 'Everything open has had an answer from you, one way or the other.'
          : 'What you sent is waiting on readers, in My offers.',
        foot || '<button class="btn ghost" data-go="s.offers">See your offers</button>') + footRow;
    }

    return h + deckShell(pile) +
      '<p class="deck-hint">Swipe the card, or use the buttons.</p>'+
      '<div class="deck-acts">'+
        '<button class="btn ghost" data-act="swipe:no">Miss</button>'+
        '<button class="btn" data-act="swipe:yes">Offer a book</button></div>'+
      footRow;
  }

  /* ---- the archive --------------------------------------------------------
     A missed request is not a deleted one. A shop that passes on a title in
     the morning and finds the copy in a box that afternoon should be able to
     come back and answer it, and a shop that swiped by accident should not
     have to wait for the reader to post again. Every card the shop passed is
     here, whole, with the same two ways out as the deck had. */
  function scrMissed(){
    var ids = missedIds().slice().reverse();
    var rs = ids.map(req).filter(Boolean);
    var back = '<button class="back" data-go="s.feed">\u2190 Requests</button>';
    if (!rs.length)
      return back + '<h1>Missed</h1>' + emptyBox('Nothing missed yet',
        'A request you pass on is kept here rather than thrown away. Nothing is lost by missing one.',
        '<button class="btn ghost" data-go="s.feed">Back to the deck</button>');
    var live = rs.filter(function(r){ return r.status === 'open' && !answered(r.id) }).length;
    return back + '<h1>Missed</h1>'+
      '<p class="sub">'+(live ? live+' still open' : 'None still open')+'</p>'+
      '<div class="stack-list">'+rs.map(missedCard).join('')+'</div>';
  }

  function missedCard(r){
    var op = view.open === 'ms'+r.id;
    var mine = answered(r.id);
    var closed = r.status !== 'open';
    return '<div class="card">'+
      '<button class="opens" style="padding:0" data-act="toggle:ms'+r.id+'" aria-expanded="'+op+'">'+
        '<div class="between"><span class="grow">'+
          '<span class="book-t" style="display:block">'+esc(r.title || r.text.slice(0, 44)+'\u2026')+'</span>'+
          '<span class="small muted" style="display:block;margin-top:2px">'+reqFoot(r)+'</span></span></div>'+
        '<span class="disc" style="margin-top:8px">'+(op ? '\u25be hide what they asked' : '\u25b8 read what they asked')+'</span>'+
      '</button>'+
      (op
        ? '<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px">'+
            '<p class="said lead" style="margin:0 0 12px">\u201c'+esc(r.text)+'\u201d</p>'+ reqChips(r, true)+'</div>'
        : '')+
      '<div class="wrap-row" style="margin-top:12px">'+
        (closed
          ? '<span class="chip dim">closed \u2014 too late</span>'
          : mine
            ? '<span class="chip">you answered this</span>'
            : '<button class="btn ghost sm" data-act="offerfrom:'+r.id+'">Offer a book</button>'+
              '<button class="btn link" data-act="unmiss:'+r.id+'">Put it back in the deck</button>')+
      '</div></div>';
  }

  function scrSellerRequest(){
    var r = req(view.p.id); if(!r) return scrFeed();
    var mine = db.offers.filter(function(o){ return o.req===r.id && o.seller===db.me.sellerId });
    var live = mine.filter(function(o){ return ['sent','seen','in_cart'].indexOf(o.status)>=0 });
    var CAP = 10;
    var psr = paceState(r);
    var h = '<button class="back" data-go="'+(mine.length?'s.offers':'s.feed')+'">← '+(mine.length?'My offers':'Requests')+'</button>'+
      '<h1>'+esc(r.title || 'Request')+'</h1>'+
      (psr === 'running'
        ? '<div class="note hard" style="margin-bottom:14px"><div class="between">'+
          '<span class="grow" style="font-weight:600">They need it '+
            esc((WINDOWS.filter(function(w){return w[0]===r.window})[0]||['','soon'])[1]).toLowerCase()+'</span>'+
          '<span class="chip solid"><i class="dot live" aria-hidden="true"></i>'+leftShort(windowEndsAt(r))+'</span></div>'+
          '<p class="small muted" style="margin:6px 0 0">Answer only if the book is on your shelf now. A late offer still counts — the request stays open afterwards — but the clock is what they are watching.</p></div>'
        : '')+
      '<p class="sub">'+esc(db.readers[r.reader].name)+' · '+esc(r.city)+' · posted '+ago(r.posted)+' ago · '+liveOffers(r.id).length+' offers so far</p>'+
      '<div class="card" style="margin-bottom:16px"><p style="margin:0;font-size:16px;line-height:24px">“'+esc(r.text)+'”</p></div>'+
      '<div class="wrap-row" style="margin-bottom:22px"><span class="chip dim">'+(r.kind==='open'?'Something like…':'Specific')+'</span>'+
      (r.budget?'<span class="chip dim">up to '+money(r.budget)+'</span>':'')+
      '<span class="chip dim">'+esc(r.cond)+'</span><span class="chip dim">'+esc(r.city)+'</span></div>'+
      (r.status!=='open'
        ? '<div class="note hard">This request is closed — the reader ordered or stopped looking.</div>'
        : live.length>=CAP
          ? '<div class="note hard">You have '+CAP+' books on this request. Remove one to add another.</div>'
          /* "Use one you listed before" used to sit here. It offered to refill
             the form from an earlier offer, which sounds like a shortcut and
             is really a trap: the same physical copy gets promised to two
             readers, and the shop then has to take one down. A shop with the
             book in hand types it once; a shop without it should not be
             offering. One door in. */
          : '<div class="btns"><button class="btn" data-go="s.newoffer" data-p="'+r.id+'">'+(live.length?PLUS+'Offer another book':'Offer a book from your shelves')+'</button></div>');
    if (mine.length){
      h += '<h2>Your offers on this request ('+live.length+' live)</h2><div class="rowlist">'+mine.map(myOfferRow).join('')+'</div>';
    }
    h += '<p class="hint" style="margin-top:16px">You can see how many others answered, never what they asked for it.</p>';
    return h;
  }

  /* Which part of how many, drawn rather than counted. Only the part the shop
     is in is named: five labels will not fit across a phone, and five labels
     nobody can read are worse than one that can be. */
  function flowParts(openEnded){
    return openEnded ? ['Photo','The book','Why this one','Price','Check']
                     : ['Photo','The book','Price','Check'];
  }
  function flowAt(step, openEnded){
    if (step === 0) return 0;
    if (step === 1 || step === 4) return 1;
    if (step === 2) return 2;
    if (step === 3) return openEnded ? 3 : 2;
    return openEnded ? 4 : 3;            /* 8, the check */
  }
  function rail(parts, at){
    return '<div class="rail" role="presentation">'+parts.map(function(p, i){
      return '<span class="'+(i < at ? 'done' : i === at ? 'at' : '')+'"><i></i></span>';
    }).join('')+'</div>';
  }

  /* ---- the request, carried ------------------------------------------------
     A shop pricing a copy on part four is three screens away from the words
     it is answering, and the old flow's answer to that was a back button that
     threw the draft away. So the request comes along: folded shut by default,
     one tap from the whole thing, in the same place on every screen. It is
     read-only \u2014 nothing on it navigates, because leaving the flow is exactly
     what it exists to make unnecessary. */
  function askedCard(r){
    var op = view.open === 'ask';
    return '<div class="card asked-card">'+
      '<button class="opens" style="padding:0" data-act="toggle:ask" aria-expanded="'+op+'">'+
        '<span class="eyebrow" style="display:block;margin:0 0 3px">What they asked for</span>'+
        '<span class="small" style="display:block;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
          esc(r.title || r.text)+'</span>'+
        '<span class="disc" style="margin-top:8px">'+(op ? '\u25be fold it away' : '\u25b8 read it again')+'</span>'+
      '</button>'+
      (op
        ? '<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px">'+
            '<p class="said lead" style="margin:0 0 12px">\u201c'+esc(r.text)+'\u201d</p>'+
            reqChips(r, true)+
            '<p class="small muted" style="margin:10px 0 0">'+reqFoot(r)+'</p></div>'
        : '')+
    '</div>';
  }

  /* One screen, one decision. Nothing here should need scrolling on a phone:
     the book, then (for an open-ended request) why it answers, then the terms. */
  /* One screen, one decision, and every screen fits a phone.
     A seller answering with several books fills one of these per book; the
     finished ones wait in the basket and stay editable until the offer goes. */
  function scrNewOffer(){
    var editing = view.p.offer ? offer(view.p.offer) : null;
    var r = req(editing ? editing.req : view.p.id); if(!r) return scrFeed();
    var d = view.draft, sl = seller(db.me.sellerId);
    var openEnded = r.kind === 'open';
    if (d.step === undefined) d.step = editing ? 1 : 0;
    if (d.loc === undefined) d.loc = editing ? editing.loc : sl.locations[0].id;
    if (d.cond === undefined) d.cond = editing ? editing.cond : 'used';
    var v = function(k, fb){ return d[k]!==undefined ? d[k] : (editing ? editing[k] : (fb||'')) };

    var scope = editScope(editing);
    /* an offer that has been read has nothing to change on step 1, so editing
       one opens where the change actually is */
    if (editing && !scope.book && d.step !== 3){ d.step = 3; }
    var basket = d.books || [];
    var nth = basket.length + 1;
    var PARTS = flowParts(openEnded);
    var AT = flowAt(d.step, openEnded);
    var noAsked = false;

    /* Back walks the rail backwards, one part at a time, and never leaves the
       flow while there is unsent work: from the first screen of book N it
       returns to book N-1, which is still editable. Only from part one does it
       leave, and then to the deck — the request is still sitting there,
       because not finishing an offer is not the same as missing a request. */
    function backLink(){
      if (editing) return '<button class="back" data-go="s.offers">← My offers</button>';
      if (d.step === 1) return '<button class="back" data-act="step:0">← The photo</button>';
      if (basket.length)
        return '<button class="back" data-act="editbook:'+(basket.length-1)+'">← Book '+basket.length+'</button>';
      return '<button class="back" data-go="s.feed">← The deck</button>';
    }
    function head(title, lead, back){
      return (back || backLink())+
        (editing ? '' : rail(PARTS, AT))+
        '<p class="eyebrow">'+(editing
          ? 'Editing your offer'
          : (basket.length ? 'Book '+nth+' \u00b7 ' : '')+
            'Part '+(AT+1)+' of '+PARTS.length+' \u00b7 '+PARTS[AT])+'</p>'+
        '<h1>'+title+'</h1>'+
        (lead ? '<p class="sub">'+lead+'</p>' : '')+
        (editing || noAsked ? '' : askedCard(r))+
        (d.err ? '<div class="err">'+esc(d.err)+'</div>' : '');
    }
    var backToBook = '<button class="back" data-act="step:1">← The book</button>';

    /* --- 8 · check it, then send ----------------------------------------
       An offer cannot be recalled once a reader has read it, and until now
       the last thing a seller saw before sending was a form: condition and
       price for ONE book, with the others out of sight. This screen is the
       offer as the reader will meet it - every book, everything typed about
       it - with one row per book that opens, and an Edit that goes back to
       the book it names. Reading it is optional; having it is not. */
    if (d.step === 8){
      var bks8 = d.books || [];
      var h8 = '<button class="back" data-act="editbook:'+(bks8.length-1)+'">\u2190 The last book</button>'+
        rail(PARTS, AT)+
        '<p class="eyebrow">Part '+(AT+1)+' of '+PARTS.length+' \u00b7 '+PARTS[AT]+'</p>'+
        '<h1>Check the offer</h1>'+
        '<p class="sub">This is what '+esc(db.readers[r.reader].name)+' will see. Nothing has been sent yet \u2014 open a book to read it back, or edit it.</p>'+
        askedCard(r)+
        (d.err ? '<div class="err">'+esc(d.err)+'</div>' : '')+
        '<div class="stack-list">'+bks8.map(function(bk, i){
          var op = view.open === 'rev'+i;
          var l8 = loc(db.me.sellerId, bk.loc);
          var rows = [];
          if (bk.author) rows.push(['Author', bk.author]);
          if (bk.year) rows.push(['Year', bk.year]);
          if (bk.pub) rows.push(['Publisher', bk.pub]);
          if (bk.edition) rows.push(['Edition', bk.edition]);
          if (bk.lang) rows.push(['Language', bk.lang]);
          if (bk.pages) rows.push(['Pages', bk.pages]);
          if (bk.binding) rows.push(['Binding', bk.binding]);
          rows.push(['Branch', l8.label]);
          return '<div class="card">'+
            '<button class="opens" style="padding:0" data-act="toggle:rev'+i+'" aria-expanded="'+op+'">'+
              '<div class="row" style="padding:0;border:none;gap:12px">'+(op ? '' : cover(bk,'s'))+
                '<div class="grow stack" style="gap:3px">'+
                  '<p class="book-t" style="font-size:16px;line-height:22px">'+esc(bk.title || 'Untitled')+'</p>'+
                  '<p class="small muted" style="margin:0">'+esc(bk.cond)+' \u00b7 '+esc(l8.label)+'</p>'+
                '</div><span class="price">'+money(bk.price||0)+'</span></div>'+
              '<span class="disc" style="margin-top:8px">'+(op?'\u25be hide the details':'\u25b8 read it back')+'</span>'+
            '</button>'+
            (op
              ? '<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px">'+
                  /* The same shape the reader meets on the offer page: the
                     first photograph large, the others as thumbs under it.
                     Large because this is the screen where the seller checks
                     the photo, and a 46px cover checks nothing \u2014 the reader
                     will judge the copy on this picture, so the seller should
                     see it at the size the judgement is made at. And once per
                     card: the row's cover is the same image, so it stands
                     down while the card is open. */
                  ((bk.photos && bk.photos.length)
                    ? /* 220px, not the offer page's 340: there the photograph IS the screen,
                         here it shares a card with the price, the note, the branch and
                         the two buttons that edit or drop the book, and all of those
                         have to stay within reach of the same thumb. */
                      '<img class="thumb lg" src="'+bk.photos[0]+'" alt="" style="max-height:220px;margin-bottom:'+(bk.photos.length>1?'8':'10')+'px">'+
                      (bk.photos.length > 1
                        ? '<div class="thumbs" style="margin-bottom:10px">'+bk.photos.slice(1).map(function(u){
                            return '<img class="thumb" src="'+u+'" alt="">' }).join('')+'</div>'
                        : '')
                    : '<p class="small muted" style="margin:0 0 10px">No photo of this copy.</p>')+
                  (bk.note ? '<p class="said" style="margin:0 0 10px">'+esc(bk.note)+'</p>' : '')+
                  rows.map(function(x){
                    return '<div class="between" style="padding:3px 0"><span class="small muted grow">'+esc(x[0])+'</span>'+
                      '<span class="small">'+esc(x[1])+'</span></div>' }).join('')+
                  '<div class="btns" style="margin-top:12px">'+
                    '<button class="btn ghost sm" data-act="editbook:'+i+'">Edit this book</button>'+
                    '<button class="btn ghost sm" data-act="dropbook:'+i+'">Take it out</button></div>'+
                '</div>'
              : '')+
          '</div>';
        }).join('')+'</div>';
      return h8 + '<div class="page-tail">'+
        (bks8.length < 10 ? '<button class="btn ghost wide" style="margin-bottom:8px" data-act="addmore:'+r.id+'">'+PLUS+'Add another book</button>' : '')+
        '<button class="btn wide" data-act="sendoffer:'+r.id+'">Send the offer'+
          (bks8.length>1 ? ' \u00b7 '+bks8.length+' books' : '')+'</button>'+
        '<p class="hint" style="margin-top:8px">Once it is read you can still lower the price or say more \u2014 the book itself is fixed from then on.</p></div>';
    }

    /* --- sent --- */
    if (d.step === 9){
      var mine = myLiveOffers(r.id).filter(function(o){ return o.seller===db.me.sellerId });
      return '<h1>Sent</h1>'+
        '<p class="sub">'+esc(db.readers[r.reader].name)+' can see it now. You have '+mine.length+' book'+(mine.length>1?'s':'')+' on this request. It has left the feed and waits in <b>My offers</b>.</p>'+
        '<div class="card" style="margin-bottom:18px">'+mine.map(function(o){
          return '<div class="row" style="padding:8px 0;border:none">'+cover(o,'s')+
            '<div class="grow stack"><p style="margin:0">'+esc(o.title)+'</p>'+
            '<p class="small muted" style="margin:0">'+esc(o.cond)+' · '+esc(loc(o.seller,o.loc).label)+'</p></div>'+
            '<span class="price">'+money(o.price)+'</span></div>';
        }).join('')+'</div>'+
        /* One way on from here. The offer is sent and the screen's job is to
           say so; adding another book to a request already answered is a new
           decision, and it is on the request's own page where the shop can
           see what it has already promised. Two buttons on a confirmation
           screen make the confirmation look like a question. */
        '<div class="page-tail"><button class="btn wide" data-go="s.feed">Back to the feed</button></div>';
    }

    /* --- 0 · the copy in your hands ------------------------------------
       The first part asks for nothing typed. A shop presses Offer standing at
       the shelf with the book in its hand, and that is the one moment the
       photograph is free to take. Not required: a shop at a desk with the
       catalogue open can carry on and shoot it later, and a copy with no
       photograph still beats no copy. But it is asked first and asked alone,
       because a camera button sitting under nine form fields is a camera
       button nobody presses. */
    if (d.step === 0){
      var shots = d.photos !== undefined ? d.photos : (editing ? editing.photos : []);
      return head('Photograph the copy',
          'The foxing, the spine, the jacket \u2014 this is what a reader is really choosing between.') +
        basketStrip(basket) +
        shelfShot(shots) +
        /* With no photograph taken, the way on is an outline: nothing has
           been done yet, and there is nothing on this screen to put solid ink
           on except the camera \u2014 which is the largest thing here, has a
           picture in it, and is the only place the eye lands. Once a copy has
           been shot, Continue becomes the primary, because now there is
           something to carry forward. */
        '<div class="page-tail">'+
          '<button class="btn'+(shots.length ? '' : ' ghost')+' wide" data-act="step:1">'+(shots.length
            ? (shots.length === 1 ? 'Continue with this photo' : 'Continue with '+shots.length+' photos')
            : 'Continue without a photo')+'</button>'+
          '<p class="hint" style="margin-top:8px">'+(shots.length
            ? 'You can add more, or take them out, at any point before this goes.'
            : 'You can add one later, before the offer goes. A copy with a photograph is chosen far more often.')+'</p>'+
        '</div>';
    }

    /* --- 1 · which book --- */
    if (d.step === 1){
      return head('Which book is it?') +
        basketStrip(basket) +
        /* the shots taken in part one, kept in view and still editable — a
           seller who reopens this screen to fix a typo can see what it is a
           photograph of */
        '<p class="eyebrow" style="margin-bottom:6px">Photos of this copy</p>'+
        photoPicker(d.photos !== undefined ? d.photos : (editing ? editing.photos : []))+
        '<div style="height:18px"></div>'+
        '<label class="f"><span>Title</span><input class="in" id="o_title" value="'+esc(v('title'))+'"></label>'+
        '<div class="two tight"><label class="f"><span>Author</span><input class="in" id="o_author" value="'+esc(v('author'))+'"></label>'+
        '<label class="f"><span>Year</span><input class="in" id="o_year" inputmode="numeric" value="'+esc(v('year'))+'"></label></div>'+
        /* The detour goes ABOVE Continue, not under it. Continue is the end of
           this screen; anything below it is past the point where the eye
           stops, and a thumb aiming for the primary finds the button under it
           by accident. Optional work is offered while the fields are still in
           view, and the way on stays last. */
        '<button class="btn ghost wide" style="margin-bottom:8px" data-act="step:4">'+PLUS+'More about this copy — optional</button>'+
        '<button class="btn wide" data-act="step:'+(openEnded?2:3)+'">Continue</button>';
    }

    /* --- 4 · the rest of the book, a detour off screen 1 --- */
    if (d.step === 4){
      /* The one screen of the flow that does NOT carry the request. Publisher,
         edition, binding, page count: none of it is a judgement about what the
         reader asked for, it is transcription off a title page. The folded
         card costs 97px here and answers a question nobody is asking on this
         screen — and these seven fields are exactly the screen that cannot
         spare it. */
      noAsked = true;
      return head('More about this copy', 'All optional. A reader hunting a particular printing looks for exactly this.', backToBook) +
        '<div class="two tight"><label class="f"><span>Publisher</span><input class="in" id="o_pub" value="'+esc(v('pub'))+'"></label>'+
        '<label class="f"><span>Edition</span><input class="in" id="o_edition" value="'+esc(v('edition'))+'"></label></div>'+
        '<div class="two tight"><label class="f"><span>Language</span><input class="in" id="o_lang" value="'+esc(v('lang'))+'"></label>'+
        '<label class="f"><span>Pages</span><input class="in" id="o_pages" inputmode="numeric" value="'+esc(v('pages'))+'"></label></div>'+
        '<label class="f"><span>Binding</span><select class="in" id="o_binding">'+
          ['','hardcover','paperback','leather','boxed set'].map(function(c){ return '<option'+(v('binding')===c?' selected':'')+'>'+c+'</option>' }).join('')+
        '</select></label>'+
        (openEnded ? '' :
          '<label class="f"><span>Note about this copy</span>'+
          '<textarea class="in" id="o_note" style="min-height:60px" placeholder="Foxing on the endpapers, otherwise clean.">'+esc(v('note'))+'</textarea></label>')+
        '<button class="btn wide" data-act="step:1">Done</button>';
    }

    var bookLine = '<div class="between" style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)">'+
      '<div class="grow stack" style="gap:2px"><p style="margin:0;font-weight:500">'+esc(v('title'))+'</p>'+
      '<p class="small muted" style="margin:0">'+esc(v('author')||'no author given')+(v('year')?' · '+esc(v('year')):'')+'</p></div>'+
      '<button class="btn ghost sm" data-act="step:1">Change</button></div>';

    /* --- 2 · why this book (open-ended requests) --- */
    if (d.step === 2){
      return head('Why this one?',
          'Optional, but it is the only thing telling this reader apart from a list of prices — they did not name a book.',
          backToBook) +
        bookLine +
        '<label class="f"><span>Why this book answers them</span>'+
        '<textarea class="in" id="o_note" style="min-height:120px" placeholder="A mad-scientist novel, funny rather than grim — the narrator is the experiment. Short, 180 pages.">'+esc(v('note'))+'</textarea></label>'+
        '<button class="btn wide" data-act="step:3">Continue</button>';
    }

    /* --- 3 · condition, price, branch, and the basket --- */
    if (editing && !scope.book){
      var capped = scope.capped;
      return '<button class="back" data-go="s.offers">← My offers</button>'+
        '<p class="eyebrow">Editing your offer</p>'+
        '<h1>'+esc(editing.title)+'</h1>'+
        '<div class="note hard" style="margin-bottom:16px">'+scope.why+'</div>'+
        (d.err ? '<div class="err">'+esc(d.err)+'</div>' : '')+
        (capped
          ? '<div class="note bad" style="margin-bottom:16px"><b>You have changed this price '+PRICE_EDITS+' times.</b> That is as far as it goes. A price that keeps moving is a negotiation, and the reader has no way to answer it — if the copy is worth less than you asked, take this offer down and send a fresh one.</div>'
          : '<label class="f"><span>Lower the price — currently '+money(editing.price)+'</span>'+
            '<input class="in" id="o_price" inputmode="numeric" value="'+esc(v('price'))+'"></label>'+
            '<p class="hint" style="margin-top:-6px">'+((editing.priceEdits||0) ? (PRICE_EDITS-(editing.priceEdits||0))+' price change'+((PRICE_EDITS-(editing.priceEdits||0))===1?'':'s')+' left on this offer.' : 'You can go down, never up.')+'</p>')+
        '<label class="f"><span>What you say about this copy</span>'+
          '<textarea class="in" id="o_note" style="min-height:110px">'+esc(v('note'))+'</textarea></label>'+
        '<div class="btns"><button class="btn" data-act="saveoffer:'+editing.id+'">Save changes</button>'+
          '<button class="btn ghost" data-go="s.offers">Cancel</button></div>'+
        '<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border)">'+
          cbtn('btn ghost sm','removeoffer:'+editing.id,'Take this offer down','Yes, it is gone')+
          '<p class="hint" style="margin-top:8px">Sold in the shop, or not the copy you thought — taking it down tells the reader and costs you nothing.</p></div>';
    }
    return head('Condition and price', null, openEnded
        ? '<button class="back" data-act="step:2">← Why this one</button>'
        : backToBook) +
      /* What is already in this offer belongs at the TOP of every screen that
         edits a book, not at the bottom of the last one. A seller typing the
         price of book three needs to know what books one and two cost before
         they choose this one's number, and a strip they have to scroll to
         find is a strip they do not read. Same position as on "Which book?",
         so it is in the same place every time. */
      (basket.length && !editing
        ? '<div class="card" style="margin-bottom:16px"><p class="eyebrow">Also going with this offer</p>'+
          basket.map(function(bk, i){
            return '<div class="between" style="padding:6px 0">'+
              '<div class="grow stack" style="gap:2px"><p style="margin:0;font-weight:500">'+esc(bk.title || 'Untitled')+'</p>'+
              '<p class="small muted" style="margin:0">'+esc(bk.cond)+(bk.price ? ' · '+money(bk.price) : ' · no price yet')+'</p></div>'+
              '<button class="btn ghost sm" data-act="editbook:'+i+'">Edit</button>'+
              '<button class="btn ghost sm" data-act="dropbook:'+i+'">Remove</button></div>';
          }).join('')+'</div>'
        : '')+
      bookLine +
      '<div class="two tight"><label class="f"><span>Condition</span><select class="in" id="o_cond">'+
        GRADES.map(function(c){ return '<option'+(d.cond===c?' selected':'')+'>'+c+'</option>' }).join('')+
      '</select></label>'+
      '<label class="f"><span>Your price</span><input class="in" id="o_price" inputmode="numeric" value="'+esc(v('price'))+'" placeholder="4500"></label></div>'+
      /* Both of the reader's limits, said the same way: here is what they
         asked for, you may answer with something else, they decide. A shop
         with the wrong grade at the right price should offer it — the reader
         is comparing real copies, and "nothing" is the worst answer we can
         put in front of them. */
      askedFor(r) +
      (sl.locations.length>1
        ? '<p class="eyebrow">Which branch is this copy on?</p><div class="seg" style="margin-bottom:16px">'+sl.locations.map(function(l){
            return '<button data-act="loc:'+l.id+'" aria-pressed="'+(d.loc===l.id)+'">'+esc(l.label)+'</button>';
          }).join('')+'</div>'
        : '<p class="hint">It will show as '+esc(sl.locations[0].label)+'.</p>')+
      (editing
        ? '<div class="btns"><button class="btn" data-act="saveoffer:'+editing.id+'">Save changes</button>'+
          '<button class="btn ghost" data-act="step:1">Back</button></div>'
        /* Add another book sits ABOVE Send, not under it. Sending is the end of
           the flow, so it belongs last — and a secondary button under the
           primary one is the one a thumb reaches for by accident, which here
           means an offer going out with a book still half filled in. */
        : (nth < 10 ? '<button class="btn ghost wide" style="margin-bottom:8px" data-act="addmore:'+r.id+'">'+PLUS+'Add another book</button>' : '')+
          '<button class="btn wide" data-act="toreview:'+r.id+'">Check the offer'+
            (basket.length ? ' · '+nth+' books' : '')+'</button>');
  }

  /* What is already in this offer, shown while the next book is being typed.
     A seller filling book 3 was working blind: the basket only appeared on the
     last screen, so "have I already put the Penguin in?" meant walking forward
     to find out. One compact line each, editable, and it disappears when there
     is nothing in it. */
  function basketStrip(basket){
    if (!basket || !basket.length) return '';
    /* Information, not controls. An Edit button per row forces every row to a
       36px touch target, and the strip then costs 120px on a screen with 119
       to spare. It also breaks the house rule that a list never acts: this is
       here so the seller can SEE what is already in the offer. Editing lives
       where it already lived — the back link to the previous book, and the
       basket on the terms screen. */
    var SHOW = 2;
    return '<div style="margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)">'+
      '<p class="eyebrow" style="margin:0 0 2px">Already in this offer</p>'+
      basket.slice(0, SHOW).map(function(bk){
        return '<p class="small" style="margin:0;color:var(--foreground);overflow:hidden;'+
          'text-overflow:ellipsis;white-space:nowrap">'+esc(bk.title || 'Untitled')+
          '<span class="muted"> · '+(bk.price ? money(bk.price) : 'no price yet')+'</span></p>';
      }).join('')+
      (basket.length > SHOW
        ? '<p class="small muted" style="margin:0">and '+(basket.length-SHOW)+' more</p>'
        : '')+
      '</div>';
  }

  /* one book, taken off the form. Never touches the request — that happens at send. */
  /* the reader's limits, stated as preferences rather than rules */
  function askedFor(r){
    var bits = [];
    if (r.budget) bits.push('up to <b>'+money(r.budget)+'</b>');
    if (r.cond && r.cond !== 'any') bits.push('<b>'+esc(r.cond)+'</b>');
    if (!bits.length)
      return '<p class="hint" style="margin-top:-8px">They set no price limit and did not mind the condition — offer whatever you have.</p>';
    return '<p class="hint" style="margin-top:-8px">They asked for '+bits.join(' · ')+
      '. Offer another '+(bits.length>1 ? 'price or grade' : (r.budget ? 'price' : 'grade'))+
      ' if that is what is on your shelf — they decide, and a copy they can see beats nothing.</p>';
  }

  function draftBook(d){
    return { loc:d.loc, title:(d.title||'').trim(), author:d.author||'', year:parseInt(d.year,10)||null,
      cond:d.cond||'used', price:parseInt(d.price,10)||null, note:(d.note||'').trim(),
      pub:d.pub||'', edition:d.edition||'', lang:d.lang||'', pages:parseInt(d.pages,10)||null,
      binding:d.binding||'', photos:(d.photos||[]).slice() };
  }
  /* Only two things are actually required of a book: what it is, and what it
     costs. The note is encouraged on an open-ended request and never demanded. */
  function bookProblem(b){
    if (!String(b.title||'').trim()) return { step:1, msg:'Which book is it? A title, at least.' };
    if (!parseInt(b.price,10)) return { step:3, msg:'Give it a price — that is what the reader compares.' };
    return null;
  }

  /* `pastBooks` and the "reuse a book you listed before" screen lived here.
     They refilled the offer form from an earlier offer, which promises the
     same physical copy to two readers: whoever orders first gets it and we
     have to ask the shop to take the other one down. The screen carried a
     warning saying exactly that, which is the sign a shortcut is wrong rather
     than the fix for it. A shop with the book in hand types it once. */
  function myOfferRow(o){
    var r = req(o.req), l = loc(o.seller, o.loc);
    var label = o.review === 'waiting' ? 'being checked'
      : o.review === 'sent back' ? 'sent back'
      : { sent:'sent', seen:'seen', in_cart:'in a cart', done_sold:'sold', done_not_chosen:'not chosen', declined:'set aside', removed:'removed' }[o.status];
    var live = ['sent','seen','in_cart'].indexOf(o.status)>=0;
    return '<div class="row'+(live?'':' past')+'">'+cover(o,'s')+
      '<div class="grow stack"><p style="margin:0">'+esc(o.title)+'</p>'+
      '<p class="small muted" style="margin:0">'+money(o.price)+' · '+esc(l.label)+' · sent '+ago(o.sent)+' ago</p>'+
      '<p class="small muted" style="margin:0">→ '+esc((r.title||r.text).slice(0,44))+'…</p>'+
      (live ? '<div class="wrap-row" style="margin-top:4px">'+
        '<button class="btn ghost sm" data-act="editoffer:'+o.id+'">Edit</button>'+
        cbtn('btn link','removeoffer:'+o.id,'Sold elsewhere — take down','Yes, it is gone')+'</div>' : '')+
      '</div><span class="chip'+(o.status==='in_cart'?'':' dim')+'">'+label+'</span></div>';
  }

  function offerMini(o){
    var l = loc(o.seller, o.loc);
    var label = o.review === 'waiting' ? 'being checked'
      : o.review === 'sent back' ? 'sent back'
      : { sent:'sent', seen:'seen', in_cart:'in a cart', done_sold:'sold', done_not_chosen:'not chosen', declined:'set aside', removed:'removed' }[o.status];
    var live = ['sent','seen','in_cart'].indexOf(o.status)>=0;
    return '<div class="row'+(live?'':' past')+'" style="padding:10px 0;border:none">'+cover(o,'s')+
      '<div class="grow stack">'+
        '<div class="between"><p style="margin:0;font-weight:500" class="grow">'+esc(o.title)+'</p><span class="price">'+money(o.price)+'</span></div>'+
        '<p class="small muted" style="margin:0">'+esc(o.cond)+' \u00b7 '+esc(l.label)+' \u00b7 '+ago(o.sent)+' ago</p>'+
        (o.review === 'sent back'
          ? shopBackLine(o, o.reviewWhy)
          : live ? '<div class="wrap-row" style="margin-top:2px">'+
          '<button class="btn ghost sm" data-act="editoffer:'+o.id+'">Edit</button>'+
          cbtn('btn link','removeoffer:'+o.id,'Sold elsewhere \u2014 take down','Yes, it is gone')+'</div>' : '')+
      '</div>'+
      '<span class="chip'+(o.status==='in_cart'||o.status==='done_sold'?'':' dim')+'">'+label+'</span></div>';
  }

  function scrMyOffers(){
    var all = myOffers();
    if (!all.length) return '<h1>Your offers</h1>'+ emptyBox(
      'You have not answered anything yet',
      'Offers you send stay here until a reader orders.',
      '<button class="btn wide" data-go="s.feed">See what people are asking for</button>');

    var live = all.filter(function(o){ return ['sent','seen','in_cart'].indexOf(o.status)>=0 });
    var sold = all.filter(function(o){ return o.status==='done_sold' });

    /* one card per request, the offers you sent to it inside */
    var groups = [];
    all.forEach(function(o){
      var g = groups.filter(function(x){ return x.rid===o.req })[0];
      if (!g){ g = { rid:o.req, offers:[], last:0 }; groups.push(g) }
      g.offers.push(o);
      if (o.sent > g.last) g.last = o.sent;
    });
    groups.sort(function(a,b){ return b.last - a.last });

    /* Live, sold and closed used to be one page twenty thousand pixels long.
       Each is its own view now: live is the one with work in it. */
    var isLive = function(o){ return ['sent','seen','in_cart'].indexOf(o.status)>=0 || o.review === 'sent back' };
    var tabOf = function(o){ return isLive(o) ? 'live' : o.status === 'done_sold' ? 'sold' : 'closed' };
    var ot = P('ot', 'live');
    var closedN = all.filter(function(o){ return tabOf(o) === 'closed' }).length;
    var shown = groups.filter(function(g){ return g.offers.some(function(o){ return tabOf(o) === ot }) });
    var pgO = paged(shown, 'n');
    var h = '<h1>Your offers</h1>'+

      aseg('ot', [['live', 'Live', live.length], ['sold', 'Sold', sold.length], ['closed', 'Closed', closedN]], ot)+
      (ot === 'closed' ? '<p class="small muted" style="margin:-4px 0 14px">Not chosen, taken down or set aside. Kept for your record.</p>' : '')+
      (!shown.length ? emptyBox(ot === 'live' ? 'Nothing live right now' : ot === 'sold' ? 'Nothing sold yet' : 'Nothing closed',
          ot === 'live' ? 'Answer a request and your offer waits here until the reader orders.' : '',
          ot === 'live' ? '<button class="btn" data-go="s.feed">Open the feed</button>' : '') : '')+
      '<div class="stack-list">';

    pgO.rows.forEach(function(g){
      var r = req(g.rid);
      var liveN = g.offers.filter(function(o){ return ['sent','seen','in_cart'].indexOf(o.status)>=0 }).length;
      h += '<div class="card">'+
        '<button class="opens" data-go="s.request" data-p="'+r.id+'" style="padding:0">'+
          '<p class="eyebrow" style="margin-bottom:4px">'+esc(db.readers[r.reader].name)+' asked for</p>'+
          '<p class="book-t" style="font-size:15px">'+esc(r.title || r.text.slice(0,70)+(r.text.length>70?'\u2026':''))+'</p>'+
        '</button>'+
        '<div class="wrap-row" style="margin:8px 0 4px">'+
          (g.offers.length > 1 ? '<span class="chip dim">'+g.offers.length+' books sent \u00b7 '+liveN+' live</span>' : '')+
          (r.status!=='open' ? '<span class="chip">request '+esc(r.status)+'</span>' : '')+
          (liveN >= 10 ? '<span class="chip">at the 10-book limit</span>' : '')+
        '</div>'+
        g.offers.filter(function(o){ return tabOf(o) === ot }).map(offerMini).join('')+
        (ot === 'live' && r.status==='open' && liveN < 10
          ? '<button class="btn ghost sm" style="margin-top:8px" data-go="s.newoffer" data-p="'+r.id+'">'+PLUS+'Offer another book</button>' : '')+
      '</div>';
    });
    return h + '</div>' + moreBtn(pgO);
  }

  /* ---- what a bookseller may know about the buyer -------------------------
     On a COURIER delivery: nothing. Not the name, not the phone, not the
     address. The shop hands the book to a Shelfcall courier and is paid for
     the book; who lives where is not part of that transaction, and a home
     address is the single most sensitive thing this product holds. A shop
     that never receives it can never leak it, lose it, or turn up at it.
     On a PICKUP: a name and a phone, because a stranger is going to walk in
     and say "I am here for an order" and somebody has to match them to a
     parcel — and if they never come, the shop needs to be able to ring.
     This is the same rule as the courier note, pointed the other way. */
  function buyerLabel(ord, sb){
    return sb.delivery === 'courier' ? 'Order #'+sb.no : esc(ord.name || db.readers[ord.reader].name);
  }

  function sellerSub(no){
    var found = null;
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.no === no && sb.seller === db.me.sellerId) found = {o:o, sb:sb};
    })});
    return found;
  }

  /* the list never acts. Tap through to the order and decide there. */
  function scrSellerOrders(){
    var ps = pendingSubs();
    var done = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){ if(sb.seller===db.me.sellerId && ['completed','cancelled'].indexOf(sb.status)>=0) done.push({o:o,sb:sb}) })});
    if (!ps.length && !done.length) return '<h1>Orders</h1>'+ emptyBox(
      'No orders yet',
      'An order arrives when a reader takes one of your offers.',
      (myOffers().length
        ? '<button class="btn ghost" data-go="s.offers">Your live offers</button>'
        : '<button class="btn wide" data-go="s.feed">Answer a request first</button>'));

    var stab = view.p.tab || 'live';
    /* "with the courier" asks nothing of the shop, so it is not counted as to do */
    var todoN = ps.filter(function(x){ return !(x.sb.status === 'shipped' && x.sb.delivery === 'courier') }).length;
    var h = '<h1>Orders</h1>'+
      '<div data-slot="tabs-list" class="seg" style="margin-bottom:16px">'+
        '<button data-act="otab:live" aria-pressed="'+(stab==='live')+'">To do'+(todoN?' \u00b7 '+todoN:'')+'</button>'+
        '<button data-act="otab:past" aria-pressed="'+(stab==='past')+'">Finished'+(done.length?' \u00b7 '+done.length:'')+'</button>'+
      '</div>';
    if (stab === 'past'){
      if (!done.length) return h + emptyBox('Nothing finished yet',
        'Completed and cancelled orders are kept here.');
      return h + sellerDone(done);
    }
    /* Thirty orders in one list hid the twelve that need the shop. They are
       split by what the shop has to do next, the one that needs hands first
       and oldest first inside it; the rest are waits, and say whose wait.
       A buyer standing at the counter is the busiest moment of the day, so
       their four digits find their order from the top of the screen. */
    var sub = function(x){ return x.sb };
    var find = ps.filter(function(x){ return ['placed','confirmed'].indexOf(x.sb.status) >= 0 })
                 .sort(function(a, b){ return (a.sb.placedAt||0) - (b.sb.placedAt||0) });
    var aside = ps.filter(function(x){ return x.sb.status === 'shipped' && x.sb.delivery === 'pickup' })
                  .sort(function(a, b){ return (a.sb.readyAt||0) - (b.sb.readyAt||0) });
    var coming = ps.filter(function(x){ return x.sb.status === 'ready' });
    var withC = ps.filter(function(x){ return x.sb.status === 'shipped' && x.sb.delivery === 'courier' });
    if (!ps.length) h += emptyBox('Nothing waiting on you',
      'An order arrives when a reader takes one of your offers.');
    if (aside.length){
      h += '<div class="codebox" style="margin:0 0 12px;padding-top:10px;padding-bottom:10px"><div class="grow"><p style="margin:0;font-weight:600">Buyer at the counter?</p></div>'+
        '<div class="wrap-row"><input class="in'+(view.codeErr === 'find' ? ' bad' : '')+'" id="findcode" inputmode="numeric" maxlength="4" placeholder="0000" '+
          'aria-label="Buyer\'s code" style="width:96px;text-align:center;letter-spacing:.2em">'+
        '<button class="btn sm" data-act="findcode">Find</button></div>'+
        (view.codeErr === 'find' ? '<p class="small bad-t" style="width:100%;margin:0">No order put aside here has that code. Ask them to read it again.</p>' : '')+
      '</div>';
    }
    var orow = function(x, chip, solid){
      var sb = x.sb, l = loc(sb.seller, sb.loc), rd = db.readers[x.o.reader];
      /* the book is the hero: it is what the shop goes to the shelf for.
         Under it, how it leaves (the badge), the number and whose it is. */
      return '<button class="card-row" data-go="s.order" data-p="'+sb.no+'" style="align-items:center">'+
        '<div class="grow stack" style="gap:6px;min-width:0">'+
          '<p class="book-t" style="margin:0;font-size:16px;line-height:21px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+
            sb.items.map(function(id){ return esc(offer(id).title) }).join(' \u00b7 ')+'</p>'+
          '<div style="display:flex;gap:8px;align-items:center;min-width:0">'+dbadge(sb.delivery)+
            '<span class="small muted" style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">#'+sb.no+(sb.delivery==='pickup' ? ' \u00b7 '+esc(rd.name) : '')+
            (seller(sb.seller).locations.length > 1 ? ' \u00b7 '+esc(l.label) : '')+'</span></div>'+
        '</div>'+
        '<div class="stack" style="flex:none;align-items:flex-end;gap:4px">'+
          (chip ? '<span class="chip'+(solid ? ' solid' : ' dim')+'">'+chip+'</span>' : '')+
          '<span class="small muted">'+money(sb.total)+'</span></div></button>';
    };
    /* Four states used to be stacked as four sections on one long page, so
       the shop scrolled past waits to find work. Each state is its own view
       now; the chips carry the counts, so nothing is hidden, and the view
       opens on the first state that has anything in it. */
    var STATES = [
      ['find',   'To find',            find,   'Take these off the shelf and mark them ready.',              function(x){ return orow(x, ago(x.sb.placedAt||now), true) }],
      ['aside',  'Waiting',  aside,  'Put aside. The buyer pays at the counter and gives four digits.', function(x){ return orow(x, ago(x.sb.readyAt||now)) }],
      ['coming', 'Courier',     coming, 'Ready. A courier will come and pay you for them.',          function(x){ return orow(x, '') }],
      ['withc',  'Sent',       withC,  'On the way to the buyer. Nothing for you to do.',           function(x){ return orow(x, '') }]
    ];
    var live = STATES.filter(function(t){ return t[2].length });
    if (live.length){
      var cur = P('ost', '');
      var st = STATES.filter(function(t){ return t[0] === cur })[0] || live[0];
      /* one control, one line, all four states always in the same place;
         it stays under the top bar so changing state never means scrolling
         back up a long list */
      h += '<div class="pin-act pin-states">'+aseg('ost', STATES.map(function(t){ return [t[0], t[1], t[2].length] }), st[0])+'</div>';
      if (!st[2].length) h += emptyBox('Nothing here', 'No orders in this state right now.');
      var pg = paged(st[2], 'n');
      h += '<div class="stack-list">'+pg.rows.map(st[4]).join('')+'</div>'+moreBtn(pg);
    }
    return h;
  }

  function sellerDone(done){
    var h = '';
    {
      /* "The courier says these are paid — tap to agree" used to stand here.
         It asked the shop to ratify something that had already been recorded,
         often days later, with the courier long gone. The handover is a live
         event now and it lives on the billing screen, where the shop's money
         is. */
      h += '<h2>Finished</h2><div class="rowlist">'+done.map(function(x){
        return '<button class="row" data-go="s.order" data-p="'+x.sb.no+'" style="text-align:left"><div class="grow stack"><p style="margin:0">#'+x.sb.no+(x.sb.delivery==='pickup' ? ' · '+esc(db.readers[x.o.reader].name) : '')+'</p>'+
          '<p class="small muted" style="margin:0">'+x.sb.items.map(function(id){return esc(offer(id).title)}).join(' · ')+'</p>'+
          (x.sb.disputed ? '<p class="small bad-t" style="margin:0">The buyer flagged a problem — held out of your statement</p>' : '')+
          (x.sb.cashDisputed ? '<p class="small bad-t" style="margin:0">You said the cash never arrived — an operator is on it</p>' : '')+
          (x.sb.status==='completed' && !x.sb.reviewed && !x.sb.asked ? '<p class="small muted" style="margin:2px 0 0">not rated — you can ask once</p>' : '')+
          '</div>'+
          '<span class="chip'+(x.sb.cancelReason?' bad':' dim')+'">'+(x.sb.cancelReason ? 'cancelled · '+esc(x.sb.cancelReason) : x.sb.status+(x.sb.code?' · '+x.sb.code:''))+'</span>'+
          '<div class="price">'+money(x.sb.total)+'</div></button>';
      }).join('')+'</div>';
    }
    return h;
  }

  /* one order, one page, one decision */
  function scrSellerOrder(){
    var f = sellerSub(view.p.id); if (!f) return scrSellerOrders();
    var sb = f.sb, o = f.o, l = loc(sb.seller, sb.loc), rd = db.readers[o.reader];
    var soldTitles = sb.items.map(function(id){ return norm(offer(id).title) });
    var same = myOffers().filter(function(x){
      return ['sent','seen','in_cart'].indexOf(x.status)>=0 && soldTitles.indexOf(norm(x.title)) >= 0;
    });

    /* One order, read at the counter. Top to bottom: what state it is in,
       the book, the one thing to do now, then who it goes to. Explanations
       are one line each and sit next to the control they explain. */
    var head = sb.status==='completed' ? (sb.delivery==='pickup' ? 'Collected' : 'Delivered')+' '+dstr(doneAt(sb))+' · '+(shopCash(sb)==='paid' ? 'paid' : 'cash still with the courier')
      : sb.status==='cancelled' ? 'Cancelled'
      : sb.status==='placed' ? 'Waiting on you for '+ago(sb.placedAt||now)
      : sb.status==='ready' ? 'Ready · a courier is coming'
      : sb.delivery==='pickup' ? 'Put aside '+ago(sb.readyAt||now)+' ago' : 'With the courier';
    var h = '<button class="back" data-go="s.orders">← Orders</button>'+
      /* the book is the heading; the number is a reference, kept beside the badge */
      '<h1>'+sb.items.map(function(id){ return esc(offer(id).title) }).join(' \u00b7 ')+'</h1>'+
      '<div class="wrap-row" style="gap:8px;align-items:center;margin:-4px 0 14px">'+dbadge(sb.delivery)+
        '<p class="sub" style="margin:0"><b style="color:var(--foreground)">'+esc(head)+'</b> · #'+esc(sb.no)+' · '+esc(l.label)+'</p></div>';

    /* the handover comes first when the buyer is standing there */
    if (sb.status==='shipped' && sb.delivery==='pickup' && sb.code){
      h += '<div class="codebox" style="margin:0 0 14px"><div class="grow"><p style="margin:0;font-weight:600">Take '+money(sb.total)+', then type their four digits</p></div>'+
        '<div class="wrap-row"><input class="in'+(view.codeErr===sb.no?' bad':'')+'" id="code_'+sb.no+'" inputmode="numeric" maxlength="4" placeholder="0000" value="'+esc(view.p.code||'')+'" aria-label="Buyer’s code" style="width:96px;text-align:center;letter-spacing:.2em">'+
        '<button class="btn sm" data-act="entercode:'+o.id+':'+sb.no+'">Done</button></div>'+
        (view.codeErr===sb.no ? '<p class="small bad-t" style="width:100%;margin:0">That is not the code on the buyer’s order. Ask them to read it again.</p>' : '')+
        '</div>';
    }

    /* the books, each price once, the total once */
    var many = sb.items.length > 1;
    h += '<div class="card" style="margin-bottom:12px">'+sb.items.map(function(id){ var b=offer(id);
      return '<div class="row" style="padding:8px 0;border:none">'+cover(b,'m')+
        '<div class="grow stack"><p style="margin:0;font-weight:500">'+esc(b.title)+'</p>'+
        '<p class="small muted" style="margin:0">'+esc([b.author, b.year, b.cond].filter(function(x){ return x }).join(' · '))+'</p></div>'+
        (many ? '<span class="price">'+money(b.price)+'</span>' : '')+'</div>';
    }).join('')+
      '<div class="between" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">'+
        '<span class="grow">'+(sb.status==='completed' ? 'Paid in cash'
          : sb.delivery==='courier' ? 'The courier pays you' : 'Cash at the counter')+'</span>'+
        '<span class="price">'+money(sb.books)+'</span></div>'+
      '</div>';

    /* the one decision, straight under the book */
    if (sb.status==='placed'){
      if (sb.delivery==='courier' && o.when && o.when.kind==='slot')
        h += '<p class="small muted" style="margin:0 0 8px">The courier comes for it '+esc(dayLabel(o.when.at).toLowerCase())+', '+slotLabel(o.when.at)+'. Mark it ready as soon as it is wrapped.</p>';
      h += '<button class="btn wide" data-act="ready:'+o.id+':'+sb.no+'">'+
        (sb.delivery==='courier' ? 'Ready for delivery' : 'Ready for pickup')+'</button>'+
        (sb.delivery==='pickup' ? '<p class="hint" style="margin-top:8px">The buyer then gets your address, hours and a four-digit code.</p>' : '');
    }
    if (sb.status==='ready')
      h += '<div class="note" style="margin-bottom:12px"><b>A courier is coming for it.</b> Keep it wrapped by the counter.</div>';

    /* who it goes to: on a delivery, nobody the shop needs to know */
    h += sb.delivery==='courier'
      ? '<p class="small muted" style="margin:14px 0 0">A Shelfcall courier collects it. You do not see the buyer\'s name, phone or address on a delivery.</p>'
      : '<div class="card" style="margin:14px 0 0"><p class="eyebrow">Collected by</p>'+
        (sb.status==='placed'
          ? '<p class="small muted" style="margin:0">'+esc(rd.name)+' — the phone appears once you mark it ready.</p>'
          : '<p style="margin:0">'+esc(o.name||rd.name)+' · '+esc(o.phone||rd.phone||'')+'</p>')+'</div>';

    /* the way back for a book nobody came for, last */
    if (sb.status==='shipped' && sb.delivery==='pickup')
      h += '<div class="btns" style="margin-top:14px">'+cbtn('btn ghost sm','release:'+o.id+':'+sb.no,'Not collected — put it back','Yes, back on the shelf')+'</div>';

    /* something can go wrong after you said yes — better here than at the door */
    if (['placed','confirmed','ready'].indexOf(sb.status) >= 0 || (sb.status==='shipped' && sb.delivery==='pickup')){
      h += reasonBlock(
        sb.status==='placed' ? 'I cannot do this one' : 'Something happened to the book',
        'sellerout:'+o.id+':'+sb.no,
        ['sold in the shop', 'cannot find it', 'damaged', 'changed my mind'],
        sb.status==='ready'
          ? 'The courier is stood down. The reader is told and their request reopens.'
          : 'The reader is told and their request reopens.');
    }

    if (sb.askSameCopy && same.length){
      h += '<div class="note hard" style="margin-top:12px">'+
        '<b>Do you have more than one “'+esc(offer(sb.items[0]).title)+'”?</b><br>'+
        'You have also offered it on '+same.length+' other request'+(same.length>1?'s':'')+'. '+
        'If there is only one copy on your shelf, take it down there — otherwise another reader can order a book you have just sold.'+
        '<div class="btns" style="margin-top:10px">'+same.slice(0,3).map(function(x){
          return '<button class="btn ghost sm" data-act="removeoffer:'+x.id+'">One copy — take it down</button>';
        }).join('')+
        '<button class="btn ghost sm" data-act="dismisssame:'+o.id+':'+sb.no+'">I have another copy</button></div></div>';
    }

    /* Asking for a review is ONE TAP AND ONE MESSAGE, and the shop does not
       write it. There is no chat in Shelfcall, and a free-text "could you
       leave me five stars" is chat with a worse name. So the button sends a
       fixed notice — the shop's name, the order, a link to the rating screen —
       and then it is gone. A shop gets one ask per order, for the same reason
       a person gets one: the second one is pestering, and a reader who ignored
       the first will not be moved by it. */
    if (sb.status === 'completed'){
      h += '<div class="card" style="margin-top:16px"><p class="eyebrow">Reviews</p>'+
        (sb.reviewed
          ? '<p style="margin:0">'+(sb.delivery==='pickup'?esc(rd.name):'The buyer')+' has rated this order. It is on your profile.</p>'
          : sb.asked
            ? '<p style="margin:0">You asked for a review '+ago(sb.asked)+' ago. One ask per order.</p>'
            : '<p style="margin:0">'+(sb.delivery==='pickup'?esc(rd.name):'The buyer')+' has not rated this order yet.</p>'+
              '<div class="btns" style="margin-top:10px"><button class="btn sm" data-act="askreview:'+sb.no+'">Ask for a review</button></div>'+
              '<p class="small muted" style="margin:8px 0 0">One notice with a link to rate you. You can ask once.</p>')+
        '</div>';
    }
    return h;
  }

  /* Paying the commission is not a button, it is a claim.
     Nobody at Shelfcall can see a bank account move in real time, so what the
     shop does here is TELL us, with a method and a reference, and an operator
     matches it against the statement by hand. Calling the button "I have paid"
     and flipping the account to good on the spot was a lie the product told
     itself: it recorded money we had not seen.
     What a shop keeps while we check is decided in `standing()`. */
  function scrPay(){
    var st = standing(), d = view.draft;
    var due = commissionDue();
    var method = d.p_method || 'transfer';
    var ref = d.p_ref || '';
    return '<button class="back" data-go="s.billing">\u2190 Billing</button>'+
      '<h1>Pay '+money(due)+'</h1>'+
      '<p class="sub">Send it, then tell us here. An operator matches it against the bank \u2014 usually the same working day.</p>'+
      (d.err ? '<div class="err">'+esc(d.err)+'</div>' : '')+
      '<div class="card" style="margin-bottom:16px"><p class="eyebrow">Where it goes</p>'+
        '<p style="margin:0;font-weight:500">Shelfcall LLC \u00b7 AM\u2022\u2022 4821</p>'+
        '<p class="small muted" style="margin:2px 0 0">Reference <b>SC-'+st.billingDay+'-'+esc(db.me.sellerId).toUpperCase()+'</b> \u2014 put this in the transfer and the match is instant.</p></div>'+
      '<p class="eyebrow">How you sent it</p>'+
      '<div class="seg" style="margin-bottom:16px">'+
        '<button data-act="paymethod:transfer" aria-pressed="'+(method==='transfer')+'">Bank transfer</button>'+
        '<button data-act="paymethod:cash" aria-pressed="'+(method==='cash')+'">Cash at the office</button></div>'+
      '<label class="f"><span>'+(method==='transfer'?'Transfer reference or the last 4 digits':'Who took it, and when')+'</span>'+
        '<input class="in" id="p_ref" value="'+esc(ref)+'" placeholder="'+(method==='transfer'?'SC-15-ARAM, or 4821':'Left with Ani, Tuesday morning')+'"></label>'+
      '<button class="btn wide" data-act="sendclaim">Send for checking</button>'+
      '<p class="hint" style="margin-top:10px">'+
        (st.strikes
          ? 'Because a claim of yours was not found last time, this one is checked before your access comes back.'
          : 'Nothing stops while we check. Requests keep reaching you.')+'</p>';
  }

  function commissionDue(){
    var st = standing(), base = 0;
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.seller===db.me.sellerId && sb.status==='completed' && !sb.disputed) base += sb.books;
    })});
    return Math.round(base * st.rate);
  }

  function scrBilling(){
    var st = standing();
    /* The commission base is what finished IN THIS PERIOD. It used to be every
       sale the shop had ever made, which was invisible while there was one
       month of data and plainly wrong the moment there were two: a statement
       for September cannot be 12% of August as well. */
    var periodFrom = st.state === 'trial'
      ? db.account.trialStart
      : (function(){ var d = new Date(now); d.setDate(st.billingDay); d.setHours(0,0,0,0);
                     if (d.getTime() > now) d.setMonth(d.getMonth()-1); return d.getTime(); })();
    var done = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.seller===db.me.sellerId && sb.status==='completed' && !sb.disputed
          && doneAt(sb) >= periodFrom) done.push({o:o, sb:sb});
    })});
    done.reverse();
    var base = 0; done.forEach(function(x){ base += x.sb.books });
    var due = Math.round(base * st.rate);

    var stateCard;
    /* A claim under check is shown FIRST, whatever the underlying state.
       A shop on its second claim is still restricted, and it has to see
       both facts: the claim is with us, and access waits this time. */
    if (st.checking){
      var cl = st.claim;
      stateCard = '<div class="card"><div class="between"><div class="grow stack">'+
        '<p style="margin:0;font-weight:600">'+money(cl.amount)+' sent for checking</p>'+

        '</div><span class="chip">checking</span></div>'+
        '<p class="small" style="margin:10px 0 0;color:var(--foreground)">'+
          (st.strikes
            ? '<b>Your access stays restricted until this one is confirmed.</b> A claim of yours was not found last time, so this one is checked before it counts.'
