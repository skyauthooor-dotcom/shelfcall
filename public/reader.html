        '<p class="small muted" style="margin:0">Your month \u00b7 '+esc(st.period)+' \u00b7 billed on the '+st.billingDay+'th</p>'+
        '<p class="small muted" style="margin:0">Transfer to AM\u2022\u2022 4821 \u00b7 reference SC-'+st.billingDay+'</p>'+
        '</div><span class="chip">due</span></div>'+
        '<div class="btns" style="margin-top:10px"><button class="btn sm" data-go="s.pay">Pay '+money(due)+'</button>'+
        '<button class="btn ghost sm" data-act="nop">Print</button></div>'+
        '<p class="small muted" style="margin:10px 0 0">Unpaid tonight and new requests stop reaching you. Your open offers and running orders keep working, and telling us you have paid lifts it while we check.</p></div>';
    } else if (st.state === 'restricted'){
      stateCard = '<div class="card" style="border-color:var(--destructive)"><div class="between"><div class="grow stack">'+
        '<p class="bad-t" style="margin:0;font-weight:600">'+money(due)+' overdue</p>'+
        '<p class="small muted" style="margin:0">Your month \u00b7 '+esc(st.period)+'</p>'+
        '</div><span class="chip bad">restricted</span></div>'+
        '<p class="small bad-t" style="margin:10px 0 0">New requests are not reaching you. You still see the ones nobody answered in 72 hours, and everything already in flight is untouched.</p>'+
        '<div class="btns" style="margin-top:10px"><button class="btn sm" data-go="s.pay">Pay '+money(due)+'</button></div></div>';
    } else {
      stateCard = '<div class="card"><div class="between"><div class="grow stack">'+
        '<p style="margin:0;font-weight:600">Nothing due</p>'+
        '<p class="small muted" style="margin:0">Next statement on the '+st.billingDay+'th \u00b7 '+dstr(st.nextAt)+'</p>'+
        '</div><span class="chip">good standing</span></div></div>';
    }

    var hand = settleOpenForShop(db.me.sellerId);
    var handBlock = hand
      ? '<div class="note hard" style="margin-bottom:18px">'+
          '<p style="margin:0;font-weight:600">'+esc(db.couriers[hand.courier].name)+' is handing you '+money(hand.amount)+'</p>'+
          '<p class="small" style="margin:6px 0 0;color:var(--foreground)">For '+hand.subs.length+
            ' order'+(hand.subs.length>1?'s':'')+' \u00b7 '+hand.subs.map(esc).join(' \u00b7 ')+'. '+
            'Count it first. Typing the code is you saying you have it.</p>'+
          (view.cashErr
            ? '<p class="small bad-t" style="margin:6px 0 0">'+esc(view.cashErr)+'</p>' : '')+
          '<div class="wrap-row" style="margin-top:10px">'+
            '<input class="in'+(view.cashErr?' bad':'')+'" id="cash_code" inputmode="numeric" maxlength="4" placeholder="0000" '+
              'style="width:96px;text-align:center;letter-spacing:.2em">'+
            '<button class="btn sm" data-act="cashok:'+hand.id+'">Got it \u00b7 '+money(hand.amount)+'</button>'+
          '</div>'+
          '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">'+
            '<p class="small muted" style="margin:0 0 8px">Counted something else? Put in what you actually took \u2014 '+
              'the two numbers go to us with both your names on them.</p>'+
            '<div class="wrap-row">'+
              '<input class="in" id="cash_got" inputmode="numeric" placeholder="'+hand.amount+'" style="width:110px">'+
              '<button class="btn ghost sm" data-act="cashodd:'+hand.id+'">That is not the amount</button>'+
            '</div></div>'+
        '</div>'
      : '';
    /* ---- the page, top to bottom ---------------------------------------------
       It used to be one long column: the statement, this period, what is
       owed, then the months, and opening a month or a day unfolded INSIDE
       that column, so the page grew every time it was used. Now it is:
         what needs acting on (a courier at the counter, a statement due)
         a chart of what came in, day by day
         two views, Earned and To collect — the money that is in, and the
         money that is still coming
       and the history opens on its own screen, with a way back. */
    var sold = soldSubs();
    var owedRows = sold.filter(function(x){ return shopCash(x.sb) !== 'paid' });
    var owedNow = sum(owedRows, function(x){ return x.sb.books });
    var openSubs = pendingSubs().sort(function(a, b){ return (a.sb.placedAt||0) - (b.sb.placedAt||0) });
    var openSum = sum(openSubs, function(x){ return x.sb.books });
    var odd = db.settles.filter(function(x){ return x.seller === db.me.sellerId && x.state === 'mismatch' });
    var urgent = st.checking || st.state === 'due' || st.state === 'restricted';
    var bt = P('bt', 'earned');

    var h = '<h1>Billing</h1>'+handBlock+
      (st.reject
        ? '<div class="note bad" style="margin-bottom:16px"><b>We could not find that payment.</b> '+esc(st.reject.why)+
          ' Checked '+ago(st.reject.at)+' ago. If you have the receipt, send it again with the exact reference.'+
          '<div class="btns" style="margin-top:10px"><button class="btn sm" data-go="s.pay">Send it again</button>'+
          '<button class="btn ghost sm" data-act="dropreject">Hide this</button></div></div>'
        : '')+
      (urgent ? '<div style="margin-bottom:16px">'+stateCard+'</div>' : '')
    /* a handover that does not add up is news: it stands at the top whatever the tab */
    if (odd.length){
        h += '<div class="note bad" style="margin-bottom:16px"><b>A handover does not add up.</b> '+
          odd.map(function(x){
            return esc(db.couriers[x.courier].name)+' counted out '+money(x.amount)+', you counted '+money(x.got)+' — '+ago(x.doneAt)+' ago.';
          }).join(' ')+' Neither number is recorded as paid until somebody here has looked at it. You will be called today.</div>';
    }

    /* the two views first: they decide what the rest of the page is about */
    h += aseg('bt', [['earned', 'Earned'], ['collect', 'To collect', (owedNow + openSum) ? money(owedNow + openSum) : undefined]], bt);

    if (bt === 'collect'){
      if (!owedRows.length && !openSubs.length)
        h += emptyBox('Nothing to collect', 'Money still coming to you shows here: delivered books the courier has not paid for yet, and open orders.');
      if (owedRows.length){
        h += '<h2 style="margin:4px 0 2px">'+money(owedNow)+' still owed to you</h2>'+
          '<p class="small muted" style="margin:0 0 10px">Delivered; the courier still has the cash. Anything older than a day, tell us.</p>'+
          '<div class="rowlist">'+owedRows.map(function(x){
            return '<button class="row" data-go="s.order" data-p="'+esc(x.sb.no)+'" style="align-items:center">'+
              '<div class="grow stack" style="gap:2px"><p style="margin:0;font-weight:500">#'+esc(x.sb.no)+' · '+esc(dayName2(dayKey(doneAt(x.sb))))+'</p>'+
              '<p class="small muted" style="margin:0">'+x.sb.items.map(function(id){ return esc(offer(id).title) }).join(' · ')+'</p></div>'+
              '<div class="stack" style="text-align:right;gap:3px"><span class="price">'+money(x.sb.books)+'</span>'+cashChip(x.sb)+'</div></button>';
          }).join('')+'</div>';
      }
      if (openSubs.length){
        var opg = paged(openSubs, 'n');
        h += '<div class="between" style="margin:24px 0 8px"><h2 class="grow" style="margin:0">Open orders</h2><span class="price">'+money(openSum)+'</span></div>'+
          '<p class="small muted" style="margin:0 0 10px">Yours once the book is handed over.</p>'+
          '<div class="rowlist">'+opg.rows.map(function(x){
            var sb = x.sb;
            var w = sb.status==='placed' || sb.status==='confirmed' ? 'to find and mark ready'
              : sb.status==='ready' ? 'courier coming'
              : sb.delivery==='pickup' ? 'waiting for the buyer' : 'with the courier';
            return '<button class="row" data-go="s.order" data-p="'+esc(sb.no)+'" style="align-items:center">'+
              '<div class="grow stack" style="gap:2px"><p style="margin:0;font-weight:500">#'+esc(sb.no)+'</p>'+
              '<p class="small muted" style="margin:0">'+sb.items.map(function(id){ return esc(offer(id).title) }).join(' · ')+'</p></div>'+
              '<div class="stack" style="text-align:right;gap:3px"><span class="price">'+money(sb.books)+'</span><span class="chip dim">'+w+'</span></div></button>';
          }).join('')+'</div>'+moreBtn(opg);
      }
    } else {
      h += earnCard(sold, 0);
      if (!urgent) h += stateCard;
      h += '<div class="card" style="margin-top:10px"><p class="eyebrow">This period so far · since '+esc(dstr(periodFrom))+'</p>'+
          '<div class="between"><span class="grow muted small">Sold through Shelfcall</span><span class="price">'+money(base)+'</span></div>'+
          '<div class="between" style="margin-top:6px"><span class="grow muted small">Commission at 12%</span><span class="price">'+money(due)+'</span></div>'+
          (st.state === 'trial' ? '<p class="small muted" style="margin:10px 0 0">Not charged — free month.</p>' : '')+'</div>';
      h += '<h2 style="margin-bottom:2px">History</h2><p class="small muted" style="margin:0 0 10px">Book money only. Commission is on your statement.</p>';
      if (!sold.length) h += emptyBox('Nothing sold yet', 'What you take for books shows up here, month by month.');
      else {
        var months = groupBy(sold, function(x){ return monKey(doneAt(x.sb)) });
        h += '<div class="rowlist">'+months.map(function(g){
          return '<button class="row" data-act="earn:'+g.key+'" style="align-items:center">'+
            '<div class="grow stack" style="gap:2px"><p style="margin:0;font-weight:600">'+esc(monName(g.key))+'</p>'+
            '<p class="small muted" style="margin:0">'+g.rows.length+' order'+(g.rows.length>1?'s':'')+
              (g.waiting ? ' · '+money(g.waiting)+' still owed' : ' · all paid')+'</p></div>'+
            '<span class="price">'+money(g.books)+'</span><span class="muted" aria-hidden="true">›</span></button>';
        }).join('')+'</div>';
      }
    }

    h += '<details class="howto" style="margin-top:22px"><summary>How billing works</summary>'+
      '<p class="small" style="margin:8px 0 0;color:var(--muted-foreground)">Your own month, billed on the '+st.billingDay+'th — 12% of what you actually sold here, books only, delivery never counted. '+
      'You are reminded the day before with the amount, and the statement is issued and due on the day itself. '+
      'Unpaid that night and new requests stop reaching you. You pay, then tell us here with a reference — that lifts it straight away while an operator matches it against the bank.</p></details>';

    h += '<div class="demo"><p>Prototype — see this as</p><div class="seg">'+
      ['trial','good','due','restricted'].map(function(k){
        return '<button data-act="setstate:'+k+'" aria-pressed="'+(st.raw===k && !st.claim)+'">'+
          (k==='good'?'nothing due':k)+'</button>';
      }).join('')+'</div>'+
      (st.claim ? '<p style="margin-top:12px">Waiting on us — an operator matches it against the bank</p>' : '')+
      '</div>';
    return h;
  }

  /* ---- what came in, day by day ----------------------------------------------
     The same drawing as the admin's week chart: one ink, columns from a zero
     baseline, the newest day labelled, and a tap gives that day's numbers. */
  function dayRows(sold, from, to){
    var rows = [], idx = {};
    var d = new Date(from); d.setHours(0,0,0,0);
    for (var t = d.getTime(); t <= to; t += DAY){
      var k = dayKey(t); idx[k] = rows.length;
      rows.push({ key: k, at: t, books: 0, orders: 0 });
    }
    sold.forEach(function(x){
      var k = dayKey(doneAt(x.sb)); if (idx[k] === undefined) return;
      var r = rows[idx[k]]; r.books += x.sb.books; r.orders++;
    });
    return rows;
  }
  function dayTip(r){ return dayName2(r.key)+' · '+(r.orders ? r.orders+' order'+(r.orders===1?'':'s')+' · '+money(r.books) : 'nothing sold') }
  function dayChart(rows, id){
    var app = document.getElementById('app');
    var W = Math.round(Math.max(300, Math.min(900, (app && app.clientWidth ? app.clientWidth : 380) - 40)));
    var H = 150, L = 34, Rt = 18, B = 22, T = 20;   /* room on the right for the newest day's label */
    var mx = Math.max.apply(null, rows.map(function(r){ return r.books }).concat([0]));
    var nt = niceTop(Math.max(mx, 1000));
    var ph = H - B - T, n = rows.length, slot = (W - L - Rt) / n;
    var bw = Math.min(18, Math.max(3, slot * 0.66));
    var g = '<g class="grid">';
    for (var t = 0; t <= nt.top + 1e-9; t += nt.step){
      var y = T + ph - t / nt.top * ph;
      g += '<line x1="'+L+'" x2="'+(W - Rt)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L - 6)+'" y="'+(y + 3.5)+'" text-anchor="end">'+compact(t)+'</text>';
    }
    g += '</g>';
    var k = Math.max(1, Math.ceil(n / 5)), bars = '', last = n - 1;
    for (var i = n - 1; i >= 0; i--) if (rows[i].books){ last = i; break; }
    rows.forEach(function(r, i){
      var v = r.books, x = L + i * slot + (slot - bw) / 2, hh = v / nt.top * ph, y = T + ph - hh, rr = Math.min(3, hh, bw / 2);
      var d = hh <= 0 ? '' : 'M'+x+','+(T + ph)+' L'+x+','+(y + rr)+' Q'+x+','+y+' '+(x + rr)+','+y+
        ' L'+(x + bw - rr)+','+y+' Q'+(x + bw)+','+y+' '+(x + bw)+','+(y + rr)+' L'+(x + bw)+','+(T + ph)+' Z';
      bars += '<g class="bar'+(i === last ? ' on' : '')+'" data-tip="'+esc(dayTip(r))+'">'+
        '<rect class="hit" x="'+(L + i * slot)+'" y="'+T+'" width="'+slot+'" height="'+ph+'"/>'+
        (d ? '<path class="b" d="'+d+'"/>' : '')+
        (i === last && v ? '<text class="val" x="'+(x + bw / 2)+'" y="'+(y - 5)+'" text-anchor="middle">'+compact(v)+'</text>' : '')+
        ((n - 1 - i) % k === 0 ? '<text x="'+(x + bw / 2)+'" y="'+(H - 6)+'" text-anchor="middle">'+dstr(r.at)+'</text>' : '')+'</g>';
    });
    return '<div class="chart" data-readout="rd_'+id+'"><p class="readout" id="rd_'+id+'">'+esc(dayTip(rows[last]))+'</p>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc('Money for books per day, '+n+' days')+'">'+g+bars+'</svg></div>';
  }
  function earnCard(sold, owedNow){
    var nd = +P('bd', 30), rows = dayRows(sold, now - (nd - 1) * DAY, now);
    var tot = sum(rows, function(r){ return r.books }), ord = sum(rows, function(r){ return r.orders });
    return '<div class="card" style="margin-bottom:14px">'+
      '<div class="between" style="align-items:flex-start;flex-wrap:wrap;gap:8px">'+
        '<div class="grow stack" style="gap:2px"><p class="eyebrow" style="margin:0">Earned, last '+nd+' days</p>'+
          '<p style="margin:0;font-size:24px;line-height:30px;font-weight:600;font-variant-numeric:tabular-nums">'+money(tot)+'</p>'+
          '<p class="small muted" style="margin:0">'+ord+' order'+(ord===1?'':'s')+' handed over</p></div>'+
        achips('bd', [['14', '14 days'], ['30', '30 days']], String(nd))+'</div>'+
      dayChart(rows, 'earn')+
      '<p class="hint" style="margin:2px 0 0">Tap a day for its numbers.</p>'+
      (owedNow ? '<p class="small" style="margin:10px 0 0;padding-top:10px;border-top:1px solid var(--border);color:var(--foreground)">'+
        '<b>'+money(owedNow)+' still owed to you</b> — delivered, the courier still has the cash. See To collect.</p>' : '')+
      '</div>';
  }

  /* ---- the history, on its own screen -----------------------------------------
     A month, then a day, each a page of its own with one way back, so the
     Billing screen never grows when someone reads the past. */
  function scrEarn(){
    var st = standing(), sold = soldSubs(), mon = view.p.mon, day = view.p.day;
    if (!mon) return scrBilling();
    var months = groupBy(sold, function(x){ return monKey(doneAt(x.sb)) });
    var mg = months.filter(function(g){ return g.key === mon })[0] || { rows:[], books:0, paid:0, waiting:0 };
    var days = groupBy(mg.rows, function(x){ return dayKey(doneAt(x.sb)) });
    if (!day){
      var a = mon.split('-'), first = new Date(+a[0], +a[1] - 1, 1).getTime(), lastD = Math.min(now, new Date(+a[0], +a[1], 0).getTime());
      return '<button class="back" data-go="s.billing">← Billing</button>'+
        '<h1>'+esc(monName(mon))+'</h1>'+
        '<p class="sub">'+mg.rows.length+' order'+(mg.rows.length>1?'s':'')+' · '+money(mg.books)+' for books · '+money(mg.paid)+' in your till'+
          (mg.waiting ? ' · '+money(mg.waiting)+' still owed' : '')+'</p>'+
        '<div class="card" style="margin-bottom:16px">'+dayChart(dayRows(mg.rows, first, lastD), 'mon')+'</div>'+
        '<div class="rowlist">'+days.map(function(g){
          return '<button class="row" data-act="earn:'+mon+':'+g.key+'" style="align-items:center">'+
            '<div class="grow stack" style="gap:2px"><p style="margin:0;font-weight:600">'+esc(dayName2(g.key))+'</p>'+
            '<p class="small muted" style="margin:0">'+g.rows.length+' order'+(g.rows.length>1?'s':'')+
              (g.waiting ? ' · '+money(g.waiting)+' still owed' : ' · all paid')+'</p></div>'+
            '<span class="price">'+money(g.books)+'</span><span class="muted" aria-hidden="true">›</span></button>';
        }).join('')+'</div>';
    }
    var dg = days.filter(function(g){ return g.key === day })[0] || { rows:[], books:0, paid:0, waiting:0 };
    return '<button class="back" data-act="earn:'+mon+'">← '+esc(monName(mon))+'</button>'+
      '<h1>'+esc(dayName2(day))+'</h1>'+
      '<p class="sub">'+money(dg.books)+' for books · '+money(dg.paid)+' in your till'+(dg.waiting ? ' · '+money(dg.waiting)+' still owed' : '')+'</p>'+
      '<div class="stack-list">'+dg.rows.map(function(x){
        var sb = x.sb, l = loc(sb.seller, sb.loc);
        return '<div class="card">'+
          '<div class="between"><div class="grow stack">'+
            '<p style="margin:0;font-weight:600">#'+esc(sb.no)+'</p>'+
            '<p class="small muted" style="margin:0">'+esc(l.label)+' · '+(sb.delivery==='courier' ? 'courier' : 'collected in the shop')+'</p>'+
          '</div>'+cashChip(sb)+'</div>'+
          '<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">'+
          sb.items.map(function(id){ var b = offer(id);
            return '<div class="row" style="padding:6px 0;border:none">'+cover(b,'s')+
              '<div class="grow stack" style="gap:2px"><p style="margin:0">'+esc(b.title)+'</p>'+
              '<p class="small muted" style="margin:0">'+esc(b.author||'')+' · '+esc(b.cond)+'</p></div>'+
              '<span class="price">'+money(b.price)+'</span></div>';
          }).join('')+
          '<div class="between" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">'+
            '<span class="grow small muted">'+(shopCash(sb)==='paid' ? 'In your till' : 'Still owed to you')+'</span>'+
            '<span class="price">'+money(sb.books)+'</span></div>'+
          '<p class="small muted" style="margin:6px 0 0">Commission on this one: '+money(Math.round(sb.books*st.rate))+'</p>'+
          '</div>'+
          '<div class="btns" style="margin-top:10px">'+
            '<button class="btn ghost sm" data-go="s.order" data-p="'+esc(sb.no)+'">Open the order</button>'+
            '<button class="btn ghost sm" data-act="flagline:'+sb.no+'">Something is wrong</button>'+
          '</div></div>';
      }).join('')+'</div>';
  }

  /* ---- the shop's own results ------------------------------------------------
     The same four steps the admin reads, about this shop only, against the
     average of all shops. No other shop is named: an average says "you can do
     better" without turning a neighbour into a scoreboard. */
  function scrSellerStats(){
    var wk = String(+P('wk', 4)), F = funnels(effFrom());
    var me = db.me.sellerId, f = F.by[me] || emptyFunnel(), s = seller(me), rt = rating(s);
    var h = '<h1>'+esc(tr('Results'))+'</h1><p class="sub">How your shop answers the requests that reach it.</p>'+
      achips('wk', [['4', '4 weeks'], ['12', '12 weeks'], ['0', 'All time']], wk);
    if (!f.reached) return h + emptyBox('Nothing has reached you yet', 'Once requests start reaching your feed, this shows how many you open, answer and sell.',
      '<button class="btn" data-go="s.feed">'+esc(tr('Feed'))+'</button>');
    var waiting = db.requests.filter(function(r){
      return r.status === 'open' && reqLive(r) && !(r.seenBy && r.seenBy[me]) && (s.missed || []).indexOf(r.id) < 0 && !answered(r.id);
    }).length;
    h += funnelSay(f, true) + funnelBars(f, F.all, true) + funnelTip(f, F.all);
    h += '<div class="btns">'+
      (waiting ? '<button class="btn" data-go="s.feed">'+waiting+' request'+(waiting === 1 ? '' : 's')+' waiting in your feed</button>' : '')+
      '<button class="btn ghost" data-go="s.reviews">'+esc(tr('Reviews'))+(rt ? ' · '+rt.toFixed(1)+' ★ ('+s.reviews.length+')' : '')+'</button></div>';
    return h;
  }

  function scrSellerReviews(){
    var sl = seller(db.me.sellerId), rt = rating(sl);
    var counts = [0,0,0,0,0];
    sl.reviews.forEach(function(v){ counts[v.stars-1]++ });
    var h = '<h1>What buyers said</h1>'+
      '<p class="sub">Only completed orders can be reviewed, so every line here is a real handover. You cannot delete them \u2014 and neither can we.</p>';
    if (!sl.reviews.length){
      return h + emptyBox('No reviews yet',
        'The first one arrives after your first finished order.');
    }
    h += '<div class="card"><div class="between"><div class="grow stack">'+
      '<p style="margin:0"><span class="stars">'+stars(rt)+'</span> <b>'+rt.toFixed(1)+'</b> out of 5</p>'+
      '<p class="small muted" style="margin:0">'+sl.reviews.length+' review'+(sl.reviews.length>1?'s':'')+' \u00b7 '+soldSubs(sl.id).length+' completed orders</p>'+
      '</div></div>'+
      '<div style="margin-top:12px">'+[5,4,3,2,1].map(function(n){
        var c = counts[n-1], pct = Math.round(100*c/sl.reviews.length);
        return '<div class="between small" style="gap:8px;margin-bottom:4px">'+

          '<span class="grow" style="height:6px;background:var(--accent);border-radius:3px;overflow:hidden">'+
            '<span style="display:block;height:100%;width:'+pct+'%;background:var(--muted-foreground)"></span></span>'+
          '<span style="width:22px;text-align:right;color:var(--muted-foreground)">'+c+'</span></div>';
      }).join('')+'</div></div>';
    h += '<div class="stack-list" style="margin-top:14px">'+sl.reviews.map(function(v){
      return '<div class="card"><div class="wrap-row" style="margin-bottom:6px">'+
        '<span class="stars">'+stars(v.stars)+'</span>'+
        '<span class="small muted">'+esc(v.by)+' \u00b7 '+esc(v.when)+'</span></div>'+
        (v.text ? '<p style="margin:0;color:var(--muted-foreground)">'+esc(v.text)+'</p>' : '<p class="small muted" style="margin:0">No comment left.</p>')+
      '</div>';
    }).join('')+'</div>';

    return h;
  }

  function reasonBlock(title, actStr, reasons, note){
    return '<button class="btn link" style="margin-top:14px" data-ask="'+actStr+
      '" data-ask-title="'+esc(title)+'" data-ask-reasons="'+esc(reasons.join('|'))+
      '" data-ask-body="'+esc(note||'')+'">'+esc(title)+'</button>';
  }
  function reasonBlockOld(title, actStr, reasons, note){
    if (view.why && view.whyFor === actStr){
      return '<div class="note bad" style="margin-top:12px"><b>'+title+'</b><br>'+
        'Reason: <b>'+esc(view.why)+'</b>. The reader is told, their request reopens, and the other offers on it come back.'+
        '<div class="btns" style="margin-top:10px">'+
          '<button class="btn sm danger solid" data-act="'+actStr+'">Yes, do it</button>'+
          '<button class="btn ghost sm" data-act="whycancel">Keep it</button>'+
        '</div></div>';
    }
    if (view.whyOpen === actStr){
      return '<div class="note" style="margin-top:12px"><b>'+title+'</b><br>'+(note||'')+
        '<div class="btns" style="margin-top:10px">'+
          reasons.map(function(r){
            return '<button class="btn ghost sm" data-act="why:'+encodeURIComponent(r).replace(/:/g,'%3A')+':'+encodeURIComponent(actStr).replace(/:/g,'%3A')+'">'+esc(r)+'</button>';
          }).join('')+
          '<button class="btn ghost sm" data-act="whycancel">Never mind</button>'+
        '</div></div>';
    }
    return '<button class="btn ghost sm" style="margin-top:8px" data-act="whyopen:'+encodeURIComponent(actStr).replace(/:/g,'%3A')+'">'+title+'</button>';
  }

  /* every cancel path unwinds through here, so reversal is always exact */
  function unwind(ord, sb, reason){
    sb.status = 'cancelled';
    sb.cancelReason = reason;
    sb.cancelledAt = Date.now();
    sb.items.forEach(function(id){
      var o = offer(id);
      o.status = 'sent'; o.closedBy = null; o.closedReason = null;
      var r = req(o.req);
      if (r.status === 'fulfilled'){
        r.status = 'open';
        offersFor(r.id).forEach(function(x){
          /* only the offers THIS order released come back */
          if (x.status === 'done_not_chosen' && x.closedBy === ord.id){
            x.status = 'sent'; x.closedBy = null; x.closedReason = null;
          }
        });
      }
    });
    /* if the shop was already paid at pickup, the office owes the courier.
       Claimed, not received: it is a debt until an operator hands the cash over. */
    if (sb.delivery === 'courier' && shopPaidFor(sb.no))
      ledgerAdd(sb.books, 'office', 'courier', sb.no, 'refund, delivery failed', true);
  }

  /* money moves as entries, never as a boolean.
     pending = owed but not yet in anyone's hands */
  function ledgerAdd(amount, from, to, subNo, note, pending){
    db.ledger.push({ at: Date.now(), amount: amount, from: from, to: to,
                     sub: subNo, note: note || '', pending: !!pending });
  }
  function ledgerSum(from, to, includePending){
    var t = 0;
    db.ledger.forEach(function(e){
      if (e.from===from && e.to===to && (includePending || !e.pending)) t += e.amount;
    });
    return t;
  }
  /* ---- what the shop has actually been paid --------------------------------
     "Completed" and "paid" are two different facts and the shop was only ever
     shown the first. On a pickup the buyer counts the notes onto the counter,
     so handover IS payment. On a courier delivery the money travels: buyer to
     courier, courier to shop, and either leg can be hours or days behind the
     delivery. A shop that has handed over four books and been paid for two
     needs to see two numbers, not one.
       paid     the cash is in the shop's till
       claimed  the courier says it was handed over, the shop has not agreed
       waiting  nobody has paid the shop yet
     Derived from the ledger, never from a flag, so it cannot drift. */
  function shopCash(sb){
    if (!sb || sb.status !== 'completed') return 'none';
    if (sb.delivery === 'pickup') return 'paid';          /* counted on the counter */
    if (shopPaidFor(sb.no)) return 'paid';                /* both signed, ledger written */
    var st = settleOf(sb.no);
    if (st && st.state === 'open') return 'counting';     /* happening right now */
    if (st && st.state === 'mismatch') return 'disputed';
    return 'waiting';
  }
  var CASH_WORD = { paid:'paid', counting:'handing over now',
                    disputed:'amounts disagree', waiting:'waiting for cash' };
  function doneAt(sb){ return sb.doneAt || sb.placedAt || now; }
  function pad2(x){ return (x<10?'0':'')+x }
  function monKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1) }
  function dayKey(ts){ var d=new Date(ts); return monKey(ts)+'-'+pad2(d.getDate()) }
  var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function monName(k){ var a=k.split('-'); return MON[parseInt(a[1],10)-1]+' '+a[0] }
  function dayName2(k){
    var a = k.split('-'), d = new Date(+a[0], +a[1]-1, +a[2]);
    return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+
      ' '+(+a[2])+' '+MON[+a[1]-1].slice(0,3);
  }
  /* every finished sale of a shop, newest first. The seller's own screens ask
     about themselves and pass nothing; admin asks about somebody else. */
  function soldSubs(who){
    var id = who || db.me.sellerId, out = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.seller===id && sb.status==='completed') out.push({o:o, sb:sb});
    })});
    return out.sort(function(a,b){ return doneAt(b.sb) - doneAt(a.sb) });
  }
  /* what a shop has taken, and how much of it has actually reached its till */
  function shopEarnings(id){
    var rows = soldSubs(id), books = 0, paid = 0, owed = 0;
    rows.forEach(function(x){
      books += x.sb.books;
      if (shopCash(x.sb) === 'paid') paid += x.sb.books; else owed += x.sb.books;
    });
    return { rows:rows, books:books, paid:paid, owed:owed,
             commission: Math.round(books * 0.12) };
  }
  function invoicesFor(id){
    return db.invoices.filter(function(x){ return x.seller === id })
      .sort(function(a, b){ return b.issuedAt - a.issuedAt });
  }
  function groupBy(list, keyFn){
    var map = {}, order = [];
    list.forEach(function(x){
      var k = keyFn(x);
      if (!map[k]){ map[k] = { key:k, rows:[], books:0, paid:0, waiting:0 }; order.push(map[k]); }
      var g = map[k];
      g.rows.push(x); g.books += x.sb.books;
      if (shopCash(x.sb) === 'paid') g.paid += x.sb.books; else g.waiting += x.sb.books;
    });
    return order;
  }
  function cashChip(sb){
    var st = shopCash(sb);
    return '<span class="chip'+(st==='paid'?'':(st==='waiting'||st==='disputed'?' bad':''))+'">'+CASH_WORD[st]+'</span>';
  }

  /* ---- the handover ------------------------------------------------------
     A courier settling up with a shop is the one moment in this product where
     cash changes hands between two people who both work here, with nothing
     but their word for it. So it is not a tap. It is a code, the same shape
     as the pickup code a reader reads out: the courier starts the handover
     and the app gives them four digits; the shop types them in. Both are
     standing at the counter, the money is on it, and the record is made by
     the two of them at once.

     Nothing reaches the ledger until the code is entered. Before that the
     cash is still the courier's as far as the app is concerned, which is the
     truth — a courier who pressed a button on the way out of the shop has
     not paid anybody. */
  function settleOpen(sellerId){
    return db.settles.filter(function(x){
      return x.state === 'open' && x.seller === sellerId && x.courier === db.me.courierId;
    })[0] || null;
  }
  function settleOpenForShop(sellerId){
    return db.settles.filter(function(x){ return x.state === 'open' && x.seller === sellerId })[0] || null;
  }
  function settleOf(subNo){
    return db.settles.filter(function(x){ return x.subs.indexOf(subNo) >= 0 })
      .sort(function(a, b){ return b.at - a.at })[0] || null;
  }
  function fourDigits(){ return String(Math.floor(1000 + Math.random() * 9000)) }

  function shopPaidFor(subNo){
    return db.ledger.some(function(e){ return e.sub===subNo && e.from==='courier' && e.to==='shop' });
  }

  /* ============================== courier ============================== */
  function courierJobs(){
    var out = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.delivery==='courier' && ['ready','shipped'].indexOf(sb.status)>=0) out.push({o:o, sb:sb});
    })});
    return out;
  }
  function courierDone(){
    var out = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.delivery==='courier' && sb.status==='completed' && sb.by==='courier') out.push({o:o, sb:sb});
    })});
    return out.reverse();
  }
  function courierLedger(){
    var taken = ledgerSum('buyer','courier');
    var paid  = ledgerSum('courier','shop');
    var handedIn = ledgerSum('courier','office');
    var backFromOffice = ledgerSum('office','courier');
    var dueFromOffice = ledgerSum('office','courier', true) - backFromOffice;
    var owed = 0, fees = 0;
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.delivery !== 'courier') return;
      if (sb.status === 'completed' && sb.by === 'courier'){
        if (!shopPaidFor(sb.no)) owed += sb.books;
      }
    })});
    db.orders.forEach(function(o){
      var mine = o.subs.filter(function(sb){ return sb.delivery==='courier' && sb.status==='completed' && sb.by==='courier' });
      if (mine.length) fees += (o.fee || 0);   /* one trip, one fee */
    });
    return { taken:taken, paid:paid, handedIn:handedIn, due:dueFromOffice,
             inHand: taken - paid - handedIn + backFromOffice,
             owed:owed, fees: fees - handedIn };
  }

  function jobCard(o, sb, full){
    var sl = seller(sb.seller), l = loc(sb.seller, sb.loc);
    var toCollect = sb.status==='ready';
    var onPickup = sb.payMode === 'onpickup';
    /* on its own page the heading above already carries the number and the
       state, so the card starts straight at the shop */
    var h = '<div class="card">'+
      (full ? '' : '<div class="between"><div class="grow stack">'+
              '<button class="opens" style="padding:0" data-go="c.job" data-p="'+sb.no+'">'+
                  '<p class="book-t" style="font-size:15px;line-height:20px">#'+sb.no+'</p></button>'+
      '</div></div>')+
      /* in the list the tab already names the state, so the card drops the
         chip, the eyebrows and the book's small print: shop, books, money */
      '<div style="margin:'+(full?'0':'4px')+' 0 0">'+
        (full ? '<p class="eyebrow" style="margin-bottom:4px">'+(toCollect?'Pick up from':'Picked up from')+'</p>' : '')+
        '<p style="margin:0">'+esc(sl.name)+' \u2014 '+esc(l.label)+'</p>'+
        '<p class="small muted" style="margin:2px 0 0">'+esc(l.addr)+' \u00b7 '+esc(l.hours)+'</p>'+
      '</div>'+
      /* in the grouped list the buyer is printed once, above all the shops */
      (full
        ? '<div style="margin:12px 0 0">'+
            '<p class="eyebrow" style="margin-bottom:4px">Deliver to</p>'+
            '<p style="margin:0">'+esc(o.name||db.readers[o.reader].name)+'</p>'+
            '<p class="small muted" style="margin:2px 0 0">'+esc(o.addr||'')+', Yerevan \u00b7 '+esc(o.phone||'')+'</p>'+
            (o.note ? '<p class="said" style="margin-top:8px;-webkit-line-clamp:none">\u201C'+esc(o.note)+'\u201D</p>' : '')+
          '</div>'
        : '');
    h += full ? '<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px">'+
      '<p class="eyebrow" style="margin-bottom:6px">'+(toCollect?'What you are picking up':'What you are carrying')+'</p>'
      : '<div style="margin-top:6px">';
    sb.items.forEach(function(id){ var ofr = offer(id);
      if (!full){
        h += '<p class="small" style="margin:2px 0 0"><b>'+esc(ofr.title)+'</b> <span class="muted">\u00b7 <span>'+esc(ofr.cond)+'</span></span>'+
          (sb.items.length > 1 ? ' <span class="muted">\u00b7 '+money(ofr.price)+'</span>' : '')+'</p>';
        return;
      }
      h += '<div class="row" style="padding:6px 0;border:none">'+cover(ofr, 'm')+
        '<div class="grow stack"><p style="margin:0;font-weight:500">'+esc(ofr.title)+'</p>'+
        '<p class="small muted" style="margin:0">'+esc(ofr.author||'no author given')+(ofr.year?' \u00b7 '+ofr.year:'')+'</p>'+
        '<p class="small muted" style="margin:0">'+esc(ofr.cond)+
          (ofr.binding?' \u00b7 '+esc(ofr.binding):'')+(ofr.pub?' \u00b7 '+esc(ofr.pub):'')+'</p>'+
        (full && ofr.note ? '<p class="small muted" style="margin:2px 0 0">\u201C'+esc(ofr.note.slice(0,70))+'\u201D</p>' : '')+
        '</div>'+(sb.items.length > 1 ? '<span class="price">'+money(ofr.price)+'</span>' : '')+'</div>';
    });
    h += '</div>';
    h += '<div class="note" style="margin-top:'+(full?'12px':'10px')+'">'+
      (toCollect
        ? (onPickup
            ? '<b>Pay the shop '+money(sb.books)+' when you take the book.</b> You get it back from the buyer on delivery.'
            : '<b>Take the book, pay nothing.</b> You settle '+money(sb.books)+' with the shop after you have the buyer\u2019s cash.')
        : (sb.paidShop
            ? 'Already paid to the shop.'
            : 'You owe the shop '+money(sb.books)+' after delivery.'))+
      '</div>';

    h += '<div class="btns" style="margin-top:'+(full?'14px':'10px')+';flex-direction:row;flex-wrap:wrap;gap:8px">'+
      (toCollect
        ? '<button class="btn sm" data-act="ccollect:'+o.id+':'+sb.no+'">'+(onPickup ? 'Collected \u00b7 paid '+money(sb.books) : 'Collected from the shop')+'</button>'
        : '')+
      /* the other way to pay sits beside Collected, not on a row of its own */
      (toCollect ? '<button class="btn ghost sm" data-act="cmode:'+o.id+':'+sb.no+'">'+
        (onPickup ? 'Pay later' : 'Pay now')+'</button>' : '')+
      /* "Open" was here as well as on the card itself, so every stop carried
         two ways to the same page and the one that mattered — Collected —
         had to share the row with it. The card opens; a button to open a
         thing you are already looking at is noise. */
      ''+
      '</div>'+
      '</div>';
    return h;
  }

  function scrCourierJobs(){
    var jobs = courierJobs();
    var L = courierLedger();
    var h = '<h1>Deliveries</h1>';
    /* the two sums the courier acts on, not a balance they have to work out */
    if (L.owed || L.fees || L.due){
      h += '<div class="note hard" style="margin-bottom:12px;padding-top:10px;padding-bottom:10px">'+
        /* History is a tab of its own; the note keeps to the two sums */
        '<span><b>'+money(L.owed)+'</b> still to pay the shops \u00b7 <b>'+money(L.fees)+'</b> of delivery fees for the office</span>'+
        (L.due > 0 ? '<p class="small" style="margin:6px 0 0">The office owes you '+money(L.due)+' for a delivery that failed after you had paid the shop.</p>' : '')+
        '</div>';
    }
    if (!jobs.length) return h + emptyBox('No deliveries right now',
      'A job appears when a shop marks an order ready.',
      '<button class="btn ghost" data-go="c.done">Your history</button>');

    /* group by order: one address, one buyer, however many shops */
    var seen = [], byId = {};
    jobs.forEach(function(x){
      if (!byId[x.o.id]){ byId[x.o.id] = []; seen.push(x.o); }
      byId[x.o.id].push(x.sb);
    });
    /* The buyer's window decides the order of the day, not the order the
       shops happened to get ready in. A book ready on Monday for a Thursday
       slot must not sit at the top of the list all week. Within the same
       window, whatever still needs collecting comes first. */
    var dueAt = function(o){ return (o.when && o.when.kind==='slot') ? o.when.at : 0 };
    seen.sort(function(a,b){
      if (dueAt(a) !== dueAt(b)) return dueAt(a) - dueAt(b);
      var ra = byId[a.id].some(function(s){ return s.status==='ready' }) ? 0 : 1;
      var rb = byId[b.id].some(function(s){ return s.status==='ready' }) ? 0 : 1;
      return ra - rb;
    });

    /* Two jobs, two views: go round the shops, then go to the doors. An order
       stays under To collect until its last shop is done, then moves. */
    var toCollect = seen.filter(function(o){ return byId[o.id].some(function(s){ return s.status==='ready' }) });
    var toDeliver = seen.filter(function(o){ return toCollect.indexOf(o) < 0 });
    var cst = P('cst', '');
    if (cst !== 'collect' && cst !== 'deliver') cst = toCollect.length ? 'collect' : 'deliver';
    h += '<div class="pin-act pin-states">'+aseg('cst', [['collect', 'To collect', toCollect.length], ['deliver', 'To deliver', toDeliver.length]], cst)+'</div>';
    var shown = cst === 'collect' ? toCollect : toDeliver;
    if (!shown.length) h += emptyBox(cst === 'collect' ? 'Nothing to collect' : 'Nothing to deliver yet',
      cst === 'collect' ? 'Every order is on you. Switch to To deliver.' : 'Collect from the shops first.');

    shown.forEach(function(o){
      var subs = byId[o.id].slice().sort(function(a,b){
        return (a.status==='ready'?0:1) - (b.status==='ready'?0:1);
      });
      var cash = 0; subs.forEach(function(sb){ cash += sb.total });
      var books = 0; subs.forEach(function(sb){ books += sb.items.length });
      h += '<div style="margin-bottom:20px">'+
        '<div class="between" style="margin-bottom:8px"><div class="grow stack">'+
          '<p style="margin:0;font-weight:600">Order #'+o.id+' \u00b7 '+esc(o.name||db.readers[o.reader].name)+'</p>'+
          '<p class="small" style="margin:0;color:var(--foreground)"><b>For '+esc(whenShort(o.when))+'</b> \u00b7 buyer pays '+money((o.books||0)+(o.fee||0))+'</p>'+
          '<p class="small muted" style="margin:0">'+esc(o.addr||'')+', Yerevan \u00b7 '+esc(o.phone||'')+'</p>'+
          (o.note ? '<p class="said" style="margin-top:6px;-webkit-line-clamp:none">\u201C'+esc(o.note)+'\u201D</p>' : '')+
        '</div></div>'+
        '<div class="stack-list">'+subs.map(function(sb){ return jobCard(o, sb, false) }).join('')+'</div>'+
        orderAction(o, subs)+
        '</div>';
    });
    return h;
  }

  /* One order is one delivery. Collecting happens shop by shop; handing over
     and taking the cash happens once, at one door. */
  function orderAction(o, subs){
    var left = subs.filter(function(sb){ return sb.status==='ready' });
    var total = (o.books||0) + (o.fee||0);
    /* one shop: its own card already says "to collect" and carries the button */
    if (left.length)
      return subs.length>1
        ? '<div class="note" style="margin-top:12px"><b>'+left.length+' of '+subs.length+' shops still to collect from.</b> Pick up everything before you go.</div>'
        : '';
    /* The button used to stay shut until two hours before the buyer's window.
       The intent was right \u2014 turning up early with a book somebody planned
       their evening around is not a favour \u2014 but it was a rule invented
       before a single delivery had been made, and it stood couriers down in
       front of open doors. The window is printed instead, and the courier,
       who is holding the book and can see the street, decides. */
    /* The job has one outcome worth a button — the door opened and the cash
       changed hands. Giving up is the other outcome, it is rare, and it is
       not a peer of the first: a full-width outline button beside the primary
       is the one a thumb finds by accident, and finding it by accident here
       stands a courier down and reopens somebody's request. So it goes last,
       as a link: reachable, deliberate, and never mistaken for the button. */
    return '<div class="btns" style="margin-top:12px">'+
        '<button class="btn wide" data-act="cdeliverorder:'+o.id+'">Delivered \u00b7 took '+money(total)+'</button>'+
      '</div>'+
      reasonBlock('Could not deliver', 'cfailorder:'+o.id,
        ['no answer', 'refused it', 'wrong address'],
        'Every book goes back to its shop. The order is cancelled and the readers\u2019 requests reopen'+
        (subs.some(function(sb){ return shopPaidFor(sb.no) }) ? ' \u2014 and where you already paid a shop, the office pays you back.' : '.'));
  }

  function scrCourierJob(){
    var found = null;
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){ if (sb.no===view.p.id) found = {o:o, sb:sb} }) });
    if (!found) return scrCourierJobs();
    /* THE WAY TO FINISH THE JOB HAS TO BE ON THIS PAGE TOO.
       Handing over is an ORDER-level act - one trip, one door, one payment -
       so it lived only on the list, where the order's shops are grouped. A
       courier who opened a single stop and pressed "Collected" then found a
       page with nothing left to press on it: the book was in their bag, they
       were standing at the buyer's door, and the only thing on screen was a
       back link. Dead ends are how a flow loses people.
       The same block goes here, so it reads correctly in both states: with
       other shops still to collect it says so and stays shut, and once every
       stop is collected it is the button that ends the trip. */
    var subs = found.o.subs.filter(function(sb){
      return sb.delivery==='courier' && ['ready','shipped'].indexOf(sb.status)>=0;
    });
    var more = subs.length > 1;
    return '<button class="back" data-go="c.jobs">\u2190 Deliveries</button>'+
      '<h1>#'+esc(found.sb.no)+'</h1>'+
      '<p class="sub">'+(found.sb.status==='ready' ? 'Pick it up, then bring it to the buyer.' : 'On you now. Take '+money(found.sb.total)+' when you hand it over.')+'</p>'+
      jobCard(found.o, found.sb, true)+
      (more
        ? '<p class="hint" style="margin-top:12px">This order has '+subs.length+' stops. '+
          'The handover covers all of them \u2014 the buyer pays once.</p>'
        : '')+
      '<div class="page-tail">'+orderAction(found.o, subs)+'</div>';
  }

  function courierFailed(){
    var out = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.delivery==='courier' && sb.status==='cancelled' && sb.courier === db.me.courierId) out.push({o:o, sb:sb});
    })});
    return out.reverse();
  }

  /* every shop this courier owes or has settled, with the jobs behind each figure */
  function shopBreakdown(){
    var by = {}, order = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){
      if (sb.delivery !== 'courier') return;
      if (sb.courier !== db.me.courierId) return;
      if (['completed','cancelled'].indexOf(sb.status) < 0) return;
      if (sb.status === 'cancelled' && !shopPaidFor(sb.no)) return;
      var k = sb.seller;
      if (!by[k]){ by[k] = { id:k, name: seller(k).name, paid:0, owed:0, jobs:0, unpaid:[] }; order.push(k); }
      var r = by[k];
      r.jobs++;
      if (shopPaidFor(sb.no)) r.paid += sb.books;
      else { r.owed += sb.books; r.unpaid.push({o:o, sb:sb}); }
    })});
    return order.map(function(k){ return by[k] });
  }

  function scrCourierDone(){
    var done = courierDone(), failed = courierFailed(), L = courierLedger();
    var h = '<h1>History</h1>';
    if (!done.length && !failed.length && !db.ledger.length)
      return h + emptyBox('Nothing delivered yet',
        'Deliveries you close are kept here with the cash.');
    h += '<div class="card" style="margin-bottom:14px"><p class="eyebrow">Your cash</p>'+
      '<div class="between small"><span class="grow muted">Taken from buyers</span><span class="price">'+money(L.taken)+'</span></div>'+
      '<div class="between small" style="margin-top:4px"><span class="grow muted">Paid to shops</span><span class="price">\u2212 '+money(L.paid)+'</span></div>'+
      (L.handedIn ? '<div class="between small" style="margin-top:4px"><span class="grow muted">Handed in at the office</span><span class="price">− '+money(L.handedIn)+'</span></div>' : '')+
      '<div class="between" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px"><span class="grow">'+(L.inHand<0?'Out of your own pocket':'In your hands')+'</span><span class="price">'+money(Math.abs(L.inHand))+'</span></div>'+
      '<div class="between small" style="margin-top:10px"><span class="grow muted">Still to pay the shops</span><span class="price">'+money(L.owed)+'</span></div>'+
      '<div class="between small" style="margin-top:4px"><span class="grow muted">Delivery fees for the office</span><span class="price">'+money(L.fees)+'</span></div>'+
      (L.due > 0 ? '<p class="small" style="margin:8px 0 0">The office owes you '+money(L.due)+'. Mark it in your profile once you have it.</p>' : '')+
      '</div>';

    /* a total tells you nothing at the counter. Which shop, and how much, does. */
    var byShop = shopBreakdown();
    if (byShop.length){
      h += '<h2>Shop by shop</h2><div class="card">';
      byShop.forEach(function(r, i){
        h += '<div style="'+(i?'margin-top:12px;border-top:1px solid var(--border);padding-top:12px':'')+'">'+
          '<div class="between"><span class="grow" style="font-weight:600">'+esc(r.name)+'</span>'+
            (r.owed > 0 ? '<span class="price bad-t">'+money(r.owed)+' owed</span>'
                        : '<span class="chip dim">settled</span>')+'</div>'+
          '<p class="small muted" style="margin:4px 0 0">'+r.jobs+(r.jobs>1?' deliveries':' delivery')+
            ' · paid '+money(r.paid)+' of '+money(r.paid + r.owed)+'</p>'+
          (function(){
            if (r.owed <= 0) return '';
            var open = settleOpen(r.id);
            /* One handover for the whole shop, not one per order. The courier
               counts out a single pile of notes and the shop takes a single
               pile; three buttons for three orders describes a thing that is
               not happening. */
            if (open)
              return '<div class="codebox" style="margin-top:10px">'+
                '<div class="grow"><p class="eyebrow" style="margin-bottom:4px">Read this out</p>'+
                '<span class="code">'+esc(open.code)+'</span></div>'+
                '<p class="small" style="margin:0;flex:1;min-width:170px;color:var(--foreground)">'+
                  'They type it on their side and '+money(open.amount)+' is recorded, by both of you, now. '+
                  'Until they do, this money is still yours.</p>'+
                '<div class="btns" style="width:100%">'+
                  '<button class="btn ghost sm" data-act="csettlestop:'+open.id+'">Not now \u2014 cancel</button></div>'+
              '</div>';
            return '<div class="btns" style="margin-top:8px">'+
              '<button class="btn sm" data-act="csettlestart:'+r.id+'">Hand over '+money(r.owed)+'</button></div>'+
              '<p class="small muted" style="margin:6px 0 0">'+r.unpaid.length+
                ' order'+(r.unpaid.length>1?'s':'')+' in one go. They confirm with a code at the counter.</p>';
          })()+
          '</div>';
      });
      h += '</div>';
    }

    if (done.length) h += '<h2>Delivered ('+done.length+')</h2>';
    h += '<div class="stack-list">';
    done.forEach(function(x){
      var sl = seller(x.sb.seller);
      h += '<div class="card"><div class="between"><div class="grow stack">'+
        '<p style="margin:0;font-weight:600">#'+x.sb.no+' \u00b7 '+esc(sl.name)+'</p>'+
        '<p class="small muted" style="margin:0">'+x.sb.items.map(function(id){ return esc(offer(id).title) }).join(' \u00b7 ')+'</p>'+

        '</div><span class="price">'+money(x.sb.books)+'</span></div>'+
        '<div class="btns" style="margin-top:10px">'+
          (shopPaidFor(x.sb.no)
            ? '<span class="chip dim">shop paid'+(x.sb.payMode==='onpickup'?' at pickup':'')+'</span>'
            : '<span class="chip bad">not yet paid to the shop</span>')+
        '</div></div>';
    });
    h += '</div>';
    if (failed.length){
      h += '<h2>Could not deliver ('+failed.length+')</h2><div class="stack-list">';
      failed.forEach(function(x){
        var sl = seller(x.sb.seller), back = shopPaidFor(x.sb.no);
        h += '<div class="card"><div class="between"><div class="grow stack">'+
          '<p style="margin:0;font-weight:600">#'+x.sb.no+' · '+esc(sl.name)+'</p>'+
          '<p class="small muted" style="margin:0">'+x.sb.items.map(function(id){ return esc(offer(id).title) }).join(' · ')+'</p>'+
          '<p class="small muted" style="margin:0">'+esc(x.sb.cancelReason||'not delivered')+' · book returned to the shop</p>'+
          '</div><span class="chip">closed</span></div>'+
          (back ? '<p class="small" style="margin:10px 0 0">You had paid the shop '+money(x.sb.books)+'. The office owes it back to you — it is in the totals above.</p>' : '')+
          '</div>';
      });
      h += '</div>';
    }
    return h;
  }



  /* ============================== admin ==============================
     Five places, each answering one question, and each built for the day it
     holds two hundred rows rather than the day it holds three:

       Overview      what needs a person, and how trade is going
       Applications  shops asking to join — the one account anybody approves
       Requests      what readers asked, split into "ours to check" and "out"
       Orders        what was bought, by the state it is in
       Shops         every shop, with its money in front

     Every list here has the same four tools in the same order: a segment for
     the state, filter chips inside it, a search once there is enough to need
     one, and twenty rows at a time. Every decision has the same shape too:
     the thing, then the choice, then — when the choice sends words to
     somebody — the words exactly as they will see them, before they go. */

  var PAGE = 20;
  function P(k, d){ var v = view.p[k]; return (v === undefined || v === null || v === '') ? d : v }
  function allSubs(){
    var out = [];
    db.orders.forEach(function(o){ o.subs.forEach(function(sb){ out.push({ o: o, sb: sb }) }) });
    return out;
  }
  function rname(id){ return db.readers[id] ? (db.readers[id].name || 'A reader') : 'A reader' }
  function dbadge(kind){
    return kind === 'courier'
      ? '<span class="dbadge cour">'+icon('c.jobs')+'Courier</span>'
      : '<span class="dbadge pick">'+icon('a.shops')+'Pickup</span>';
  }
  function aseg(key, opts, cur){
    return '<div class="seg aseg" role="tablist">'+opts.map(function(o){
      return '<button role="tab" data-act="aset:'+key+':'+o[0]+'" aria-pressed="'+(String(cur) === String(o[0]))+'">'+
        esc(o[1])+(o[2] !== undefined ? ' <span class="segn">'+o[2]+'</span>' : '')+'</button>';
    }).join('')+'</div>';
  }
  /* filter chips are buttons, so they wear a border; the chosen one fills */
  function achips(key, opts, cur){
    return '<div class="fchips">'+opts.map(function(o){
      return '<button class="fchip" data-act="aset:'+key+':'+o[0]+'" aria-pressed="'+(String(cur) === String(o[0]))+'">'+
        esc(o[1])+(o[2] !== undefined ? ' <span class="segn">'+o[2]+'</span>' : '')+'</button>';
    }).join('')+'</div>';
  }
  /* A search box on a list of four is a chore; on a list of four hundred it
     is the list. It appears once there is enough to search, and stays while a
     search is running so it can be cleared. */
  function asearch(total, ph){
    if (total <= 8 && !P('q', '')) return '';
    return '<input class="in asearch" type="search" data-filter="q" value="'+esc(P('q', ''))+'" placeholder="'+esc(ph)+'" aria-label="Search">';
  }
  function matchQ(){
    var q = String(P('q', '')).trim().toLowerCase();
    if (!q) return true;
    for (var i = 0; i < arguments.length; i++) if (String(arguments[i] || '').toLowerCase().indexOf(q) >= 0) return true;
    return false;
  }
  function shopPicker(cur){
    var ids = Object.keys(db.sellers).sort(function(a, b){ return seller(a).name.localeCompare(seller(b).name) });
    return '<select class="in asel" data-filter="shop" aria-label="Shop">'+
      '<option value="">All shops</option>'+ids.map(function(k){
        return '<option value="'+k+'"'+(cur === k ? ' selected' : '')+'>'+esc(seller(k).name)+'</option>';
      }).join('')+'</select>';
  }
  function paged(list, key){
    var n = P(key || 'n', PAGE);
    return { rows: list.slice(0, n), left: Math.max(0, list.length - n), key: key || 'n' };
  }
  function moreBtn(pg){
    return pg.left ? '<button class="btn ghost wide" style="margin-top:12px" data-act="amore:'+pg.key+'">Show '+
      Math.min(PAGE, pg.left)+' more <span class="segn">· '+pg.left+' left</span></button>' : '';
  }
  function navAct(screen, seg, f){ return 'anav:'+screen+':'+(seg || '')+':'+(f || '') }
  function oldestOf(list, ts){ var m = null; list.forEach(function(x){ var t = ts(x); if (m === null || t < m) m = t }); return m }
  function sum(list, f){ var s = 0; list.forEach(function(x){ s += f(x) }); return s }

  /* the words a shop, a reader or a courier reads for a state, used everywhere
     the admin reads one too, so the two never drift */
  var OFFER_WORD = { sent:'with the reader', seen:'opened by the reader', in_cart:'in a cart',
    done_sold:'sold', done_not_chosen:'not chosen', declined:'set aside', removed:'taken down' };
  function offerWord(o){
    return o.review === 'waiting' ? 'waiting for your check' : o.review === 'sent back' ? 'sent back' : (OFFER_WORD[o.status] || o.status);
  }
  function subWord(sb){
    if (sb.status === 'shipped') return sb.delivery === 'pickup' ? 'put aside' : 'with the courier';
    if (sb.status === 'completed') return sb.delivery === 'pickup' ? 'collected' : 'delivered';
    if (sb.status === 'ready') return sb.delivery === 'pickup' ? 'ready' : 'ready for the courier';
    return sb.status;
  }

  /* ---- what reached whom --------------------------------------------------
     A shop that answered or missed a request necessarily saw it, whether or
     not the deck recorded the moment: "opened" is the union, never less than
     the answers. Splitting the shops into four groups that do not overlap is
     what lets the request file say one true sentence about each of them. */
  function shopSplit(r){
    var reached = reachedBy(r), ans = answeredBy(r), miss = missedBy(r);
    var seen = {};
    Object.keys(r.seenBy || {}).concat(ans, miss).forEach(function(k){ seen[k] = 1 });
    var offered = ans, missed = miss.filter(function(k){ return ans.indexOf(k) < 0 });
    var opened = reached.filter(function(k){ return seen[k] && ans.indexOf(k) < 0 && miss.indexOf(k) < 0 });
    var unseen = reached.filter(function(k){ return !seen[k] });
    return { reached: reached, offered: offered, missed: missed, opened: opened, unseen: unseen };
  }

  /* ---- needs you ------------------------------------------------------------ */
  function needs(){
    var apps = db.shopApps.filter(function(a){ return a.state === 'waiting' });
    var rq = waitingReqs(), of = waitingOffers();
    var mism = db.settles.filter(function(s){ return s.state === 'mismatch' });
    var open = db.settles.filter(function(s){ return s.state === 'open' });
    var flagged = allSubs().filter(function(x){ return x.sb.disputed && !x.sb.resolved });
    var c = db.account.claim;
    return [
      { n: apps.length, ttl: 'Shop applications to check', at: oldestOf(apps, function(a){ return a.at }),
        act: navAct('a.apps', 'waiting') },
      { n: rq.length, ttl: 'Requests to check', at: oldestOf(rq, function(r){ return r.posted }),
        act: rq.length === 1 ? null : navAct('a.reqs', 'mod'), go: rq.length === 1 ? ['a.req', rq[0].id] : null },
      { n: of.length, ttl: 'Offers to check', at: oldestOf(of, function(o){ return o.sent }),
        act: of.length === 1 ? null : navAct('a.reqs', 'mod'), go: of.length === 1 ? ['a.offer', of[0].id] : null },
      { n: c ? 1 : 0, ttl: 'A payment to match against the bank', at: c ? c.at : null, go: ['a.claim', 'claim'] },
      { n: mism.length, ttl: 'Handovers where the two counts differ', at: oldestOf(mism, function(s){ return s.doneAt || s.at }),
        go: mism.length ? ['a.cash', mism[0].id] : null, act: mism.length > 1 ? navAct('a.shops', 'open', 'money') : null },
      { n: open.length, ttl: 'Handovers counting, not signed', at: oldestOf(open, function(s){ return s.at }),
        go: open.length ? ['a.shop', open[0].seller] : null },
      { n: flagged.length, ttl: 'Orders a buyer flagged', at: oldestOf(flagged, function(x){ return x.sb.disputedAt || now }),
        act: navAct('a.orders', 'flagged') }
    ];
  }
  /* kept under its old name: the tab bar and a few tests still ask it */
  function opsWork(){ return needs().filter(function(x){ return x.n }) }
  function needRow(x){
    var target = x.go && !x.act ? ' data-go="'+x.go[0]+'" data-p="'+esc(String(x.go[1]))+'"' : ' data-act="'+x.act+'"';
    return '<button class="row"'+target+' style="text-align:left;align-items:center">'+
      '<div class="grow stack"><p style="margin:0;font-weight:600">'+esc(x.ttl)+'</p>'+
      (x.at ? '<p class="small muted" style="margin:0">oldest waiting '+ago(x.at)+'</p>' : '')+'</div>'+
      '<span class="chip solid">'+x.n+'</span></button>';
  }

  /* ---- overview ------------------------------------------------------------ */
  /* ---- how well a shop answers ----------------------------------------------
     The one question under every other number: when a reader asks, does the
     shop look, does it answer, and does the answer sell? Four counts per shop,
     each a subset of the one above it, so they read as a funnel:

       reached   the request went out while the shop was open on Shelfcall
       opened    it reached the top of the shop's deck, or the shop answered
                 or missed it (either of which means it was seen)
       offered   the shop sent at least one copy for it
       ordered   one of those copies was bought

     Plus two times: how long after a request goes out the shop usually opens
     it, and how long until its first offer. Medians, not averages - one
     request opened a week late should not make a quick shop look slow.
     The admin and the shop read the SAME numbers from the same function; the
     shop just never sees anybody else's name. */
  function outAt(r){ return r.passedAt || r.posted }
  function joinedAt(k){ var sl = db.sellers[k]; return sl ? (sl.joined || sl.trialStart || 0) : 0 }
  function median(a){
    if (!a.length) return null;
    a = a.slice().sort(function(x, y){ return x - y });
    var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  function durWord(ms){
    if (ms === null || ms === undefined) return '—';
    if (db.lang === 'ru'){
      var mr = Math.round(ms / 60000); if (mr < 60) return Math.max(1, mr)+' мин';
      var hr0 = Math.round(ms / HOUR); if (hr0 < 48) return hr0+' ч';
      return Math.round(ms / DAY)+' дн.';
    }
    var m = Math.round(ms / 60000); if (m < 60) return Math.max(1, m)+' min';
    var hr = Math.round(ms / HOUR); if (hr < 48) return hr+' h';
    return Math.round(ms / DAY)+' days';
  }
  function pct(a, b){ return b ? Math.round(a / b * 100) : 0 }
  function num(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') }
  function effFrom(){ var wk = +P('wk', 4); return wk ? now - wk * 7 * DAY : 0 }
  function emptyFunnel(){ return { reached: 0, opened: 0, offered: 0, ordered: 0, tOpen: [], tOffer: [] } }
  function funnels(from){
    var by = {}, ofx = {}, miss = {};
    Object.keys(db.sellers).forEach(function(k){
      by[k] = emptyFunnel();
      (db.sellers[k].missed || []).forEach(function(rid){ miss[rid + '|' + k] = 1 });
    });
    db.offers.forEach(function(o){
      var key = o.req + '|' + o.seller, x = ofx[key] || (ofx[key] = { first: o.sent, sold: false });
      if (o.sent && (!x.first || o.sent < x.first)) x.first = o.sent;
      if (o.status === 'done_sold') x.sold = true;
    });
    db.requests.forEach(function(r){
      if (!reqLive(r)) return;
      var out = outAt(r); if (out < from) return;
      reachedBy(r).forEach(function(k){
        if (joinedAt(k) > out) return;
        var f = by[k], key = r.id + '|' + k, x = ofx[key], seen = r.seenBy && r.seenBy[k];
        f.reached++;
        if (seen || x || miss[key]){ f.opened++; if (seen && seen >= out) f.tOpen.push(seen - out) }
        if (x){ f.offered++; if (x.first && x.first >= out) f.tOffer.push(x.first - out) }
        if (x && x.sold) f.ordered++;
      });
    });
    var all = emptyFunnel();
    Object.keys(by).forEach(function(k){
      var f = by[k];
      ['reached', 'opened', 'offered', 'ordered'].forEach(function(n){ all[n] += f[n] });
      all.tOpen = all.tOpen.concat(f.tOpen); all.tOffer = all.tOffer.concat(f.tOffer);
    });
    return { by: by, all: all };
  }
  /* the bars. `avg` draws the tick and the "on average" words; leave it out
     for the market as a whole, which cannot be compared with itself */
  function funnelBars(f, avg, you){
    var steps = [
      { l: you ? 'Reached you' : 'Reached', n: f.reached,
        say: f.reached ? 'requests that went out while '+(you ? 'you were' : 'the shop was')+' open' : 'no requests went out in this time' },
      { l: 'Opened', n: f.opened, a: avg && pct(avg.opened, avg.reached),
        say: (f.tOpen.length ? 'usually '+durWord(median(f.tOpen))+' after it went out' : 'no opening times yet') },
      { l: 'Offered a book', n: f.offered, a: avg && pct(avg.offered, avg.reached),
        say: pct(f.offered, f.opened)+'% of what '+(you ? 'you' : 'it')+' opened'+
             (f.tOffer.length ? ' · first offer usually '+durWord(median(f.tOffer))+' after it went out' : '') },
      { l: 'Became an order', n: f.ordered, a: avg && pct(avg.ordered, avg.reached),
        say: f.offered ? num(f.ordered)+' of '+num(f.offered)+' answered requests ('+pct(f.ordered, f.offered)+'%)' : 'nothing offered yet' }
    ];
    return '<div class="fun">'+steps.map(function(st, i){
      var p = i === 0 ? 100 : pct(st.n, f.reached);
      return '<div class="fstep">'+
        '<div class="between"><span class="fl grow">'+esc(st.l)+'</span>'+
          '<span class="fv">'+(i ? '<b>'+p+'%</b> <span class="muted">· '+num(st.n)+'</span>' : '<b>'+num(st.n)+'</b>')+'</span></div>'+
        '<div class="ftrack" role="img" aria-label="'+esc(st.l+': '+p+'%'+(st.a !== undefined && st.a !== null && i ? ', Shelfcall average '+st.a+'%' : ''))+'">'+
          '<i style="width:'+(f.reached ? p : 0)+'%"></i>'+
          (i && avg ? '<b class="fmark" style="left:'+st.a+'%"></b>' : '')+'</div>'+
        '<p class="small muted">'+esc(st.say)+(i && avg ? ' · average shop '+st.a+'%' : '')+'</p></div>';
    }).join('')+'</div>'+
    (avg ? '<p class="flegend"><i aria-hidden="true"></i>the Shelfcall average, all shops together</p>' : '');
  }
  /* the one sentence, then the one thing to do about the weakest step */
  function funnelSay(f, you){
    if (!f.reached) return '';
    var w = you ? 'you' : 'they';
    return '<p class="fsay">Of <b>'+f.reached+'</b> requests that reached '+(you ? 'you' : 'this shop')+', '+w+' opened <b>'+f.opened+'</b>, '+
      'offered a book on <b>'+f.offered+'</b>, and <b>'+f.ordered+'</b> became '+(f.ordered === 1 ? 'an order' : 'orders')+'.</p>';
  }
  function funnelTip(f, avg){
    if (!f.reached || !avg || !avg.reached) return '';
    var gaps = [
      { k: 'open', mine: pct(f.opened, f.reached), them: pct(avg.opened, avg.reached),
        t: 'Most requests close before you see them. Opening the feed twice a day is the quickest win.' },
      { k: 'offer', mine: pct(f.offered, f.opened), them: pct(avg.offered, avg.opened),
        t: 'You open requests but rarely answer. A close match is worth sending — readers often take “something like it”.' },
      { k: 'sell', mine: pct(f.ordered, f.offered), them: pct(avg.ordered, avg.offered),
        t: 'Readers choose other copies over yours. Clear photos of the actual copy and a fair price win most often.' }
    ];
    var worst = null;
    gaps.forEach(function(g){ var d = g.them - g.mine; if (d > 3 && (!worst || d > worst.d)){ worst = g; worst.d = d } });
    return worst
      ? '<div class="note" style="margin:6px 0 18px"><b>Where you lose the most.</b> '+esc(worst.t)+'</div>'
      : '<div class="note" style="margin:6px 0 18px"><b>Every step is at or above the average.</b> Keep answering quickly — speed is what readers notice first.</div>';
  }
  function effBlock(){

        'offered a book on <b>'+pct(F.all.offered, F.all.reached)+'%</b>, and <b>'+pct(F.all.ordered, F.all.reached)+'%</b> became an order.</p>' : '') +
      funnelBars(F.all, null, false) +

    /* the comparison */

            '%, offered '+pct(f.offered, f.reached)+'%, ordered '+pct(f.ordered, f.reached)+'%, opens in '+durWord(median(f.tOpen)))+'">'+
          '<span>'+esc(seller(k).name)+'</span><span>'+num(f.reached)+'</span>'+
          col('open', pct(f.opened, f.reached)+'%')+col('offer', pct(f.offered, f.reached)+'%')+
          col('order', pct(f.ordered, f.reached)+'%')+col('speed', durWord(median(f.tOpen)))+'</button>';
      }).join('')+'</div>'+
      (ids.length > 8 && !showAll ? '<button class="btn ghost wide" style="margin-top:12px" data-act="aset:allsh:1">All '+ids.length+' shops</button>' : '')+
      '<p class="hint" style="margin-top:10px">Percent of the requests that reached each shop. Tap a shop for its steps'+
      (idle ? ' · '+idle+' shop'+(idle === 1 ? '' : 's')+' had nothing reach '+(idle === 1 ? 'it' : 'them')+' in this time' : '')+'.</p>';

  function scrOpsWork(){
