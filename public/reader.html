  function svgIcon(inner, size, weight, style){
    return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" '+
      'stroke-width="'+weight+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(style ? ' style="'+style+'"' : '')+'>'+inner+'</svg>';
  }
  /* A "+" typed as text is a different weight and a different height in every
     font that has to stand in for Geist, and it sits on the baseline rather
     than on the cap line. Drawn, it matches the label's ink and its stroke,
     and .btn already spaces an icon from its label by 8px. */
  var PLUS = svgIcon(UI_ICON.add, 16, 2, 'flex:none');

  function icon(k){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICON[k]||'')+'</svg>';
  }

  /* A screen that is a FLOW hides the tab bar. Filling in an order or an offer
     is a job with one way out — the button at the bottom — and a row of exits
     beside it is both a distraction and 56px stolen from the height every one
     of these forms is measured against. */
  /* Screens that hide the tab bar, because they are one-way work with a single
     way out. The order's own page is NOT one of them: it is where checkout
     lands AND where the orders list sends you back to later, so it is a
     destination. A destination that hides the tab bar is a trap. */
  var FLOW = ['r.new','r.checkout','r.review','s.newoffer','s.pay','s.location','s.reg','x.auth','s.apply'];
  function renderTabbar(){
    var el = document.getElementById('tabbar');
    if (FLOW.indexOf(view.screen) >= 0){
      el.innerHTML = ''; el.hidden = true;
      document.body.classList.remove('has-tabbar'); return;
    }
    el.hidden = false;
    document.body.classList.add('has-tabbar');
    var role = db.me.role;
    /* Four is the most that fits at 390px once the labels are Armenian, so the
       four are chosen rather than taken off the front of the list. Billing
       stays: it is where a shop's money and its standing live. Reviews goes to
       the shop profile — a seller reads them, they are not a place they work. */
    var MOBILE = {
      reader:  ['r.requests','r.orders','r.cart'],
      seller:  ['s.feed','s.offers','s.orders','s.stats','s.billing'],
      courier: ['c.jobs','c.done'],
      ops:     ['a.work','a.apps','a.reqs','a.orders','a.shops']
    };
    var want = MOBILE[role] || [];
    var items = TABS[role].filter(function(t){ return want.indexOf(t[0]) >= 0 })
      .sort(function(a,b){ return want.indexOf(a[0]) - want.indexOf(b[0]) });
    el.innerHTML = '<nav>'+items.map(function(t){
      return '<button data-go="'+t[0]+'" aria-current="'+(sectionOf(view.screen)===t[0])+'">'+
        icon(t[0])+'<span class="lb">'+esc(tr(t[1]))+'</span>'+tabBadge(t[0])+'</button>';
    }).join('')+'</nav>';
  }
  function tabBadge(id){
    var n = 0;
    if (id==='r.cart') n = db.cart.length;
    if (id==='s.orders') n = pendingSubs().filter(function(x){ return ['placed','confirmed'].indexOf(x.sb.status) >= 0 }).length;
    if (id==='c.jobs') n = courierJobs().length;
    if (id==='a.apps') n = db.shopApps.filter(function(a){ return a.state === 'waiting' }).length;
    if (id==='a.reqs') n = waitingReqs().length + waitingOffers().length;
    if (id==='a.orders') n = allSubs().filter(function(x){ return x.sb.disputed && !x.sb.resolved }).length;
    if (id==='a.shops') n = (db.account.claim ? 1 : 0) + db.settles.filter(function(x){ return x.state === 'mismatch' || x.state === 'open' }).length;
    if (id==='r.requests') n = myRequests().filter(function(r){ return liveOffers(r.id).some(function(o){return o.status==='sent'}) }).length;
    return n ? '<span class="count">'+n+'</span>' : '';
  }

  /* A detail screen belongs to the section it was opened from, so the menu
     still says where you are when you are three clicks deep in one shop. */
  var SECTION_OF = { 'a.app':'a.apps', 'a.req':'a.reqs', 'a.offer':'a.reqs',
    'a.order':'a.orders', 'a.shop':'a.shops', 'a.cash':'a.shops', 'a.claim':'a.shops', 'r.when':'r.orders', 's.earn':'s.billing' };
  function sectionOf(s){ return SECTION_OF[s] || s; }

  var HOME = { reader:'r.requests', seller:'s.feed', ops:'a.work', courier:'c.jobs' };
  /* folded or open is a per-viewer convenience, so it lives in this browser */
  var sideMin = false;
  try { sideMin = localStorage.getItem('sc_side_min') === '1'; } catch(e){}
  function renderSide(){
    var el = document.getElementById('side');
    /* A bookseller on a laptop works the same way an admin does: a counter,
       a till, five sections each holding a queue. So the shop gets the same
       left column on a desk-sized screen. */
    var role = db.me.role;
    var on = true;
    document.body.classList.toggle('has-side', on);
    if (!on){ el.innerHTML = ''; return; }
    var cur = sectionOf(view.screen);
    var shop = role === 'seller' ? seller(db.me.sellerId) : null;
    el.setAttribute('aria-label', 'Sections');
    document.body.classList.toggle('side-min', sideMin);
    el.innerHTML =
      '<div class="side-top"><p class="side-h">'+({ seller:'Your shop', ops:'Admin', reader:'Reader', courier:'Courier' })[role]+'</p>'+
        '<button class="side-tg" data-act="sidetoggle" aria-expanded="'+(!sideMin)+'" aria-label="'+(sideMin ? 'Expand menu' : 'Collapse menu')+'" title="'+(sideMin ? 'Expand menu' : 'Collapse menu')+'">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
          '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4V20"/>'+
          (sideMin ? '<path d="M13.5 10L15.5 12L13.5 14"/>' : '<path d="M15.5 10L13.5 12L15.5 14"/>')+'</svg></button></div>'+
      '<nav>'+TABS[role].map(function(t){
        return '<button data-go="'+t[0]+'" aria-current="'+(cur===t[0])+'"'+(sideMin ? ' title="'+esc(tr(t[1]))+'" aria-label="'+esc(tr(t[1]))+'"' : '')+'>'+
          icon(t[0])+'<span class="lb">'+esc(tr(t[1]))+'</span>'+tabBadge(t[0])+'</button>';
      }).join('')+'</nav>'+
      (role === 'seller'
        ? '<div class="side-foot"><b>'+esc(shop.name)+'</b>'+shop.locations.length+' branch'+(shop.locations.length>1?'es':'')+' · Yerevan</div>'
        : role === 'ops' ? '<div class="side-foot"><b>'+esc(db.ops[db.me.opsId].name)+'</b>Shelfcall team · Yerevan</div>'
        : '<div class="side-foot"><b>'+esc(meName())+'</b>'+(role === 'courier' ? 'Shelfcall courier' : 'Reader')+' · Yerevan</div>');
  }

  function renderBar(){
    var role = db.me.role;
    var tabs = TABS[role].map(function(t){
      var on = view.screen === t[0] || view.screen.indexOf(t[0].split('.')[0]+'.')===0 && false;
      /* the same counts as the phone's tab bar, from the same function, so
         the top nav on a wider screen never knows less than the bottom one */
      var badge = tabBadge(t[0]);
      return '<button data-go="'+t[0]+'" aria-current="'+(sectionOf(view.screen)===t[0])+'">'+esc(tr(t[1]))+badge+'</button>';
    }).join('');
    document.getElementById('bar').innerHTML =
      '<button class="logo" data-go="'+(role==='reader'?'r.requests':role==='ops'?'a.work':role==='courier'?'c.jobs':'s.feed')+'">Shelfcall</button>'+
      '<nav class="nav">'+tabs+'</nav>'+
      '<nav class="nav chrome">'+
        (role === 'ops' ? '' :
        '<button class="icon-btn" data-go="x.notifs" aria-current="'+(view.screen==='x.notifs')+'" aria-label="Notifications" style="margin-left:6px">'+
          BELL + (unreadCount() ? '<span class="count">'+unreadCount()+'</span>' : '') + '</button>')+
        '<button class="icon-btn" data-go="x.settings" aria-current="'+(view.screen==='x.settings')+'" aria-label="Settings" style="margin-left:4px;font-size:12px;font-weight:600">'+
          esc(meName().slice(0,1)) + '</button>'+
      '</nav>';
    document.getElementById('proto').innerHTML =
      '<div class="loadsw"><span class="eyebrow" style="margin:0">Test it</span>'+
        '<div class="seg" role="group" aria-label="How much is going on">'+
          '<button data-act="light" aria-pressed="'+(!db.busy)+'">Light</button>'+
          '<button data-act="busy" aria-pressed="'+(!!db.busy)+'">Busy</button></div>'+
        '<span class="small muted">'+(db.busy
          ? Object.keys(db.sellers).length+' shops · '+db.requests.length+' requests · '+db.orders.length+' orders'
          : 'a few requests, offers and orders')+'</span></div>'+
      '<p style="margin:12px 0 0">'+esc('Prototype with sample data — every role is you. ' +
      (role==='seller' ? 'You are Aram Books, two branches, 12% after the free month.'
       : role==='courier' ? 'You are Vahe, delivering books across Yerevan and collecting the cash.'
       : role==='ops' ? 'You are on the Shelfcall team, looking after shops, requests and orders.'
       : 'You are Dina, in Yerevan.'))+'</p>';
  }

  /* ============================== reader screens ============================== */
  function scrReqList(){
    var rs = myRequests();
    /* The reader opens this screen to see whether anybody answered, so a
       request with NEW offers comes first, then ones with offers already read,
       then the ones still waiting, and last the ones not yet out (being checked
       or sent back). Newest first inside each. */
    var rankOf = function(r){
      if (r.review === 'waiting' || r.review === 'sent back') return 3;
      var lv = liveOffers(r.id);
      if (lv.some(function(o){ return o.status === 'sent' })) return 0;
      return lv.length ? 1 : 2;
    };
    rs = rs.slice().sort(function(a,b){
      return (rankOf(a) - rankOf(b)) || (b.posted - a.posted);
    });
    var open = rs.filter(function(r){ return r.status==='open' });
    /* ---- where the action goes -------------------------------------------
       Top to bottom, a phone screen is READ in that order and REACHED in the
       reverse one: the eye starts at the top, the thumb starts at the bottom.
       So the heading and the sentence that explains the screen stay at the
       top where they are read, and the button that acts goes UNDER the list,
       where it can be pressed without shifting grip.
       It also puts the button after the thing it adds to, which is "a list
       never acts" pointed the other way: you look at what you have already
       asked for, and then you ask for one more.
       The empty state is the exception and needs no rule — with no list there
       is nothing to read past, so the button sits in the middle of the box
       that explains why the screen is empty. */
    /* a returning reader comes here for one thing — did anybody answer — so the
       list starts right under the title; the explaining lives in the empty state */
    var h = '<div style="margin-bottom:8px"><h1>'+esc(tr('Your requests'))+'</h1></div>';
    if (!open.length) return h + (rs.length
      ? emptyBox('Nothing open right now',
          'Start another whenever a book comes to mind.',
          '<button class="btn wide" data-go="r.new">'+esc(tr('Ask for a book'))+'</button>')
      : emptyBox('Ask, and the shops answer',
          'Describe a book — a title, or only what you remember. Booksellers across Yerevan look on their shelves and reply with real copies.',
          '<button class="btn wide" data-go="r.new">'+esc(tr('Ask for a book'))+'</button>'));
    /* The reader's main action is docked under the list, above the tab bar, so it is
       there however long the list grows. It used to wait under the list,
       which on a busy account meant scrolling past every request to find it. */
    h += '<div class="stack-list">' + open.map(reqRow).join('') + '</div>';
    h += '<div class="pin-bottom"><button class="btn wide" data-go="r.new">'+esc(tr('Ask for a book'))+'</button></div>';
    return h;
  }
  function reqRow(r){
    var live = liveOffers(r.id), fresh = live.filter(function(o){ return o.status==='sent' }).length;
    /* The chip row used to wrap onto a second line on a 390px screen, because
       the offer count sat in its own column and left it 205px to work in. The
       count moves INTO the row — it is the most important chip, so it goes
       first — and the age moves up to the muted line, which had room. Chips
       that mean the same thing every time do not each need their own row. */
    /* The answer count is the reason this row exists: a reader opens this
       screen to find out whether anybody replied. So it sits top right, on
       the title's line, where the eye lands after the title and where it is
       in the same place on every card - rather than first in a chip row,
       where its position moved with the length of the title above it.
       Everything else stays a chip: kind, budget, and where the request is in
       the silence ladder. The countdown stays with them, because it belongs
       beside the budget as a condition of the ask, not beside the answers. */
    var badge = r.review === 'waiting' ? '<span class="chip">being checked</span>'
      : r.review === 'sent back' ? '<span class="chip bad">sent back</span>'
      : r.status==='fulfilled' ? '<span class="chip">fulfilled</span>'
      : r.status==='closed' ? '<span class="chip dim">closed</span>'
      : live.length ? (fresh
          ? '<span class="chip fresh"><i class="dot" aria-hidden="true"></i>'+fresh+' new'+
            (live.length>fresh ? ' of '+live.length : '')+'</span>'
          : '<span class="chip">'+live.length+' offer'+(live.length>1?'s':'')+'</span>')
      : '<span class="chip dim">no offers yet</span>';
    var meta = ['open '+ago(r.posted)]; if (r.budget) meta.push('up to '+money(r.budget));
    return '<button class="card-row" data-go="r.request" data-p="'+r.id+'">'+
      (r.photos && r.photos.length ? '<img class="thumb tall" src="'+r.photos[0]+'" alt="">' : '')+
      '<div class="grow stack">'+
        '<div class="between" style="align-items:flex-start;gap:10px">'+
          '<p class="book-t grow clamp2">'+esc(r.title || r.text)+'</p>'+
          badge+'</div>'+
        '<p class="small muted" style="margin:0">'+meta.join(' \u00b7 ')+'</p></div></button>';
  }

  /* Two short screens rather than one long one. Step 1 is the book;
     step 2 is everything a shop would like but the reader may not know. */
  /* Three short screens. The first one is the only real decision in the flow:
     what kind of asking this is. It gets a screen because the two kinds lead
     to different forms, different feeds and different offers. */
  function scrNew(){
    var d = view.draft;
    if (d.rstep===undefined) d.rstep = 1;

    /* --- 1 · which kind of request --- */
    if (d.rstep === 1){
      return '<button class="back" data-go="r.requests">← Requests</button>'+
        '<p class="eyebrow">Step 1 of 3</p>'+
        '<h1>What kind of asking is this?</h1>'+

        '<button class="pick" data-act="kind:concrete">'+
          '<p class="pick-t">A book you can name</p>'+
          '<p class="pick-d">You know the title, or the author, or the edition. Shops check the shelf and answer with that book — you compare copies, condition and price.</p>'+
          '<p class="pick-eg">“Master and Margarita, the 1988 edition.”</p>'+
        '</button>'+
        '<button class="pick" data-act="kind:open">'+
          '<p class="pick-t">A book you are describing</p>'+
          '<p class="pick-d">A subject, a mood, half a memory. Shops answer with what they think fits and say why — you are choosing between their judgement as much as their prices.</p>'+
          '<p class="pick-eg">“Something with a crazy scientist, not too heavy.”</p>'+
        '</button>'+
        '';
    }

    var head = '<button class="back" data-act="rstep:'+(d.rstep-1)+'">← '+
        (d.rstep===2 ? 'Kind of request' : 'The book')+'</button>'+
      '<p class="eyebrow">Step '+d.rstep+' of 3</p>'+
      '<h1>'+(d.rstep===2
        ? (d.kind==='concrete' ? 'Which book?' : 'Describe it')
        : 'Anything else?')+'</h1>'+
      (d.err ? '<div class="err">'+esc(d.err)+'</div>' : '');

    /* --- 2 · the book --- */
    if (d.rstep === 2){
      return head +
        '<p class="sub">'+(d.kind==='concrete'
          ? 'A title is enough. Everything else helps the right copy find you.'
          : 'In your own words. The shops read this and answer with what they think fits.')+'</p>'+
        /* The photo comes FIRST, above the fields, on both this screen and the
           bookseller's. Reasons, in order of weight:
           - A reader who has a photo has it because they saw the book: a cover
             on a shelf, a spine in a shop, a friend's copy. That memory is the
             freshest thing they have and it fades while they hunt for how to
             spell the author.
           - Where the photo sits decides whether it is offered or discovered.
             Under three fields it reads as an afterthought nobody uses; above
             them it reads as the easy way to ask.
           - It matches the bookseller's form, where the photo is also first.
             Two forms that ask for the same things in opposite orders is two
             forms to learn.
           The words still lead in the copy — the label says "if you have one",
           because most people will not, and the title is what carries the
           request. */
        '<p class="eyebrow" style="margin-bottom:6px">A photo, if you have one</p>'+
        photoPicker(d.photos)+
        '<div style="height:16px"></div>'+
        (d.kind==='concrete'
          ? '<div class="two tight"><label class="f"><span>Title</span><input class="in" id="f_title" value="'+esc(d.title||'')+'"></label>'+
            '<label class="f"><span>Author</span><input class="in" id="f_author" value="'+esc(d.author||'')+'"></label></div>'+
            '<label class="f"><span>Edition, year, language — if it matters</span><textarea class="in" id="f_text" style="min-height:70px">'+esc(d.text||'')+'</textarea></label>'
          : '<label class="f"><span>What you are after</span>'+
            '<textarea class="in" id="f_text" style="min-height:130px" placeholder="a book about a crazy scientist, fiction, not too heavy…">'+esc(d.text||'')+'</textarea></label>')+
        '<button class="btn wide" data-act="rstep:3">Continue</button>';
    }

    /* --- 3 · the optional rest ---
       "I can wait / I need it soon" used to live here, with a 30-minute or
       one-hour window behind it. It is out of the first release: a clock is a
       promise the supply side has to be able to keep, and ten bookshops with
       one courier cannot keep a 30-minute one yet. Asking the reader to
       choose a pace we cannot honour teaches them the answer means nothing.
       Every request is patient now. The machinery (WINDOWS, paceState, the
       lapsing rule) is still in the file, unreferenced, because the decision
       that brings it back is a supply decision, not a design one. */
    return head +
      '<p class="hint" style="margin-top:0;margin-bottom:14px">No deadline. It stays open until you order from it or close it, and offers never expire — a hard book can take weeks and still turn up.</p>'+
      '<p class="eyebrow" style="margin-bottom:6px">Limits, if you have any</p>'+
      '<div class="two tight"><label class="f"><span>Most you would pay</span><input class="in" id="f_budget" inputmode="numeric" value="'+esc(d.budget||'')+'" placeholder="6000"></label>'+
      '<label class="f"><span>Condition</span><select class="in" id="f_cond">'+
        ['any'].concat(GRADES).map(function(c){ return '<option'+(d.cond===c?' selected':'')+'>'+c+'</option>' }).join('')+
      '</select></label></div>'+
      /* It said "Publish request" until a person stood between the reader and
         the shops. It does not publish anything any more — it hands the
         request to us, and we pass it on. A button that names the wrong
         outcome is the cheapest kind of lie to tell and the dearest to keep. */
      '<button class="btn wide" data-act="publish">Send request</button>';
  }

  function scrRequest(){
    var r = req(view.p.id); if(!r) return scrReqList();
    var live = liveOffers(r.id), closed = offersFor(r.id).filter(function(o){ return ['declined','removed'].indexOf(o.status)>=0 });
    /* This is where publishing lands, so it has to read as arrival, not as a
       record. Two things that were wrong when it did:
       - the reader's own words sat in muted 14px under a heading that said
         nothing ("Your request"). On an open-ended request those words ARE the
         request; the bookseller reads them at 16px in a quoted card, and the
         person who wrote them should not see them smaller than that.
       - "Close request" sat in the chip row, at the top, so the first action
         offered on a request published ten seconds ago was to kill it.
         Destructive actions belong at the bottom, after everything they would
         destroy. */
    var h = '<button class="back" data-go="r.requests">← Requests</button>'+
      '<h1>'+esc(r.title || 'Your request')+'</h1>'+
      (!r.title || norm(r.text).indexOf(norm(r.title)) !== 0 || r.text.length > r.title.length + 16
        ? '<div class="card" style="margin-bottom:12px"><p style="margin:0;font-size:16px;line-height:24px">“'+esc(r.text)+'”</p></div>' : '')+
      (r.photos && r.photos.length ? '<div class="thumbs" style="margin-bottom:16px">'+r.photos.map(function(u){ return '<img class="thumb" src="'+u+'" alt="">' }).join('')+'</div>' : '')+
      /* no countdown chip here: the card below states it, and printing a
         deadline twice on one screen is how a reader stops believing either */
      '<p class="small muted" style="margin:0 0 18px">'+[r.kind==='open'?'Something like…':'Specific', r.budget ? 'up to '+money(r.budget) : '',
        r.cond+(r.cond==='any'?' condition':''), 'open '+ago(r.posted)].filter(function(x){ return x }).join(' \u00b7 ')+
        (r.status==='open' ? '' : ' \u00b7 <b>'+esc(r.status)+'</b>')+'</p>';

    if (r.status!=='open'){
      h += '<div class="note" style="margin-bottom:18px">This request is '+esc(r.status)+'. The offers below are kept for your records.</div>';
    }
    if (!live.length && r.status==='open'){
      /* The minute after publishing is the one that decides whether a reader
         comes back. They have just described a book and been handed a screen
         with nothing on it. "No offers yet" is technically true and reads like
         a failure, so for the first hour the screen says what is actually
         happening instead: the request is out, booksellers are reading it, and
         the reader has nothing left to do. Waiting is the product working. */
      var ps = 'patient';                 /* no pace in the first release */
      if (false){
        h += '<div class="note hard" style="margin-bottom:18px">'+
          '<div class="between"><span class="grow" style="font-weight:600">'+
            (ps === 'waiting'
              ? 'The shops open at '+hhmm(windowEndsAt(r) && r.windowStart)
              : 'Asked for '+esc((WINDOWS.filter(function(w){return w[0]===r.window})[0]||['','soon'])[1]).toLowerCase())+
          '</span>'+(ps === 'waiting'
              ? '<span class="chip solid">starts '+hhmm(r.windowStart)+'</span>'
              : '<span class="chip solid"><i class="dot live" aria-hidden="true"></i>'+leftShort(windowEndsAt(r))+'</span>')+'</div>'+
          '<p class="small" style="margin:8px 0 0;color:var(--foreground)">'+
            (ps === 'waiting'
              ? 'Your request is already with them; the clock starts when the first shop opens.'
              : 'Every bookshop in Yerevan has it, with a loud notification.')+'</p>'+
          '<p class="small muted" style="margin:6px 0 0">If nobody can do it in time nothing is lost — the request keeps going without the clock.</p>'+
        '</div>';
      } else if (ps === 'lapsed'){
        /* the whole point of having two paces: the window running out turns
           the request patient instead of killing it */
        h += '<div class="note" style="margin-bottom:18px">'+
          '<p style="margin:0;font-weight:600">Nobody could do it in time.</p>'+
          '<p class="small" style="margin:8px 0 0;color:var(--foreground)">Your request is still open — it just has no clock on it now. Shops answer hard ones in their own time, and nothing here expires.</p>'+
          '<div class="btns" style="margin-top:10px"><button class="btn secondary sm" data-act="reurgent:'+r.id+'">Ask again with a clock</button></div>'+
        '</div>';
      }
      /* While a window is running the card above has already said everything
         true about the wait. The generic empty state promises "most answers
         come within a day", which directly contradicts a 30-minute clock. */
      if (ps === 'running' || ps === 'waiting') return h + closeBlock(r, live);
      /* Before the shops, us. A request waiting on a person here is not
         "no offers yet" \u2014 it has not been asked yet, and saying the first
         when the second is true is the kind of small lie a product never
         recovers from. */
      if (r.review === 'waiting')
        return h + looking('We are reading your request. It goes to the shops as soon as it is through \u2014 usually within the hour.') + closeBlock(r, live);
      if (r.review === 'sent back')
        return h + readerBackNote(r.id, r.reviewWhy) + closeBlock(r, live);
      /* One block for the whole wait, and one sentence in it. The sentence
         softens once a request has been out for a couple of days, because a
         reader who has waited that long deserves to be told that waiting is
         normal here. The picture does not change, because what is happening
         has not changed. */
      h += looking((now - r.posted) > 2*DAY
        ? 'Still looking. Hard books take longer, and nothing here expires.'
        : 'Booksellers are looking for your book.');
      /* A wait with no number in it reads as an empty app. How many shops have
         looked is true, reassuring, and the reader's to know; which shops, and
         who passed, is not. */
      var spl = shopSplit(r), lookedN = spl.reached.length - spl.unseen.length;
      if (lookedN) h += '<p class="small muted" style="text-align:center;margin:-6px 0 18px">Seen by '+lookedN+' of '+spl.reached.length+' bookshops so far.</p>';
      if (now - r.posted > 3*DAY) h += '<div class="note" style="margin-bottom:18px"><b>Want more answers?</b> A higher limit, or any condition, reaches more copies. '+
        'Close this request and ask again with them — nothing you wrote is lost.</div>';
    } else if (live.length) {
      /* Sixteen copies is a choice, not a list: they can be put in the order
         the reader cares about, the unread ones say so, and anything over the
         reader's own limit waits behind one line instead of standing in the
         queue as if the limit had not been said. */
      var lim = r.budget || 0, freshN = live.filter(function(o){ return o.status === 'sent' }).length;
      var srt = P('os', freshN ? 'newest' : 'price');
      var CR = { 'new': 0, used: 1, old: 2 };
      var by = {
        price:  function(a, b){ return a.price - b.price },
        newest: function(a, b){ return (b.status === 'sent') - (a.status === 'sent') || b.sent - a.sent },
        cond:   function(a, b){ return ((CR[a.cond] === undefined ? 3 : CR[a.cond]) - (CR[b.cond] === undefined ? 3 : CR[b.cond])) || a.price - b.price },
        rating: function(a, b){ return ((rating(seller(b.seller)) || 0) - (rating(seller(a.seller)) || 0)) || a.price - b.price }
      }[srt] || function(a, b){ return a.price - b.price };
      var within = live.filter(function(o){ return !lim || o.price <= lim }).sort(by);
      var over = live.filter(function(o){ return lim && o.price > lim }).sort(by);
      h += '<div class="between" style="margin-bottom:10px"><p class="eyebrow grow" style="margin:0">'+live.length+' offer'+(live.length>1?'s':'')+
        (freshN ? ' · '+freshN+' new' : '')+'</p></div>';
      if (live.length > 3) h += achips('os', [['newest', 'Newest'], ['price', 'Cheapest'], ['cond', 'Best condition'], ['rating', 'Best rated']], srt);
      if (within.length) h += '<div class="rowlist">'+within.map(offerRow).join('')+'</div>';
      else h += '<div class="note" style="margin-bottom:12px">Nothing within your limit of <b>'+money(lim)+'</b> yet. The copies above it are below.</div>';
      if (over.length){
        var showOver = P('over', '') === '1' || !within.length;
        if (showOver) h += '<h2>Over your limit of '+money(lim)+' <span class="segn">· '+over.length+'</span></h2><div class="rowlist">'+over.map(offerRow).join('')+'</div>';
        else h += '<button class="btn ghost wide" style="margin-top:12px" data-act="aset:over:1">Show '+over.length+' over your limit · from '+money(over.reduce(function(m, o){ return Math.min(m, o.price) }, 1e12))+'</button>';
      }
    }
    if (closed.length) h += '<h2>Set aside ('+closed.length+')</h2><div class="rowlist">'+closed.map(offerRow).join('')+'</div>';
    h += closeBlock(r, live);
    return h;
  }

  /* Seven spines and a line. `--i` staggers them; the heights are set in CSS
     rather than here because they are a drawing, not data. */
  function looking(line){
    return '<div class="looking">'+
      '<div class="orbs" aria-hidden="true">'+
        [0,1,2].map(function(i){ return '<span class="orb" style="--i:'+i+'"></span>' }).join('')+
      '</div>'+
      '<p class="looking-t">'+line+'</p></div>';
  }

  /* the way out, last on the page, after everything it would close */
  function closeBlock(r, live){
    if (r.status !== 'open') return '';
    return '<div class="page-tail closer">'+
      cbtn('btn ghost sm','closereq:'+r.id,'Close this request','Yes, close it')+
      '<p class="hint" style="margin-top:8px">'+(live.length
        ? 'Its offers are set aside. Ordering one closes it too.'
        : 'It leaves the shops\u2019 feed. You can ask again any time.')+'</p></div>';
  }
  function offerRow(o){
    var s = seller(o.seller), rt = rating(s), l = loc(o.seller, o.loc);
    var r0 = req(o.req), openEnded = r0 && r0.kind === 'open';
    var gone = o.status==='removed', dec = o.status==='declined';
    var actions = gone ? '<span class="chip dim">no longer available</span>'
      : dec ? '<span class="chip dim">you set this aside</span><button class="btn ghost sm" data-act="undecline:'+o.id+'">Undo</button>'
      /* One button, two states. "Add to cart" that becomes a chip plus a
         second button called "Take out of cart" made the row jump and made
         the reader hunt for the undo. The button they pressed is the button
         that undoes it, in the same place, and it says which state it is in
         rather than what it will do — the tick is the state, and the label
         reads back as a fact about the cart. */
      : cartHas(o.id) ? '<button class="btn ghost sm" data-act="rm:'+o.id+'" aria-pressed="true">\u2713 In cart</button>'
      /* No "Not this". Setting an offer aside was work the reader did for our
         benefit, not theirs: an offer you do not want is one you simply do not
         buy. It also created a second place for offers to hide, and a second
         state to explain. The list is short, it is theirs, and ignoring a card
         costs nothing. */
      /* Side by side, each taking half the row. They were stacking because the
         price had its own column on the right — the same number that is
         already printed on the Buy button. One price per offer: it lives on
         the button you press, which is also where it matters. */
      : '<button class="btn ghost sm" data-act="add:'+o.id+'">Add to cart</button>'+
        '<button class="btn link" data-go="r.offer" data-p="'+o.id+'">See it and buy</button>';
    return '<div class="row'+(gone||dec?' past':'')+'">'+
      '<button class="cover-btn" data-go="r.offer" data-p="'+o.id+'" aria-label="Open '+esc(o.title)+'">'+cover(o,'m')+'</button>'+
      '<div class="grow stack">'+
        '<div class="between" style="align-items:flex-start"><button class="opens grow" data-go="r.offer" data-p="'+o.id+'"><p class="book-t">'+esc(o.title)+'</p></button>'+
          '<span class="stack" style="align-items:flex-end;gap:4px;padding-top:8px">'+
          '<span class="price" style="font-size:16px">'+money(o.price)+'</span>'+
          (o.status === 'sent' ? '<span class="chip solid">unread</span>' : '')+'</span></div>'+
        (openEnded && o.note ? '<p class="said lead">“'+esc(o.note)+'”</p>' : '')+
        '<p class="small muted" style="margin:0">'+esc(o.author)+(o.year?' · '+o.year:'')+' · '+esc(o.cond)+'</p>'+
        (!openEnded && o.note ? '<p class="said">“'+esc(o.note)+'”</p>' : '')+
        '<p class="small muted" style="margin:0;display:flex;align-items:center;gap:6px">'+avatar(s,'xs')+
          '<span>'+esc(s.name)+' — '+esc(l.label)+' · '+
          (rt ? '<span class="stars">'+stars(rt)+'</span> '+rt.toFixed(1)+' ('+s.reviews.length+')' : 'new seller')+'</span></p>'+
        '<div class="wrap-row" style="margin-top:6px;flex-wrap:nowrap">'+actions+'</div>'+
      '</div></div>';
  }

  function scrOffer(){
    var o = offer(view.p.id); if(!o) return scrReqList();
    var s = seller(o.seller), rt = rating(s), l = loc(o.seller, o.loc);
    var rq = req(o.req), lead = rq && rq.kind === 'open' && o.note;
    /* opening it is reading it: the "new" mark on the list goes */
    if (o.status === 'sent' && rq && rq.reader === db.me.readerId) o.status = 'seen';
    var byline = [o.author, o.pub, o.year].filter(function(x){ return x }).join(' \u00b7 ');
    var over = rq && rq.budget && o.price > rq.budget;
    return '<button class="back" data-go="r.request" data-p="'+o.req+'">← '+esc(shortly(rq ? (rq.title || rq.text) : 'Offers', 32))+'</button>'+
      '<div class="row" style="padding:0;gap:20px;align-items:flex-start;flex-wrap:wrap">'+
        (o.photos && o.photos.length ? '<img class="thumb" src="'+o.photos[0]+'" alt="" style="width:132px;height:186px;object-fit:cover">' : cover(o,'l'))+
        '<div class="grow stack" style="gap:10px;min-width:220px">'+
          '<h1 style="margin:0">'+esc(o.title)+'</h1>'+
          '<p class="sub" style="margin:0">'+esc(byline)+'</p>'+
          '<div class="wrap-row"><span class="chip">'+esc(o.cond)+'</span>'+
            (o.binding?'<span class="chip dim">'+esc(o.binding)+'</span>':'')+
            (o.lang?'<span class="chip dim">'+esc(o.lang)+'</span>':'')+
            (o.edition?'<span class="chip dim">'+esc(o.edition)+'</span>':'')+
            (o.pages?'<span class="chip dim">'+o.pages+' p.</span>':'')+'</div>'+
          (lead ? '<div><p class="eyebrow" style="margin-bottom:5px">Why '+esc(s.name)+' picked it</p>'+
                  '<p class="said lead" style="-webkit-line-clamp:none">“'+esc(o.note)+'”</p></div>' : '')+
          (over ? '<p style="margin:0"><span class="chip dim">over your limit of '+money(rq.budget)+'</span></p>' : '')+
          (o.status==='removed'
            ? '<div class="note bad">The seller has removed this offer — the copy is gone.</div>'
            : cartHas(o.id) ? '<div class="btns"><button class="btn" data-act="buy:'+o.id+'">Buy · '+money(o.price)+'</button>'+
              '<button class="btn ghost" data-act="rm:'+o.id+'" aria-pressed="true">\u2713 In cart</button></div>'+
              '<p class="hint" style="margin-top:8px">It is waiting in your cart. Press it again to take it out.</p>'
            : '<div class="btns"><button class="btn" data-act="buy:'+o.id+'">Buy · '+money(o.price)+'</button>'+
              '<button class="btn secondary" data-act="add:'+o.id+'" aria-pressed="false">Add to cart</button></div>'+
              '<p class="small muted" style="margin:2px 0 0">Add to cart to take it with books from your other requests.</p>')+
        '</div>'+
      '</div>'+
      /* what the price does not say: how the book gets to you, and what that costs */
      (o.status === 'removed' ? '' :
      '<div class="card" style="margin-top:18px"><p class="eyebrow" style="margin-bottom:8px">How it reaches you</p>'+
        (l.pickup ? '<p class="small" style="margin:0 0 6px;color:var(--foreground)"><b>Pick it up</b> · free · '+esc(l.addr)+', '+esc(l.hours)+'. You show a four-digit code.</p>'
                  : '<p class="small muted" style="margin:0 0 6px">No pickup at this branch.</p>')+
        '<p class="small" style="margin:0;color:var(--foreground)"><b>Courier</b> · '+money(db.deliveryFee)+' for the whole order, one trip — even with books from other shops. You pay cash at the door.</p></div>')+
      (o.photos && o.photos.length>1 ? '<div class="thumbs" style="margin-top:16px">'+o.photos.slice(1).map(function(u){ return '<img class="thumb" src="'+u+'" alt="">' }).join('')+'</div>' : '')+
      (o.note && !lead ? '<div style="margin:22px 0 0;max-width:60ch"><p class="eyebrow" style="margin-bottom:5px">What '+esc(s.name)+' says about this copy</p>'+
        '<p class="said" style="-webkit-line-clamp:none">“'+esc(o.note)+'”</p></div>' : '')+
      '<hr>'+
      '<button class="card-row" data-go="r.seller" data-p="'+s.id+'" style="align-items:center">'+avatar(s,'md')+
        '<div class="grow stack" style="gap:3px">'+
          '<p style="margin:0;font-weight:600">'+esc(s.name)+'</p>'+
          '<p class="small muted" style="margin:0">'+
            (rt?'<span class="stars">'+stars(rt)+'</span> '+rt.toFixed(1)+' \u00b7 '+s.reviews.length+' reviews':'New seller')+
            ' \u00b7 '+esc(l.label)+'</p>'+
        '</div><span class="disc">\u203a</span></button>';
  }

  function scrSeller(){

      '<p class="sub">'+(rt ? '<span class="stars">'+stars(rt)+'</span> '+rt.toFixed(1)+' · '+s.reviews.length+' reviews · ' : 'New seller · no reviews yet · ')+
        soldSubs(s.id).length+' orders · since '+new Date(s.joined || now).getFullYear()+'</p>'+
      '<p style="max-width:60ch">'+esc(s.bio)+'</p>'+
      '<h2>'+s.locations.length+' location'+(s.locations.length>1?'s':'')+'</h2>'+
      '<div class="rowlist">'+s.locations.map(function(l){
        return '<div class="row"><div class="grow stack"><p style="margin:0">'+esc(l.label)+'</p>'+
          '<p class="small muted" style="margin:0">'+esc(l.addr)+'</p></div>'+

      }).join('')+'</div>'+
      (mine.length ? '<h2>Offers to you ('+mine.length+')</h2><div class="rowlist">'+mine.map(offerRow).join('')+'</div>' : '')+
      '<h2>Reviews</h2>'+
      (s.reviews.length ? '<div class="rowlist">'+s.reviews.map(function(v){
          return '<div class="row"><div class="grow stack"><div class="wrap-row"><span class="stars">'+stars(v.stars)+'</span>'+
            '<span class="small muted">'+esc(v.by)+' · '+esc(v.when)+'</span></div>'+
            '<p class="small" style="margin:0;color:var(--muted-foreground)">'+esc(v.text)+'</p></div></div>';
        }).join('')+'</div>'
        : '<p class="small muted">No reviews yet.</p>');

  function scrCart(){
    var gs = cartGroups();
    if (!gs.length) return '<h1>Cart</h1>'+ emptyBox(
      'Nothing in the cart',
      'Offers you add from your requests land here.',
      '<button class="btn ghost" data-go="r.requests">'+esc(tr('Your requests'))+'</button>');
    var h = '<h1>Cart</h1><p class="sub">Grouped by shop and branch \u2014 each one is its own handover and its own cash payment. How the order reaches you is one choice, below.</p>';
    gs.forEach(function(g, i){
      var s = seller(g.seller), l = loc(g.seller, g.loc);
      h += '<div class="card" style="margin-bottom:12px"><div class="between" style="margin-bottom:10px">'+
        '<div class="grow stack"><p style="margin:0;font-weight:600">'+esc(s.name)+' — '+esc(l.label)+'</p>'+
        '<p class="small muted" style="margin:0">'+esc(l.addr)+'</p></div></div>';
      g.items.forEach(function(c){
        var o = offer(c.id);
        var flag = o.status==='removed'
          ? '<p class="small" style="margin:0"><b>No longer available</b> — remove it to continue</p>'
          : c.price!==o.price
            ? '<p class="small" style="margin:0">Price updated by the seller · <span class="struck">'+money(c.price)+'</span> → '+money(o.price)+' <button class="btn ghost sm" data-act="accept:'+o.id+'">Accept</button></p>'
            : '<p class="small muted" style="margin:0">'+esc(o.cond)+'</p>';
        h += '<div class="row" style="padding:10px 0;border:none">'+cover(o,'s')+
          '<div class="grow stack"><p style="margin:0">'+esc(o.title)+'</p>'+flag+'</div>'+
          '<div class="price" style="'+(o.status==='removed'?'text-decoration:line-through;color:var(--muted-foreground)':'')+'">'+money(o.price)+'</div>'+
          '<button class="btn ghost sm" data-act="rm:'+o.id+'">Remove</button></div>';
      });
      h += '<div class="between small" style="margin-top:10px"><span class="grow muted">'+
        (g.delivery==='courier' ? 'Books from this shop' : 'Collect at '+esc(l.addr))+
        '</span><span class="price">'+money(groupSub(g))+'</span></div></div>';
    });
    var canPickup = cartCanPickup(), mode = gs[0].delivery;
    var fee = orderFee();
    h += '<h2>How do you want it?</h2>'+
      '<div class="seg" style="margin-bottom:10px">'+
        '<button data-act="delall:courier" aria-pressed="'+(mode==='courier')+'">Courier</button>'+
        '<button data-act="delall:pickup" aria-pressed="'+(mode==='pickup')+'"'+(canPickup?'':' disabled')+'>Pickup</button>'+
      '</div>'+
      '<p class="hint">'+
        (!canPickup
          ? '<b>'+esc(noPickupAt().join(', '))+'</b> does not do pickup, so this order comes by courier. '+
            (gs.length>1 ? 'One courier, one trip: they collect from '+gs.length+' shops and bring everything together. ' : '')+
            money(db.deliveryFee)+' whatever the order holds.'
          : mode==='courier'
            ? (gs.length>1
                ? 'One courier, one trip: they collect from '+gs.length+' shops and bring everything to your door together. '+money(db.deliveryFee)+' whatever the order holds.'
                : 'A courier brings it to you. '+money(db.deliveryFee)+' whatever the order holds.')
            : (gs.length>1
                ? 'You collect from '+gs.length+' shops yourself, each with its own four-digit code. Nothing to pay for delivery.'
                : 'You collect it yourself, with a four-digit code. Nothing to pay for delivery.'))+'</p>'+
      '<div class="between small" style="margin-top:16px"><span class="grow muted">Books</span><span class="price">'+money(cartBooks())+'</span></div>'+
      (fee ? '<div class="between small" style="margin-top:4px"><span class="grow muted">Delivery \u00b7 one trip</span><span class="price">'+money(fee)+'</span></div>' : '')+
      '<div class="between" style="margin:10px 0 18px;border-top:1px solid var(--border);padding-top:10px"><span class="grow">Cash needed in total</span><span class="price" style="font-size:19px">'+money(cartTotal())+'</span></div>'+
      (cartBlocked() ? '<div class="note bad" style="margin-bottom:12px">Something changed since you added it. Sort the flagged lines out above and checkout opens.</div>' : '')+
      '<button class="btn wide" data-act="checkout"'+(cartBlocked()?' disabled':'')+'>Checkout</button>';
    return h;
  }

  function readyToReview(n, ph, ad, needAddr){
    return !!(String(n||'').trim() && String(ph||'').trim() && (!needAddr || String(ad||'').trim()));
  }
  /* Two screens, and each one fits a phone. The details are their own screen
     rather than an accordion inside the invoice, because four fields plus an
     invoice is more than a phone shows at once. */
  function scrCheckout(){
    var gs = cartGroups(), me = db.readers[db.me.readerId], d = view.draft;
    var anyCourier = gs.some(function(g){ return g.delivery==='courier' });
    var name  = d.name  !== undefined ? d.name  : (me.name||'');
    var phone = d.phone !== undefined ? d.phone : (me.phone||'');
    var addr  = d.addr  !== undefined ? d.addr  : (me.address||'');
    var cnote = d.note  !== undefined ? d.note  : (me.courierNote||'');
    var ready = readyToReview(name, phone, addr, anyCourier);

    /* ---------- the details screen ---------- */
    if (d.editDetails || !ready){
      return (ready
          ? '<button class="back" data-act="donedetails">← Order</button>'
          : '<button class="back" data-go="r.cart">← Cart</button>')+
        '<p class="eyebrow">'+(ready ? 'Your details' : 'Step 1 of 2 · your details')+'</p>'+
        '<h1>'+(anyCourier ? 'Where should it go?' : 'Who is collecting?')+'</h1>'+
        '<p class="sub">'+(anyCourier
          ? 'The courier calls before arriving.'
          : 'The bookseller needs a name to hold the book under.')+'</p>'+
        (d.err ? '<div class="err">'+esc(d.err)+'</div>' : '')+
        '<div class="two"><label class="f"><span>Name</span><input class="in" id="c_name" value="'+esc(name)+'"></label>'+
        '<label class="f"><span>Phone</span><input class="in" id="c_phone" value="'+esc(phone)+'" inputmode="tel"></label></div>'+
        (anyCourier
          ? '<label class="f"><span>Address in Yerevan</span><input class="in" id="c_addr" value="'+esc(addr)+'" placeholder="street, building, apartment"></label>'+
            '<label class="f"><span>Note for the courier (optional)</span>'+
            '<textarea class="in" id="c_note" style="min-height:60px" placeholder="Second entrance, gate code 4417. Call rather than ring.">'+esc(cnote)+'</textarea></label>'+
            '<p class="hint" style="margin-top:-6px">Only the courier sees this note. The bookseller never does.</p>'
          : '<div class="note" style="margin-bottom:16px">Everything here is a pickup, so there is no address to give.</div>')+
        '<button class="btn wide" id="toReview" data-act="donedetails"'+(ready?'':' disabled')+'>'+
          (ready ? 'Done' : (anyCourier ? 'Next — when should it come?' : 'Check the order'))+'</button>'+
        '<p class="hint" id="toReviewHint" style="margin-top:10px">'+
          (ready ? 'Kept for next time, so you only do this once.' : 'Fill the fields above and this opens.')+'</p>';
    }

    /* ---------- when should it come ----------
       Its own screen, not a row on the invoice: a day strip and six slots do
       not share a phone with an invoice, and this is a real decision — a
       reader who is out until Thursday needs to say so before the book is
       taken off a shelf for them. Pickup orders never see it; there the shop's
       opening hours and the three-day window already answer the question. */
    /* The screen opens on the earliest time we can actually promise, not on
       "as soon as possible". Opening on ASAP meant the screen already had an
       answer, so a reader who agreed with it never looked at the times at
       all \u2014 and the one control on the screen was pre-pressed, which is how
       you teach somebody that nothing here is theirs to decide.
       ASAP is the deliberate choice now: press it and the times go away,
       press it again and they come back with this same slot selected. */
    var wantWhen = (d.when && d.when.kind === 'slot') ? d.when : { kind:'slot', at: firstSlot() };
    if (anyCourier && (d.editWhen || !d.whenSet)){
      var days = slotDays();
      var dayKey = (d.whenDay !== undefined) ? d.whenDay : (wantWhen.kind==='slot' ? new Date(wantWhen.at).getDate() === new Date(now).getDate() ? 0 : 1 : 0);
      var day = days.filter(function(x){ return x.key===dayKey })[0] || days[0];
      /* A returning reader whose details are already on file never saw a
         "step 1", so they are not told they are on step 2. */
      var cameFromDetails = !d.whenSet && !ready;
      return (cameFromDetails
          ? '<button class="back" data-act="editdetails">← Your details</button>'
          : d.whenSet
            ? '<button class="back" data-act="donewhen">← Order</button>'
            : '<button class="back" data-go="r.cart">← Cart</button>')+
        '<p class="eyebrow">'+(cameFromDetails ? 'Step 2 of 2 · when' : 'Delivery time')+'</p>'+
        '<h1>When should it come?</h1>'+
        '<p class="sub">The shop has to find the book and a courier has to collect it, so the earliest we will promise is <b>'+esc(dayLabel(firstSlot()).toLowerCase())+', '+slotLabel(firstSlot())+'</b>. The courier calls before arriving.</p>'+
        /* This screen holds TWO controls feeding ONE decision — the card and
           the row of slots — so a tap is a choice, not a step. It selects and
           stays put, and the reader confirms with the button once they can see
           what they picked. (It did advance on tap for a while; that made the
           choice invisible the moment it was made, which is worse than the
           dead-button feeling it was fixing. The dead-button feeling is fixed
           by SHOWING the selection, which is what the strip above the button
           and the ring on the card now do.)
           A pick card that is a plain fork — the request-kind screen — still
           advances on tap. The difference is whether anything else on the
           screen feeds the same answer. */
        /* No "as soon as possible" in the first release. It sounded like a
           kindness and behaved like a blank cheque: the courier could turn up
           any time between the shop being ready and closing, and the reader
           had agreed to a time they were never told. Three days, six times a
           day, and the one they pick is the one the courier is given. */
        '<div class="seg" style="margin-bottom:12px">'+days.map(function(x){
          return '<button data-act="whenday:'+x.key+'" aria-pressed="'+(x.key===day.key)+'">'+esc(x.label)+'</button>';
        }).join('')+'</div>'+
        '<div class="wrap-row" style="margin-bottom:20px">'+day.slots.map(function(ts){
          var on = wantWhen.kind==='slot' && wantWhen.at===ts;
          return '<button class="chip'+(on?' solid':'')+'" data-act="setwhen:'+ts+'" aria-pressed="'+on+'" style="min-height:36px;padding:8px 14px">'+slotLabel(ts)+'</button>';
        }).join('')+'</div>'+
        /* One line, not a bordered card. It only has to say what was chosen,
           and it sits directly above the button that keeps it — a box around
           it cost 34px on a day that offers six slots, which was enough to
           push the button off the screen. */
        '<div class="between" style="margin-bottom:10px">'+
          '<span class="grow small" style="color:var(--muted-foreground)">Chosen</span>'+
          '<span style="font-weight:600;text-align:right">'+
            esc(dayLabel(wantWhen.at)+', '+slotLabel(wantWhen.at))+'</span></div>'+
        '<button class="btn wide" data-act="donewhen">'+(d.whenSet ? 'Done' : 'Keep this and check the order')+'</button>'+
        '<p class="hint" style="margin-top:10px">You can change it until a shop marks the book ready.</p>';
    }

    /* ---------- the invoice ---------- */
    var h = '<button class="back" data-go="r.cart">← Cart</button>'+
      '<h1>Order #'+freshId('', db.orders, 'ord', true)+'</h1>'+
      (view.p.brought
        ? '<div class="note" style="margin-bottom:14px"><b>'+view.p.brought+' book'+(view.p.brought>1?'s were':' was')+' already in your cart</b>, so '+(view.p.brought>1?'they are':'it is')+' in this order too — same address, same trip, one delivery fee.'+
          '<div class="btns" style="margin-top:10px"><button class="btn ghost sm" data-go="r.cart">Open the cart first</button></div></div>'
        : '')+
      '<p class="sub">Nothing is charged here. You pay cash, shop by shop, when each book reaches you.</p>'+
      '<div class="card" style="margin-bottom:16px"><div class="between"><div class="grow stack">'+
        '<p style="margin:0;font-weight:600">'+esc(name)+' · '+esc(phone)+'</p>'+
        (anyCourier ? '<p class="small muted" style="margin:0">'+esc(addr)+', Yerevan</p>'
                    : '<p class="small muted" style="margin:0">Pickup only — no address needed</p>')+
        (anyCourier && cnote ? '<p class="small muted" style="margin:0">For the courier: '+esc(cnote)+'</p>' : '')+
      '</div><button class="btn ghost sm" data-act="editdetails">Edit details</button></div>'+
      /* one line, not a labelled block: the invoice is already long, and
         "Delivery · tomorrow 18:00–20:00" says everything the label would */
      (anyCourier
        ? '<div class="between" style="margin-top:8px"><span class="grow small" style="color:var(--foreground)">Delivery · '+
            esc(whenShort(wantWhen))+'</span>'+
          '<button class="btn ghost sm" data-act="editwhen">Change time</button></div>'
        : '')+
      '</div>';

    gs.forEach(function(g, i){
      var sl = seller(g.seller), l = loc(g.seller, g.loc);
      h += '<div class="card" style="margin-bottom:12px">'+
        '<div class="between"><div class="grow stack">'+
          '<p style="margin:0;font-weight:600">'+esc(sl.name)+' — '+esc(l.label)+'</p>'+
          '<p class="small muted" style="margin:0">#'+db.seq.ord+'-'+'ABCDEFGH'[i]+' · '+
            (g.delivery==='courier' ? 'the courier brings it' : 'collect at '+esc(l.addr))+'</p>'+
        '</div><span class="chip dim">'+(g.delivery==='courier'?'courier':'pickup')+'</span></div>';
      g.items.forEach(function(c){ var o = offer(c.id);
        h += '<div class="row" style="padding:8px 0;border:none">'+cover(o,'s')+
          '<div class="grow stack"><p style="margin:0">'+esc(o.title)+'</p>'+
          '<p class="small muted" style="margin:0">'+esc(o.cond)+'</p></div>'+
          '<span class="price">'+money(o.price)+'</span></div>';
      });
      h += '<div class="between" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px">'+
        '<span class="grow small muted">'+(g.delivery==='courier' ? 'Books from this shop' : 'Pay '+esc(sl.name)+' in the shop')+'</span>'+
        '<span class="price">'+money(groupSub(g))+'</span></div>'+
      '</div>';
    });

    if (anyCourier)
      h += '<div class="between small" style="margin-top:14px"><span class="grow muted">Delivery \u00b7 one trip, whatever the order holds</span><span class="price">'+money(orderFee())+'</span></div>';
    /* the primary button grew to 48px, so the invoice gives 6px back here — a
       one-shop order stays inside the phone. Two shops and up it scrolls, and
       that is honest: an invoice is as long as the order is. */
    h += '<div class="between" style="margin:12px 0 14px;border-top:1px solid var(--border);padding-top:10px"><span class="grow">'+
      (anyCourier ? 'Pay the courier, all of it at once' : 'Cash needed in total')+'</span><span class="price" style="font-size:19px">'+money(cartTotal())+'</span></div>'+
      '<button class="btn wide" data-act="place">Approve and place the order</button>'+
      '<p class="hint" style="margin-top:12px">Approving closes the requests these books answered, and releases the other offers on them.</p>';
    return h;
  }

  /* ONE ORDER, IN FULL. Placing an order used to drop the reader into the
     orders LIST with a note on top, which answers "did it work" and nothing
     else \u2014 not what each shop is doing, not when it comes, not what to have
     ready. This is the order's own page: the same screen the reader comes
     back to, so the thing they saw at the end of checkout is the thing they
     recognise a day later. */
  function scrPlaced(){
    var ord = myOrders().filter(function(o){ return String(o.id)===String(view.p.id) })[0];
    if (!ord) return scrOrders();
    var justPlaced = !!view.p.justPlaced;
    var anyCourier = ord.subs.some(function(sb){ return sb.delivery==='courier' });
    var live = ord.subs.filter(function(sb){ return sb.status !== 'cancelled' });
    var cash = 0; live.forEach(function(sb){ cash += sb.total });
    var books = 0; live.forEach(function(sb){ books += sb.items.length });

    /* where the whole order has got to, in one line, from the slowest shop */
    var RANK = { placed:0, ready:1, shipped:2, completed:3, cancelled:3 };
    var slowest = live.reduce(function(acc, sb){
      return (RANK[sb.status] < RANK[acc]) ? sb.status : acc;
    }, 'completed');
    var STEPS = anyCourier
      ? [['placed','Placed','each shop confirms separately'],
         ['ready','Shops ready','waiting on the courier'],
         ['shipped','With the courier','on the way to you'],
         ['completed','Delivered','paid in cash at the door']]
      : [['placed','Placed','each shop confirms separately'],
         ['ready','Ready to collect','your code is below'],
         ['completed','Collected','paid at the counter']];

    var h = '<button class="back" data-go="r.orders">\u2190 Orders</button>'+
      (justPlaced
        ? '<p class="eyebrow" style="margin-bottom:4px">Order placed</p>'
        : '')+
      '<h1>Order #'+ord.id+'</h1>'+
      '<p class="sub">'+books+' book'+(books>1?'s':'')+' from '+live.length+
        ' shop'+(live.length>1?'s':'')+' \u00b7 '+money(cash + (anyCourier ? (ord.fee||0) : 0))+' in cash</p>';

    /* the state of the order, as a ladder rather than a word */
    h += '<div class="card" style="margin-bottom:14px"><p class="eyebrow">Where it is</p><div class="tl">'+
      STEPS.map(function(st){
        var cls = RANK[st[0]] < RANK[slowest] ? 'done' : (st[0] === slowest ? 'now' : '');
        return '<div class="'+cls+'"><i></i><span class="grow">'+st[1]+
          (cls === 'now' ? ' \u2014 '+st[2] : '')+'</span></div>';
      }).join('')+'</div>'+
      (anyCourier
        ? '<p class="small" style="margin:10px 0 0;color:var(--foreground)"><b>Arriving '+
          esc(whenShort(ord.when))+'</b> \u00b7 the time you chose. The courier calls before arriving.</p>'+
          (ord.addr ? '<p class="small muted" style="margin:4px 0 0">'+esc(ord.addr)+', '+esc(ord.city||'Yerevan')+'</p>' : '')+
          (ord.note ? '<p class="small muted" style="margin:4px 0 0">For the courier: '+esc(ord.note)+'</p>' : '')
        : '<p class="small" style="margin:10px 0 0;color:var(--foreground)">You collect these yourself, each with its own four-digit code.</p>')+
      '</div>';

    /* and then shop by shop, because that is how it is confirmed and paid */
    h += '<p class="eyebrow" style="margin-bottom:8px">Shop by shop</p><div class="stack-list">'+
      ord.subs.map(function(sb){
        var sl = seller(sb.seller), l = loc(sb.seller, sb.loc);
        var word = sb.status==='cancelled' ? 'cancelled'
                 : sb.status==='placed' ? 'waiting on the shop'
                 : sb.status==='ready' ? (sb.delivery==='courier' ? 'ready for the courier' : 'ready to collect')
                 : sb.status==='shipped' ? (sb.delivery==='courier' ? 'on its way' : 'waiting for you')
                 : 'done';
        return '<div class="card">'+
          '<div class="between"><div class="grow stack">'+
            '<p style="margin:0;font-weight:600">'+esc(sl.name)+' \u2014 '+esc(l.label)+'</p>'+
            '<p class="small muted" style="margin:0">'+sb.items.length+' book'+(sb.items.length>1?'s':'')+
              ' \u00b7 '+money(sb.total)+' cash '+(sb.delivery==='courier'?'to the courier':'at pickup')+'</p>'+
          '</div><span class="chip'+(sb.status==='cancelled'?' bad':'')+'">'+word+'</span></div>'+
          '<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">'+
          sb.items.map(function(id){ var b = offer(id);
            return '<div class="row" style="padding:6px 0;border:none">'+cover(b,'s')+
              '<div class="grow stack" style="gap:2px"><p style="margin:0">'+esc(b.title)+'</p>'+
              '<p class="small muted" style="margin:0">'+esc(b.author||'')+' \u00b7 '+esc(b.cond)+'</p></div>'+
              '<span class="price">'+money(b.price)+'</span></div>';
          }).join('')+'</div>'+
          (sb.delivery==='pickup' && sb.code && ['ready','shipped'].indexOf(sb.status)>=0
            ? '<div class="codebox" style="margin:10px 0 0"><span class="code">'+esc(sb.code)+'</span>'+
              '<span class="grow small muted">Read this out at the counter.</span></div>'
            : '')+
        '</div>';
      }).join('')+'</div>';

    if (ord.closed.length)
      h += '<p class="hint" style="margin-top:14px">The '+ord.closed.length+' request'+(ord.closed.length>1?'s':'')+
        ' these books answered '+(ord.closed.length>1?'are':'is')+' now closed'+
        (ord.released ? ', and '+ord.released+' other offer'+(ord.released>1?'s were':' was')+
         ' released \u2014 their shops have been told' : '')+'.</p>';

    h += '<div class="page-tail"><button class="btn wide" data-go="r.orders">All your orders</button></div>';
    return h;
  }

  /* one header per order, then one card per bookseller inside it.
     The address, the phone and the note are printed once, at the top. */
  function orderBlock(ord, subs){
    /* the header opens the order's own page — the same one checkout ends on */
    /* a cancelled handover is not coming and costs nothing: it does not keep
       the delivery fee, the arrival time or "one delivery" alive */
    var anyCourier = subs.some(function(sb){ return sb.delivery==='courier' && sb.status!=='cancelled' });
    var allGone = subs.every(function(sb){ return sb.status==='cancelled' });
    var cash = 0; subs.forEach(function(sb){ if (sb.status!=='cancelled') cash += sb.total });
    var shops = {}; subs.forEach(function(sb){ shops[sb.seller] = 1 });
    var nShops = Object.keys(shops).length;
    if (allGone) return '<div style="margin-bottom:26px">'+
      '<button class="opens" style="padding:0" data-go="r.placed" data-p="'+ord.id+'"><p class="book-t" style="font-size:16px;line-height:22px">Order #'+ord.id+'</p></button>'+
      '<p class="small" style="margin:2px 0 10px;color:var(--foreground)"><b>Cancelled · nothing to pay.</b> Your request is open again, and the other offers on it are back.</p>'+
      '<div class="stack-list">'+subs.map(function(sb){ return orderCard(ord, sb) }).join('')+'</div></div>';
    return '<div style="margin-bottom:26px">'+
      '<div class="between" style="margin-bottom:8px"><div class="grow stack">'+
        '<button class="opens" style="padding:0" data-go="r.placed" data-p="'+ord.id+'">'+
          '<p class="book-t" style="font-size:16px;line-height:22px">Order #'+ord.id+'</p></button>'+
        '<p class="small muted" style="margin:0">'+handovers(subs.length, nShops)+
          ' · '+money(cash + (anyCourier ? (ord.fee||0) : 0))+' in cash'+(anyCourier ? ' · one delivery' : '')+(anyCourier && ord.addr ? ' · '+esc(ord.addr) : '')+'</p>'+
        (anyCourier && ord.when
          ? '<p class="small" style="margin:2px 0 0;color:var(--foreground)"><b>'+
            (ord.when.kind==='slot'
              ? 'Arriving '+esc(dayLabel(ord.when.at).toLowerCase())+', '+slotLabel(ord.when.at)
              : 'Arriving as soon as every shop is ready')+'</b>'+
            (ord.when.kind==='slot' ? ' · the time you chose' : '')+'</p>'+
            (canRetime(ord) ? '<button class="btn link" style="min-height:32px;padding:0" data-go="r.when" data-p="'+ord.id+'">Change time</button>' : '')
          : '')+
        (anyCourier && ord.note ? '<p class="small muted" style="margin:0">For the courier: '+esc(ord.note)+'</p>' : '')+
      '</div></div>'+
      '<div class="stack-list">'+subs.map(function(sb){ return orderCard(ord, sb) }).join('')+'</div>'+
      '</div>';
  }

  /* two branches of one shop are two handovers, not "1 bookseller" */
  function handovers(nSubs, nShops){
    return nSubs+' handover'+(nSubs > 1 ? 's' : '')+(nShops < nSubs ? ' from '+(nShops === 1 ? 'one shop' : nShops+' shops') : '');
  }
  /* The checkout promises "you can change it until a shop marks the book
     ready". Until now nothing after checkout kept that promise. */
  function canRetime(ord){
    return ord.subs.some(function(sb){ return sb.delivery === 'courier' && sb.status !== 'cancelled' }) &&
           ord.subs.every(function(sb){ return sb.delivery !== 'courier' || ['placed','confirmed','cancelled'].indexOf(sb.status) >= 0 });
  }
  function scrOrderWhen(){
    var ord = myOrders().filter(function(o){ return String(o.id) === String(view.p.id) })[0];
    if (!ord || !canRetime(ord)) return scrOrders();
    var d = view.draft, days = slotDays();
    var want = (d.when && d.when.kind === 'slot') ? d.when : (ord.when && ord.when.kind === 'slot' ? ord.when : { kind:'slot', at: firstSlot() });
    var dayKey = d.whenDay !== undefined ? d.whenDay : (days.filter(function(x){ return x.slots.indexOf(want.at) >= 0 })[0] || days[0]).key;
    var day = days.filter(function(x){ return x.key === dayKey })[0] || days[0];
    return '<button class="back" data-go="r.orders">← Orders</button>'+
      '<p class="eyebrow">Order #'+ord.id+'</p><h1>Change the delivery time</h1>'+
      '<p class="sub">Possible until a shop marks the book ready. The courier is given the new time.</p>'+
      '<div class="seg" style="margin-bottom:12px">'+days.map(function(x){
        return '<button data-act="whenday:'+x.key+'" aria-pressed="'+(x.key===day.key)+'">'+esc(x.label)+'</button>';
      }).join('')+'</div>'+
      '<div class="wrap-row" style="margin-bottom:20px">'+day.slots.map(function(ts){
        var on = want.at === ts;
        return '<button class="chip'+(on?' solid':'')+'" data-act="setwhen:'+ts+'" aria-pressed="'+on+'" style="min-height:36px;padding:8px 14px">'+slotLabel(ts)+'</button>';
      }).join('')+'</div>'+
      '<div class="between" style="margin-bottom:10px"><span class="grow small muted">Chosen</span>'+
        '<span style="font-weight:600;text-align:right">'+esc(dayLabel(want.at)+', '+slotLabel(want.at))+'</span></div>'+
      '<button class="btn wide" data-act="retime:'+ord.id+'">Keep this time</button>';
  }
  function scrOrders(){
    /* the rating comes first, once */
    var due = pendingRating();
    var rateCard = (due && !view.p.noRate)
      ? '<div class="card" style="margin-bottom:16px"><div class="between" style="flex-wrap:wrap;gap:10px">'+
          '<p class="grow" style="margin:0;font-weight:600">How was '+esc(seller(due.sb.seller).name)+'?</p>'+
          '<div class="btns"><button class="btn sm" data-act="rate:'+due.o.id+':'+due.sb.no+'">Rate</button>'+
          '<button class="btn ghost sm" data-act="skiprate:'+due.o.id+':'+due.sb.no+'">Not now</button></div></div></div>'
      : '';
    if (!myOrders().length) return '<h1>Orders</h1>'+ emptyBox(
      'No orders yet',
      'Orders you place stay here until the book is in your hands.',
      '<button class="btn ghost" data-go="r.requests">'+esc(tr('Your requests'))+'</button>');
    /* the confirmation that used to be its own screen */
    var fresh = view.p.justPlaced ? myOrders().filter(function(o){ return o.id === view.p.justPlaced })[0] : null;
    var top = '';
    if (fresh){
      var nShops = {}; fresh.subs.forEach(function(sb){ nShops[sb.seller]=1 });
      top = '<div class="note hard" style="margin-bottom:18px">'+
        '<p style="margin:0;font-weight:600">Order #'+fresh.id+' is placed.</p>'+
        '<p class="small" style="margin:8px 0 0;color:var(--foreground)">'+
          handovers(fresh.subs.length, Object.keys(nShops).length)+
          ' · '+money(fresh.total)+' in cash'+
          (fresh.delivery==='courier'
            ? ' to the courier, '+esc(whenShort(fresh.when))
            : ' at the counter, with a four-digit code each')+'. Each shop confirms separately.</p>'+
        (fresh.closed.length
          ? '<p class="small muted" style="margin:8px 0 0">The '+fresh.closed.length+' request'+(fresh.closed.length>1?'s':'')+
            ' '+(fresh.closed.length>1?'these books answered are':'this book answered is')+' now closed'+
            (fresh.released ? ', and '+fresh.released+' other offer'+(fresh.released>1?'s were':' was')+' released — their shops have been told' : '')+'.</p>'
          : '')+
        '</div>';
    }
    var subs = [];
    myOrders().forEach(function(o){ o.subs.forEach(function(sb){ subs.push({o:o, sb:sb}) }) });
    subs.reverse();
    var isPast = function(x){ return ['completed','cancelled'].indexOf(x.sb.status)>=0 };
    var live = subs.filter(function(x){ return !isPast(x) });
    var past = subs.filter(isPast);

    /* keep the order's own grouping, newest order first */
    function blocks(list){
      var seen = [], byId = {};
      list.forEach(function(x){
        if (!byId[x.o.id]){ byId[x.o.id] = []; seen.push(x.o); }
        byId[x.o.id].push(x.sb);
      });
      return seen.map(function(o){ return orderBlock(o, byId[o.id]) }).join('');
    }

    var tab = view.p.tab || 'live';
    var spent = 0; past.forEach(function(x){ if (x.sb.status==='completed') spent += x.sb.total });
    var h = top + '<h1>Orders</h1>'+ rateCard +
      '<div class="seg" style="margin-bottom:16px">'+
        '<button data-act="otab:live" aria-pressed="'+(tab==='live')+'">On the way'+(live.length?' · '+live.length:'')+'</button>'+
        '<button data-act="otab:past" aria-pressed="'+(tab==='past')+'">Finished'+(past.length?' · '+past.length:'')+'</button>'+
      '</div>';
    if (tab === 'live'){
      h += ''+
        (live.length ? blocks(live) : emptyBox('Nothing on its way',
          'Orders you place stay here until the book reaches you.',
          '<button class="btn ghost" data-go="r.requests">'+esc(tr('Your requests'))+'</button>'));
    } else {
      h += '<p class="sub">'+(past.length ? past.length+' finished · '+money(spent)+' spent on books so far.' : 'Nothing finished yet.')+'</p>'+
        (past.length ? blocks(past) : emptyBox('Nothing finished yet',
          'Completed and cancelled orders are kept here, with what you paid and who you paid it to.'));
    }

    /* prototype-only: walk the shop's side forward without leaving this build */
    var next = subs.filter(function(x){ return ['placed','confirmed','ready','shipped'].indexOf(x.sb.status)>=0 })[0];
    if (next){
      var sb = next.sb, label = sb.status==='placed'
          ? (sb.delivery==='pickup' ? 'the shop puts it aside, ready for pickup' : 'the shop marks it ready for delivery')
        : sb.status==='ready' ? 'the courier collects it from the shop'
        : (sb.delivery==='pickup' ? 'the shop takes the book and enters your code' : 'the courier delivers it and takes the cash');
      h += '<div class="demo"><p>Prototype — the shop’s side</p>'+
        '<button class="btn ghost sm" style="white-space:normal;text-align:left" data-act="advance:'+next.o.id+':'+sb.no+'">Next: '+label+'</button></div>';
    }
    return h;
  }

  function orderCard(ord, sb){
    var s = seller(sb.seller), l = loc(sb.seller, sb.loc);
    var open = view.open === sb.no;
    var TRACK = sb.delivery==='courier'
      ? [['placed','Ordered'],['ready','Waiting for the courier'],['shipped','On the way'],['completed','Delivered']]
      : [['placed','Ordered'],['shipped','In the shop, ready'],['completed','Collected']];
    var order = TRACK.map(function(t){ return t[0] });
    var idx = order.indexOf(sb.status==='confirmed' && sb.delivery==='courier' ? 'ready' : sb.status);
    var label = sb.status==='cancelled' ? 'cancelled' : (TRACK[idx] ? TRACK[idx][1].toLowerCase() : sb.status);
    var head = '<button class="card-row'+(open?' on':'')+'" data-act="toggle:'+sb.no+'" style="flex-direction:column;gap:8px" aria-expanded="'+open+'">'+
      '<div class="between" style="width:100%"><div class="grow stack">'+
        /* the reader ordered a book, not a shop: the title leads, the shop
           and the money are the small print under it */
        '<p style="margin:0;font-weight:600">'+sb.items.map(function(id){ return esc(offer(id).title) }).join(' \u00b7 ')+'</p>'+
        '<p class="small muted" style="margin:0">'+esc(s.name)+' \u2014 '+esc(l.label)+' \u00b7 '+money(sb.total)+' cash \u00b7 #'+sb.no+'</p>'+
      '</div><span class="chip'+(['shipped','ready'].indexOf(sb.status)>=0?'':' dim')+'">'+label+'</span></div>'+
      /* the one thing the reader needs at the counter is on the card itself,
         not behind "see the books": the code, where, and until when */
      (sb.delivery==='pickup' && sb.status==='shipped' && sb.code
        ? '<div class="codebox" style="margin:2px 0 0;width:100%;padding:10px 12px"><span class="code" style="font-size:22px;line-height:26px">'+esc(sb.code)+'</span>'+
            '<span class="small grow" style="color:var(--foreground)">Your code · say it at the counter<br><span class="muted">'+esc(l.addr)+' · '+esc(l.hours)+'</span></span></div>'
        : '')+
      '<span class="disc">'+(open?'\u25be hide the books':'\u25b8 see the books')+'</span></button>';
    if (!open) return head;

    var body = '<div class="card" style="margin-top:-4px;border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg)">';
    if (sb.status !== 'cancelled'){
      body += '<div class="tl">'+TRACK.map(function(t, i){
        var cls = i < idx ? 'done' : i === idx ? 'now' : '';
        return '<div class="'+cls+'"><i></i>'+t[1]+'</div>';
      }).join('')+'</div>';
    }
    sb.items.forEach(function(id){ var o = offer(id);
      body += '<div class="row" style="padding:8px 0;border:none">'+cover(o,'s')+
        '<div class="grow stack"><p style="margin:0">'+esc(o.title)+'</p>'+
        '<p class="small muted" style="margin:0">'+esc(o.author||'')+' \u00b7 '+esc(o.cond)+'</p></div>'+
        '<div class="price">'+money(o.price)+'</div></div>';
    });
    body += '<div class="between" style="margin-top:8px"><span class="grow">'+
      (sb.delivery==='courier' ? 'Books from this shop' : 'To pay in cash here')+
      '</span><span class="price">'+money(sb.books)+'</span></div>';

    if (sb.status==='placed' && sb.delivery==='courier'){
      body += whenLine(ord);
    }
    if (sb.status==='placed'){
      body += '<div class="note" style="margin-top:12px">With the shop for '+ago(sb.placedAt||now)+
        '. They confirm it when the book is in their hands. If it sits here too long, tell us and we will chase it.</div>';
    }

    if (sb.status==='shipped' && sb.delivery==='pickup'){
      body += '<hr style="margin:16px 0">'+
        '<p class="eyebrow">Ready for pickup</p>'+
        '<p style="margin:0">'+esc(l.addr)+'</p>'+
        '<p class="small muted" style="margin:4px 0 0">'+esc(l.hours)+' \u00b7 ask for order #'+sb.no+'</p>'+
        '<p class="small" style="margin:6px 0 0;color:var(--foreground)">Put aside for you '+ago(sb.readyAt||now)+' ago. It is held until you come \u2014 tell the shop if you need longer.</p>';
    } else if (sb.status==='ready' && sb.delivery==='courier'){
      body += '<hr style="margin:16px 0"><p class="eyebrow">Waiting for the courier</p>'+
        '<p class="small muted" style="margin:0">The shop has it wrapped and ready. A courier collects it next.</p>'+
        whenLine(ord);
    } else if (sb.status==='shipped'){
      body += '<hr style="margin:16px 0"><p class="eyebrow">With the courier</p>'+
        '<p class="small muted" style="margin:0">They call before arriving. Have '+money(sb.total)+' ready \u2014 a delivery needs no code, the courier closes it.</p>'+
        whenLine(ord);
    }

    if (sb.status==='shipped' && sb.code && sb.delivery==='pickup'){
      body += '<div class="codebox"><div class="grow"><p class="eyebrow" style="margin-bottom:4px">Your code</p><span class="code">'+esc(sb.code)+'</span></div>'+
        '<p class="small muted" style="margin:0;flex:1;min-width:180px">Give these four digits when you take the book. '+
        'Until then the copy is held for you, at this price. Entering it is how the shop closes the order \u2014 and how your review gets published.</p></div>';
    }
    if (sb.status==='completed'){
      body += '<div class="note" style="margin-top:14px">'+
        (sb.by==='courier' ? 'Delivered by the courier.' : sb.by==='code' ? 'Handed over at the shop with code '+esc(sb.code)+'.' : 'You confirmed you have it.')+' '+
        (sb.reviewed ? 'You rated this shop.' : 'You can rate the shop now.')+'</div>';
    }

    var acts = '<div class="btns" style="margin-top:14px">';
    if (sb.status==='placed') acts += cbtn('btn ghost sm','cancel:'+ord.id+':'+sb.no,'Cancel this order','Yes, cancel');
    if (sb.status==='shipped') acts += '<button class="btn sm" data-act="received:'+ord.id+':'+sb.no+'">I have it \u2014 mark as received</button>';
    if (sb.status==='completed' && !sb.reviewed) acts += '<button class="btn sm" data-act="rate:'+ord.id+':'+sb.no+'">Rate '+esc(s.name)+'</button>';
    if (sb.status==='cancelled') acts += '<span class="chip dim">cancelled'+(sb.cancelReason?' \u00b7 '+esc(sb.cancelReason):'')+' \u00b7 the request reopened</span>';
    acts += '</div>';
    if (sb.status==='completed'){
      acts += sb.disputed
        ? '<div class="note" style="margin-top:10px">You flagged a problem with this order. It is held out of the shop\u2019s statement until someone looks at it.</div>'
        : reasonBlock('Something was wrong with this order', 'dispute:'+ord.id+':'+sb.no,
            ['not as described', 'damaged', 'wrong book', 'never arrived'],
            'Tell us what happened. It holds the shop\u2019s commission on this order until someone looks at it.');
    }
    return head + body + acts + '</div>';
  }

  /* A sale this reader has finished and not yet judged. The rating is asked
     ONCE, at the moment the books are in their hands and the shop is still a
     memory rather than a name on a list \u2014 so the orders screen shows this
     instead of itself until it is answered or skipped. Skipping is a real
     answer and is remembered; we do not ask twice. */
  /* Orders this reader placed. Until there was seeded history every order in
     db belonged to the person looking, so this screen filtered nothing and was
     right by accident; the moment three finished orders from other readers
     were seeded for the money screens, Dina's Orders tab showed them. One
     list function, used everywhere the reader is the audience. */
  function myOrders(){
    return db.orders.filter(function(o){ return o.reader === db.me.readerId });
  }
  function pendingRating(){
    var out = null;
    db.orders.forEach(function(o){
      if (o.reader !== db.me.readerId) return;
      o.subs.forEach(function(sb){
        if (out) return;
        if (sb.status === 'completed' && !sb.reviewed && !sb.rateSkipped) out = { o:o, sb:sb };
      });
    });
    return out;
  }

  function scrReview(){
    var ord = db.orders.filter(function(o){ return String(o.id)===String(view.p.id) })[0];
    var sb = ord && ord.subs.filter(function(x){ return x.no===view.p.no })[0];
    if (!sb) return scrOrders();
    var s = seller(sb.seller);
    var n = view.draft.stars || 0;
    return '<button class="back" data-act="skiprate:'+ord.id+':'+sb.no+'">\u2190 Orders</button>'+
      '<h1>How was '+esc(s.name)+'?</h1><p class="sub">'+sb.items.length+' book'+(sb.items.length>1?'s':'')+' · received today</p>'+
      '<div class="stars big" style="margin:8px 0 20px">'+[1,2,3,4,5].map(function(i){
        return '<button data-act="star:'+i+'" data-on="'+(i<=n?1:0)+'" aria-label="'+i+' stars">'+(i<=n?'★':'☆')+'</button>';
      }).join('')+'</div>'+
      '<label class="f"><span>Anything the next buyer should know? (optional)</span><textarea class="in" id="rv_text" style="min-height:80px"></textarea></label>'+
      '<div class="seg" style="margin-bottom:18px">'+['As described','Fast','Well packed','Fair price'].map(function(t){
        return '<button data-act="quick:'+encodeURIComponent(t)+'">'+t+'</button>';
      }).join('')+'</div>'+
      '<div class="page-tail">'+
        '<button class="btn wide" data-act="postreview"'+(n?'':' disabled')+'>Publish review</button>'+
